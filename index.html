        (buzz ? '' : race ? `<td class="n">${s.finished ? esc(left ? fmtLeft(b - s.time) : fmtClock(s.time)) : esc(rec.format === 'clock' ? t('flagged') : t('notFinished'))}</td>` : `<td class="n">${Math.round(s.perf)}</td>`) + '</tr>';
      h += `<p class="duel-head${rec.outcome === 1 ? ' win' : ''}">${esc(head)}</p><p class="res-sub">${esc(cfgText(D.cfg))}</p>`;
      h += `<div class="sheet"><div class="scroll"><table><thead><tr><th>${esc(t('player'))}</th><th class="n">${esc(t('level'))}</th>` +
        `<th class="n">${esc(buzz ? t('pointsCol') : t('score'))}</th>` + (buzz ? '' : `<th class="n">${esc(left ? t('leftCol') : rec.format === 'clock' ? t('clockCol') : race ? t('time') : t('perf'))}</th>`) + '</tr></thead><tbody>' +
        row(rec.me, rec.budget) + row(rec.opp, rec.oppBudget || rec.budget, rec.opp.v ? 'ok' : 'no') + '</tbody></table></div>' +

      if (buzz) h += bzTasksHtml(D.bzLog, rec.me.level);

      if (status) h += `<p class="status">${esc(status)}</p>`;
      h += msgHtml();
      h += '<div class="actions">' + (linked() && !D.again.me ? `<button class="btn primary" id="dAgain" type="button">${esc(t('rematch'))}</button>` : '') +
        `<button class="btn" id="dBack" type="button">${esc(D.lobby ? t('toLobby') : t('menu'))}</button></div>`;

    on('dStart', () => { audioReady(); startRound(); });
    const warmMic = () => { if (S.input === 'voice' && SR) Voice.start(() => {}, () => {}); };
    on('dReady', () => { audioReady(); warmMic(); guestReady(); });
    on('dAgain', () => {
      if (D.role === 'guest') warmMic();
      D.again.me = true;
      send({ t: 'again' });
      if (D.role === 'host' && D.again.opp) startRound(); else renderDuel();
    });
    on('dRaceScale', () => { DF.raceScale = DF.raceScale === false; saveDF(); renderDuel(); $('#dRaceScale').focus(); });
    on('dBack', () => {

  }

  $('#duel').addEventListener('click', e => { const b = e.target.closest('[data-pf]'); if (b && Board) Board.openByName(b.dataset.pf, 'duel'); });

  /* ----- duel lobby: how many are online, and open challenges anyone can join -----
     A shared channel on the same relays as the duels. It is not encrypted, because everyone has to be able to read it.
     Its name contains the task set and the duel protocol, so only compatible versions see each other.
     Every page sends its state there: active or away, plus at most one open challenge (code, name, duel rating, settings).
     - The state goes out when it changes and again every 30 s. A page not heard from on any relay for 100 s is dropped.
     - A page that connects asks "who's here?", and everyone answers on that relay at once, so the list fills right away.
     - Leaving: "bye" on every relay. If a connection breaks, the relay sends the "bye" itself (MQTT last will).
     - Each relay is tracked on its own: one relay losing someone doesn't remove them while another one still hears them.
     Active = tab visible, window focused and some input in the last 5 minutes; a running round always counts.
     Joining a challenge is the normal duel handshake with its code; a second joiner gets the usual "already two players".
     Verified names: a signed-in player's entry carries a signature (v) over this page's ID and the whole entry, made with
     the device key registered for the name; everyone checks it against the name registry and shows ✓ or "guest".
     Copying an entry to another page ID or changing any field breaks the signature. */
  const BALL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +   // Mathefußball (1.30)
    '<circle cx="12" cy="12" r="9"/><path d="M12 7.6l4.2 3-1.6 4.9H9.4l-1.6-4.9z"/><path d="M12 3v4.6M16.2 10.6l4.3-1.4M14.6 15.5l2.6 3.7M9.4 15.5l-2.6 3.7M7.8 10.6L3.5 9.2"/></svg>';
  Lobby = (() => {
    const TOPIC = `kopfrechnen/lobby1/${Core.TASKSET}-${DUEL_PV}`;
    const REFRESH = 30000, EXPIRE = 100000, IDLE = window.__KR_IDLE_MS || 300000, SHOW = 4, MAXLIST = 30, MAXPEERS = 300;
    const CODE_RE = new RegExp(`^[${CODE_ABC}]{6}$`);
    const id = hex(crypto.getRandomValues(new Uint8Array(6)));
    const peers = new Map();    // id -> { q, a, c, since, seen: Map(relay index -> last heard) }
    const counts = new Map();   // id -> [window start, messages]: guard against floods
    let clients = [], status = 'idle', startedAt = 0, ticker = 0;
    let seq = 0, mySig = '', myState = { a: 0, c: null }, lastSent = 0, sendTimer = 0;
    let lastInput = Date.now(), lastMove = 0, showAll = false, renderTimer = 0, shownSig = '', alerted = false;

    const focused = () => (window.__KR_FOCUS != null ? !!window.__KR_FOCUS : document.hasFocus());
    const active = () => document.visibilityState === 'visible' && focused() && (!!(G && G.running) || !!(Ball && Ball.live()) || Date.now() - lastInput < IDLE);
    const entry = d => ({ code: d.code, name: d.me.name, r: d.lobbyR, nd: d.lobbyN, cfg: d.cfg });
    function mine() {   // my open challenge, as long as nobody has joined it (sent exactly as others will clean it, so the signature fits)
      if (!D || !D.posted || D.role !== 'host' || D.st !== 'hosting' || D.partner || !D.link || !D.code) return null;
      const c = clean(entry(D));
      if (c) c.v = D.lobbyClaim || null;
      return c;
    }
    const signed = (pid, c) => [pid, c.code, c.name, c.r, c.nd, c.cfg];   // what the signature of an entry covers
    /* Mathefußball rooms (1.30): a page hosting a public room that is open for joining adds it to its state as f.
       Signed like a challenge (over this page's ID, code, host name and settings), so a ✓ can't be copied. */
    const fSigned = (pid, f) => [pid, 'ball', f.code, f.name, f.cfg];
    function cleanRoom(f) {
      if (!f || typeof f !== 'object' || typeof f.code !== 'string' || !CODE_RE.test(f.code) || !Ball || num(f.pv) !== Ball.PV) return null;
      const name = clip(f.name), v = f.v;
      if (!name) return null;
      return { code: f.code, name, cfg: Ball.norm(f.cfg || {}), n: Math.max(0, Math.min(99, Math.round(num(f.n)))), pv: Ball.PV,
        v: v && typeof v === 'object' && typeof v.n === 'string' && typeof v.d === 'string' && typeof v.g === 'string' && v.n.length <= 30 && v.d.length <= 20 && v.g.length <= 100
          ? { n: v.n, d: v.d, g: v.g } : null };
    }
    function myRoom() { const f = Ball && Ball.entry(), c = f && cleanRoom(f); if (c) c.v = f.v || null; return c; }
    async function claimRoom(f) { const c = Acct && cleanRoom(f); return c ? Acct.claim('lobby', c.name, fSigned(id, c)) : null; }
    async function claim(d) {
      const c = Acct && clean(entry(d));
      return c ? Acct.claim('lobby', c.name, signed(id, c)) : null;
    }
    /* Devices signed in to the same account send the same tag, so the online count shows them once.
       Tag = first 16 hex of SHA-256 over the day (UTC) and the account key: only devices with the key can make it,
       it changes every day and reveals neither the name nor the key. */
    let tag = null, tagSrc = '';
    function refreshTag() {
      const a = Acct && Acct.state, k = a && a.rt && a.key ? String(a.key).toUpperCase().replace(/[^0-9A-Z]/g, '') : '';
      const src = k ? new Date().toISOString().slice(0, 10) + '|' + k : '';
      if (src === tagSrc) return;
      tagSrc = src; tag = null;
      if (!src) { sync(); return; }
      crypto.subtle.digest('SHA-256', new TextEncoder().encode('kopfrechnen-lobby-presence:' + src))
        .then(h => { if (tagSrc === src) { tag = hex(new Uint8Array(h)).slice(0, 16); sync(); } }).catch(() => {});
    }
    const stateText = () => JSON.stringify(Object.assign({ k: 's', id, q: seq, a: myState.a, c: myState.c }, myState.f ? { f: myState.f } : {}, myState.u ? { u: myState.u } : {}));
    function publishAll(text) { for (const c of clients) if (c.connected) c.publish(TOPIC, text, { qos: 0 }); }

    /* Send my state when it has changed; with force, send it again as a sign of life.
       Changes of the challenge go out at once; going active/away at most once per second. */
    function sync(force) {
      const st = { a: active() ? 1 : 0, c: mine(), f: myRoom(), u: tag };
      const sig = JSON.stringify(st), now = Date.now();
      if (sig === mySig) { if (force) { lastSent = now; publishAll(stateText()); } return; }
      if (JSON.stringify(st.c) === JSON.stringify(myState.c) && now - lastSent < 1000) {
        if (!sendTimer) sendTimer = setTimeout(() => { sendTimer = 0; sync(); }, 1000 - (now - lastSent));
        return;
      }
      mySig = sig; myState = st; seq++; lastSent = now;
      publishAll(stateText());
      scheduleRender();
    }

    function clean(c) {   // an open challenge from someone else, checked field by field
      if (!c || typeof c !== 'object' || typeof c.code !== 'string' || !CODE_RE.test(c.code) || !c.cfg || typeof c.cfg !== 'object') return null;
      const name = clip(c.name);
      if (!name) return null;
      const r = Math.round(num(c.r, 1000)), v = c.v;
      return { code: c.code, name, r: r > 0 && r < 10000 ? r : 1000, nd: Math.max(0, Math.min(99999, Math.round(num(c.nd)))), cfg: normCfg(c.cfg),
        v: v && typeof v === 'object' && typeof v.n === 'string' && typeof v.d === 'string' && typeof v.g === 'string' && v.n.length <= 30 && v.d.length <= 20 && v.g.length <= 100
          ? { n: v.n, d: v.d, g: v.g } : null };
    }
    /* check an entry's signature once per entry; until the answer is there the row shows neither ✓ nor "guest" */
    function verify(pid, p) {
      const c = p.c, vk = c ? JSON.stringify([c.code, c.name, c.r, c.nd, c.cfg, c.v]) : '';
      if (vk === p.vk) return;
      p.vk = vk;
      if (!c || !c.v || !Acct) { p.vf = 'no'; return; }
      p.vf = 'wait';
      Acct.check(c.v, 'lobby', c.name, signed(pid, c)).catch(() => null).then(ok => {
        if (p.vk !== vk) return;
        p.vf = ok ? 'ok' : 'no';
        if (ok === null) setTimeout(() => { if (p.vk === vk && peers.get(pid) === p) { p.vk = ''; verify(pid, p); } }, 30000);   // registry not reachable: again later
        scheduleRender();
      });
    }
    function verifyRoom(pid, p) {   // the same for a room's host name
      const f = p.f, vk = f ? JSON.stringify([f.code, f.name, f.cfg, f.v]) : '';
      if (vk === p.fvk) return;
      p.fvk = vk;
      if (!f || !f.v || !Acct) { p.fvf = 'no'; return; }
      p.fvf = 'wait';
      Acct.check(f.v, 'lobby', f.name, fSigned(pid, f)).catch(() => null).then(ok => {
        if (p.fvk !== vk) return;
        p.fvf = ok ? 'ok' : 'no';
        if (ok === null) setTimeout(() => { if (p.fvk === vk && peers.get(pid) === p) { p.fvk = ''; verifyRoom(pid, p); } }, 30000);
        scheduleRender();
      });
    }
    function flood(pid) {
      const now = Date.now();
      let e = counts.get(pid);
      if (!e || now - e[0] > 30000) { if (counts.size > 2000) counts.clear(); e = [now, 0]; counts.set(pid, e); }
      return ++e[1] > 100;
    }
    function receive(i, text) {
      if (text.length > 2000) return;
      let m;
      try { m = JSON.parse(text); } catch (e) { return; }
      if (!m || typeof m !== 'object' || typeof m.id !== 'string' || !/^[0-9a-f]{12}$/.test(m.id) || m.id === id || flood(m.id)) return;
      if (m.k === 'q') { const c = clients[i]; if (c && c.connected) c.publish(TOPIC, stateText(), { qos: 0 }); return; }
      let p = peers.get(m.id);
      if (m.k === 'b') { if (p && p.seen.delete(i) && !p.seen.size) { peers.delete(m.id); scheduleRender(); } return; }
      if (m.k !== 's') return;
      const now = Date.now();
      if (!p) { if (peers.size >= MAXPEERS) return; p = { q: -1, a: 0, c: null, u: null, since: 0, seen: new Map(), vk: '', vf: '', f: null, fsince: 0, fvk: '', fvf: '' }; peers.set(m.id, p); }
      const fresh = !p.seen.size;
      p.seen.set(i, now);
      const q = Number.isSafeInteger(m.q) ? m.q : 0;
      if (q > p.q) {   // the same state arrives once per relay; only a newer one counts
        const c = clean(m.c);
        if (!c || !p.c || c.code !== p.c.code) p.since = c ? now : 0;
        p.q = q; p.a = m.a === 1 ? 1 : 0; p.c = c; p.u = typeof m.u === 'string' && /^[0-9a-f]{16}$/.test(m.u) ? m.u : null;
        verify(m.id, p);
        const f = cleanRoom(m.f);
        if (!f || !p.f || f.code !== p.f.code) p.fsince = f ? now : 0;
        p.f = f;

        scheduleRender();
      } else if (fresh) scheduleRender();
    }
    function prune() {
      const now = Date.now();
      let changed = false;
      for (const [pid, p] of peers) {
        for (const [i, at] of p.seen) if (now - at > EXPIRE) p.seen.delete(i);
        if (!p.seen.size) { peers.delete(pid); changed = true; }
      }
      if (changed) scheduleRender();
    }

    function updStatus() {
      const st = clients.some(c => c.connected) ? 'on' : Date.now() - startedAt < 10500 ? 'connecting' : 'off';
      if (st !== status) { status = st; scheduleRender(); }
    }
    async function start() {
      if (clients.length || status === 'loading') return;
      status = 'loading'; startedAt = Date.now();
      refreshTag(); sync();
      scheduleRender();
      try { await loadMqtt(); } catch (e) {
        status = 'off'; scheduleRender();
        setTimeout(() => { status = 'idle'; start(); }, 30000);
        return;
      }
      const bye = JSON.stringify({ k: 'b', id });
      clients = BROKERS.map((b, i) => {
        const c = window.mqtt.connect(b.url, Object.assign({
          clientId: 'krl_' + id + '_' + i, clean: true, keepalive: 30, reconnectPeriod: 5000, connectTimeout: 10000,
          will: { topic: TOPIC, payload: bye, qos: 0, retain: false },
        }, b.username ? { username: b.username, password: b.password } : {}));
        c.on('connect', () => {
          c.subscribe(TOPIC, { qos: 0 });
          c.publish(TOPIC, stateText(), { qos: 0 });
          c.publish(TOPIC, JSON.stringify({ k: 'q', id }), { qos: 0 });
          updStatus();
        });
        c.on('close', updStatus);
        c.on('message', (_t, buf) => receive(i, buf.toString()));

    /* someone said hello to my posted challenge: signal it, even in a background tab, and open the duel screen */
    function joined() {
      chime();
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* not supported */ }
      if (!active()) { alerted = true; document.title = '🔔 ' + t('lobbyJoined'); }
      if (document.body.dataset.screen !== 'duel') show('duel');
    }
    function restoreTitle() { if (alerted) { alerted = false; document.title = t('title'); } }

    const onInput = () => {
      const was = Date.now() - lastInput >= IDLE;
      lastInput = Date.now();
      restoreTitle();

    ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, onInput, { passive: true, capture: true }));

    window.addEventListener('pagehide', () => publishAll(JSON.stringify({ k: 'b', id })));

    function scheduleRender() { if (!renderTimer) renderTimer = setTimeout(() => { renderTimer = 0; render(); }, 150); }
    /* the number of others' open challenges on the Duel tab of the tab bar, so they are noticed from the other tabs */
    function badge() {
      const so = $('#sideOnline');
      if (so) { const [text, cls] = online(); if (so.textContent !== text) so.textContent = text; so.className = 'online' + cls; }   // the docked panel's head
      const el = $('#tabBadge');
      if (!el) return;
      const my = mine(), codes = new Set(), rooms = new Set();

      const n = codes.size + rooms.size;

    /* Drawn only while the menu is shown, and only when something visible changed, so focus and scrolling stay put. */

      const who = new Set(meOn ? [tag ? 'u' + tag : 'me'] : []);   // one entry per account (by tag), else per page
      for (const [pid, p] of peers) if (p.a) who.add(p.u ? 'u' + p.u : 'p' + pid);
      const n = who.size;
      return [on ? (n <= 1 && meOn ? t('lobbyOnlyYou') : t('lobbyOnline', n)) : status === 'off' ? t('lobbyOff') : t('lobbyConnecting'),
        on ? ' on' : status === 'off' ? ' off' : '', n];
    }
    /* the Mathefußball block between the lobby and the small leaderboard: open rooms, and buttons to open one */
    let roomsAll = false, roomsSig = '';
    function renderRooms(force) {
      const el = $('#rooms');
      if (!el || !sideHomeShown() || !Ball) return;
      const on = status === 'on', list = [], codes = new Set();
      for (const p of peers.values()) if (p.f && !codes.has(p.f.code)) { codes.add(p.f.code); list.push(p); }
      list.sort((x, y) => y.fsince - x.fsince);
      const shown = list.slice(0, roomsAll ? MAXLIST : SHOW);
      const sig = JSON.stringify([lang, status, roomsAll, list.length, shown.map(p => [p.f.code, p.f.name, p.f.n, Ball.cfgText(p.f.cfg), p.fvf])]);
      if (!force && sig === roomsSig) return;
      roomsSig = sig;
      let h = `<h2 class="part-head" id="h-rooms">${BALL_ICON}<span>${esc(t('ballTitle'))}</span></h2><p class="rooms-tag">${esc(t('ballTag'))}</p>`;
      if (on && list.length) {
        h += '<ul class="lobby-list">' + shown.map(p => `<li><button type="button" class="ch" data-k="r${p.f.code}" data-code="${p.f.code}">` +
          `<span class="who">${esc(p.f.name)}${vfBadge(p.fvf)}<span class="rt">${esc(t('ballNPl', p.f.n))}</span></span>` +
          `<span class="cfg">${esc(Ball.cfgText(p.f.cfg))}</span><span class="go">${esc(t('join'))}</span></button></li>`).join('') + '</ul>';
        if (list.length > SHOW) h += `<button type="button" class="more" data-k="rmore">${esc(roomsAll ? t('lobbyLess') : t('lobbyAll', Math.min(list.length, MAXLIST)))}</button>`;
      } else if (on) h += `<p class="lobby-empty">${esc(t('ballLobbyEmpty'))}</p>`;
      h += `<div class="actions"><button class="btn" id="rbPub" type="button" data-k="rpub"${on ? '' : ' disabled'}>${esc(t('ballPub'))}</button>` +
        `<button class="btn" id="rbPriv" type="button" data-k="rpriv">${esc(t('ballPriv'))}</button></div>`;
      const ae = document.activeElement, focusK = ae && el.contains(ae) && ae.dataset ? ae.dataset.k : null;
      el.innerHTML = h;
      el.querySelectorAll('.ch').forEach(b => b.addEventListener('click', () => Ball.join(b.dataset.code, { lobby: true })));
      const bind = (sel, fn) => { const b = el.querySelector(sel); if (b) b.addEventListener('click', fn); };
      bind('[data-k="rmore"]', () => { roomsAll = !roomsAll; renderRooms(true); const b = el.querySelector('[data-k="rmore"]'); if (b) b.focus(); });
      bind('#rbPub', () => { audioReady(); Ball.openPub(); });

      const el = $('#lobby');

      const list = [], codes = new Set();
      for (const p of peers.values()) {
        if (p.c && !codes.has(p.c.code) && (!my || p.c.code !== my.code)) { codes.add(p.c.code); list.push(p); }
      }
      const [count, ocls, n] = online();
      list.sort((x, y) => y.since - x.since);
      const shown = list.slice(0, showAll ? MAXLIST : SHOW);
      const sig = JSON.stringify([lang, status, n, meOn, showAll, list.length, my && cfgText(my.cfg),
        shown.map(p => [p.c.code, p.c.name, p.c.r, p.c.nd, cfgText(p.c.cfg), p.vf])]);
      if (!force && sig === shownSig) return;
      shownSig = sig;
      let h = `<div class="lobby-head"><h2 id="h-lobby">${esc(t('lobbyTitle'))}</h2>` +
        `<span class="online${ocls}" id="lbOnline" aria-live="polite">${esc(count)}</span></div>`;
      const showList = on && list.length;
      if (my || showList) {
        h += '<ul class="lobby-list">' + (my ? `<li><div class="mine"><span class="who">${esc(t('lobbyMine'))}</span><span class="cfg">${esc(cfgText(my.cfg))}</span>` +
          `<button class="btn small" id="lbCancel" type="button" data-k="cancel">${esc(t('lobbyCancel'))}</button></div></li>` : '') + (showList ? shown.map(p => { const pf = p.vf === 'ok' && Board && Board.usable(); return `<li${pf ? ' class="chrow"' : ''}><button type="button" class="ch" data-k="c${p.c.code}" data-code="${p.c.code}">` +
          `<span class="who">${esc(p.c.name)}${vfBadge(p.vf)}<span class="rt">${esc(p.c.nd ? t('lobbyRating', p.c.r) : t('lobbyNew'))}</span></span>` +
          `<span class="cfg">${esc(cfgText(p.c.cfg))}</span><span class="go">${esc(t('join'))}</span></button>` +
          (pf ? `<button type="button" class="icon pfb" data-k="p${p.c.code}" data-pf="${esc(p.c.name)}" aria-label="${esc(t('pfOf', p.c.name))}" title="${esc(t('pfOf', p.c.name))}">${PERSON}</button>` : '') + '</li>'; }).join('') : '') + '</ul>';
        if (showList && list.length > SHOW) h += `<button type="button" class="more" data-k="more">${esc(showAll ? t('lobbyLess') : t('lobbyAll', Math.min(list.length, MAXLIST)))}</button>`;
      }
      if (my) h += `<p class="wait">${esc(t('lobbyWaiting'))}${showList ? ' ' + esc(t('lobbyJoinOther')) : ''}</p>`;
      else if (on && !list.length) h += `<p class="lobby-empty">${esc(t('lobbyEmpty'))}</p>`;
      if (!my) {
        h += `<div class="actions"><button class="btn primary" id="lbPost" type="button" data-k="post"${on ? '' : ' disabled'}>${esc(t('lobbyPost'))}</button>` +
          `<button class="btn" id="lbPrivate" type="button" data-k="private">${esc(t('lobbyPrivate'))}</button></div>`;
      }
      const ae = document.activeElement, focusK = ae && el.contains(ae) && ae.dataset ? ae.dataset.k : null;
      el.innerHTML = h;
      el.querySelectorAll('.ch').forEach(b => b.addEventListener('click', () => openDuel(b.dataset.code, { lobby: true })));
      el.querySelectorAll('.pfb').forEach(b => b.addEventListener('click', () => { if (Board) Board.openByName(b.dataset.pf, 'menu'); }));
      const bind = (sel, fn) => { const b = el.querySelector(sel); if (b) b.addEventListener('click', fn); };
      bind('[data-k="more"]', () => { showAll = !showAll; render(true); const b = el.querySelector('[data-k="more"]'); if (b) b.focus(); });
      bind('#lbPost', () => openDuel(null, { post: true }));
      bind('#lbPrivate', () => openDuel());
      bind('#lbCancel', () => { leaveDuel(); render(true); const b = $('#lbPost'); if (b) b.focus({ preventScroll: true }); });
      if (focusK) { const f = el.querySelector(`[data-k="${focusK}"]`); if (f) f.focus({ preventScroll: true }); }
    }

    return { start, sync, render, joined, claim, badge, claimRoom };
  })();

  /* ----- Mathefußball: two teams, one ball (since 1.30) -----
     Players join a room and pick one of two teams. Every correct answer moves the ball one step toward the other team's goal;
     after STEPS steps it is a goal and the ball goes back to the middle. When the time is up, more goals wins; equal goals = draw.
     Unrated: no Elo, no solo rating, no saved round, nothing for the central data (owner's decisions, see the developer notes).
     Each player gets random tasks of their own level from their own generator (no twin tasks); the host only counts solves.
     Network: the host's page is the referee. A room has two topics on the duel relays: players send on "up" (only the host
     listens), the host sends on "down" (everyone listens), so traffic grows with the number of players, not with its square.
     Keys: the code gives a code key (hello, welcome, refusals, last wills). Each player agrees on a key of its own with the host
     (ECDH, like the duel key), and with that key the host hands out the room key, which seals everything the host sends to all.
     Someone who only knows the code (lobby codes are public) can't read the room or speak for a player.
     Messages are states, not events: a player's report holds its totals so far, the host's messages hold the room, and both are
     sent again regularly, so a lost message never matters. The host bundles its updates (room at most every 0.3 s, ball and
     clock at most every 0.15 s; again every 4 s / every 1 s in a match, 1.5 s before it, as a sign of life).
     Leaving: a page that closes can rarely send anything any more, so the relays' last will ("gone") counts once nothing else
     follows from that page for 3 s (host) or 4.5 s (player); 15 s of silence counts too.
     Skipping locks the next task for the level's skip penalty (Core.SKIP_S); on the estimation levels the fourth and every further
     wrong try locks the input for a second, as in buzzer duels. A player who drops out is reported to everyone; the match ends
     early when the host leaves or a team has nobody left. Joining a running match is not possible. */
  Ball = (() => {
    const PV = 3, STEPS = 10, MINS = [1, 2, 3, 5, 10], GOALS = [1, 2, 3, 5, 10], TEAM_MAX = 20, MAX_CONN = 48, COUNT_MS = 2000, PAUSE_MS = 5000;   // PV 2 (1.31): goal countdown, match statistics; 3 (1.33): first to n goals
    const ID_RE = /^[0-9a-f]{12}$/;
    const pickBMin = v => (MINS.includes(num(v)) ? num(v) : 3);
    const pickGN = v => (GOALS.includes(num(v)) ? num(v) : 3);
    /* end: 'time' (match time min) or 'goals' (first team to gn goals wins; no time limit, the clock counts up) */
    const normB = c => ({ levels: c && c.levels === 'own' ? 'own' : 'same', level: validLevel(c && c.level), min: pickBMin(c && c.min),
      end: c && c.end === 'goals' ? 'goals' : 'time', gn: pickGN(c && c.gn) });
    const BF = Object.assign({ levels: 'same', level: S.level, min: 3, end: 'time', gn: 3, spec: false }, LS.get('kr.ballCfg', {}));
    const saveBF = () => LS.set('kr.ballCfg', Object.assign(normB(BF), { spec: !!BF.spec }));
    const teamName = k => t('teamNames')[k];
    const cfgText = c => (c.levels === 'own' ? t('lOwn') : `${t('level')} ${c.level}`) + SEP() + (c.end === 'goals' ? t('ballToN', c.gn) : t('modeMin', c.min));
    const ballLink = code => location.origin + location.pathname + location.search + '#ball=' + code;
    const VF = { ok: 1, no: 0, wait: -1 };
    const MIN_MS = window.__KR_BALL_MIN_MS || 60000;   // one minute of match time (tests shorten it)
    let R = null;

    /* ---- transport ---- */
    async function roomKeys(code) {
      const kd = await crypto.subtle.digest('SHA-256', enc.encode('kopfrechnen-ball-key:' + code));
      const td = await crypto.subtle.digest('SHA-256', enc.encode('kopfrechnen-ball-topic:' + code));
      const base = 'kopfrechnen/ball1/' + hex(td).slice(0, 24);

      catch (e) {

          const j = await call(`${FS_BASE}/${DB()}/users/${st.uid}/${col}?pageSize=${PAGE}&mask.fieldPaths=up&${kq()}`,
            { method: 'GET', headers: { Authorization: 'Bearer ' + tok } });

    /* --- verified names: a device key per account and device ---

    const IDB = 'kopfrechnen', IDB_STORE = 'devkeys', DEV_MAX = 10, DEV_REFRESH = 30 * 864e5;

    /* Signing out: forget this device's key here at once, then try to take it off the list (the private half is gone either way). */

    const idText = (purpose, name, d, parts) => JSON.stringify(['kr-id', 1, purpose, name, d, parts]);
    /* Sign as the signed-in name, only if this device is listed for it. Returns { n: name, d: device id, g: signature } or null. */
    async function claim(purpose, name, parts) {

      try {

    /* Registry lookups, kept for 2 minutes (so a removed device stops counting soon); a device that isn't in the kept entry

    const regCache = new Map(), pubCache = new Map();

    async function nameTaken(name) {

      for (const col of COLS) {
        const known = new Set(st.known[col]);

      }
      return n;
    }
    function soon(ms = 1500) { if (!on() || !usable()) return; clearTimeout(timer); timer = setTimeout(() => { sync(); }, ms); }

      if (!on() || !usable()) return Promise.resolve();
      if (syncing) { again = true; return syncing; }
      syncing = (async () => {
        try {
          let changed = false;
          do { again = false; changed = (await syncOnce()) || changed; } while (again && on());
          lastErr = null;
          if (st) { st.at = new Date().toISOString(); save(); }
          if (changed) refreshStats();
          if (Me.synced) Me.synced();
        } catch (e) { lastErr = e; }

    }
    async function syncOnce() {

    }
    async function pull(col) {

      for (let page = 0; page < 200; page++) {
        const tok = await token();
        const q = { from: [{ collectionId: col }], limit: PAGE,
          orderBy: [{ field: { fieldPath: 'up' }, direction: 'ASCENDING' }, { field: { fieldPath: '__name__' }, direction: 'ASCENDING' }] };
        const c = st.cur[col];
        if (c) q.startAt = { values: [{ timestampValue: c.up }, { referenceValue: c.name }], before: false };
        const res = await call(`${FS_BASE}/${DB()}/users/${st.uid}:runQuery?${kq()}`, json({ structuredQuery: q }, tok));
        const docs = (Array.isArray(res) ? res : []).map(e => e.document).filter(Boolean);
        if (!docs.length) break;
        const m = new Map(LS.get(lsKey(col), []).map(x => [x.id, x]));

        const sent = new Set(batch.map(d => d.c + '/' + d.id));

    }

    /* --- local data under other names, offered once per sign-in --- */

      for (const d of LS.get('kr.duels', [])) if (d.acct !== st.uid && d.me && d.me.name) add(d.me.name, 'd');

    /* --- screens --- */
    let view = 'out', mode = 'new', msg = null, draft = { name: '', key: '', login: '' }, keyShown = false, outLocal = 'keep', delLocal = 'keep', checkT = 0, prevScreen = 'menu';
    const say = (k, text) => { msg = text ? { k, text } : null; };

    /* the profile button in the header: filled while signed in; hidden on the admin page and while a duel is under way */

  /* ----- public profiles and the online leaderboard (since 1.23) -----
     profiles/<uid> holds one public document per account. Only the account's own devices write it, computed from the
     account's rounds and duel records with the same formulas as the statistics, so all devices write the same thing,
     and only when something changed. Public: { name, s, v, up, sm, d, [r, r1…r8, dr] }; hidden: { name, s, v, up, hid: true }.
     r = solo rating (all levels), rN = rating from level N's runs only, dr = duel rating; each one only from five runs
     or duels on, so a missing field keeps the account off that board. sm = small summary for the board rows (JSON),
     d = details for the profile page (JSON). A board is one query sorted by a rating field: top 20, reading only
     name, sm and that field. No opponent names, no single tasks, no times of day; dates only as days in the rating history.
     Trust-based: the rules check fields and ranges, not whether the numbers are true. The admin can hide a profile (bans/<uid>). */
  Board = (() => {
    const A = Acct.api;
    const PV = 1, MIN_N = 5, TOP = 20, IDLE_DAYS = 30, HIST = 500, CACHE_MS = 60000;
    const RK = ['r', 'r1', 'r2', 'r3', 'r4', 'r5', 'r6', 'r7', 'r8', 'dr'];
    const INPUTS = ['keyboard', 'touch', 'voice'];
    const usable = () => Acct.usable();

    /* --- the signed-in account's profile, from the account's rounds and duel records on this device --- */
    function compute(st) {

          .map(([o, x]) => [String(o).slice(0, 12), x.n, Math.round(x.sum), x.nf, Math.round(x.f), x.nc, x.cl, x.sk]);

      B('bdRetry', () => reload(true));
      B('bdAcct', () => Acct.open('board'));
      B('bdShow', () => { choose('pub'); render(); });
      B('bdKeep', () => { choose('hid'); render(); });
      B('bdBack', () => { show('menu'); const b = $('#miAll'); if (b) b.focus({ preventScroll: true }); });
      const nameIn = $('#bdName');
      nameIn.addEventListener('input', () => { findDraft = nameIn.value; });
      $('#bdFindForm').addEventListener('submit', e => { e.preventDefault(); find(); });
      if (fid) {
        const [id, v] = fid.split(':');
        const x = v ? document.querySelector(`#${id} [data-v="${v}"]`) : document.getElementById(id);
        if (x) x.focus({ preventScroll: true });
      }
    }
    /* --- the small leaderboard in the side panel (since 1.24) ---
       The top 5 of the board chosen last (duels by default), the own place, and a link to the whole board.
       Reads: none while the whole board is cached (its first 5 rows), else 5 per load, kept for 5 minutes; the own place
       when not among them costs one more (cached 60 s). Loaded only while it is visible: on wide screens with the menu,
       on narrow ones on the Duel tab. */
    const MINI = 5, MINI_MS = 300000, miniCache = new Map(), miniPending = new Map();
    let ms = { f: null, rows: null, loading: false, err: null, rank: null }, miniSeq = 0;
    const miniShown = () => sideHomeShown() && document.body.dataset.screen !== 'board';
    function miniCached(f) {
      const c = boardCache.get(f);
      if (c && Date.now() - c.at < CACHE_MS) return c.rows.slice(0, MINI);
      const m = miniCache.get(f);
      return m && Date.now() - m.at < MINI_MS ? m.rows : null;
    }
    function miniRows(f) {   // one request per board at a time (the menu and the account start can ask together)
      if (!miniPending.has(f)) miniPending.set(f, miniFetch(f).finally(() => miniPending.delete(f)));
      return miniPending.get(f);
    }
    async function miniFetch(f) {
      const q = { from: [{ collectionId: 'profiles' }], select: { fields: ['name', 'sm', f].map(fieldPath => ({ fieldPath })) },
        orderBy: [{ field: { fieldPath: f }, direction: 'DESCENDING' }], limit: MINI };
      const res = await A.call(`${FS_BASE}/${A.DB()}:runQuery?${A.kq()}`, A.json({ structuredQuery: q }));
      const rows = (Array.isArray(res) ? res : []).map(e => e && e.document).filter(Boolean).map(parse).filter(x => x.name && x[f] != null);
      miniCache.set(f, { at: Date.now(), rows });
      return rows;
    }
    async function miniLoad() {
      const f = field(), my = ++miniSeq, cached = miniCached(f);
      ms = { f, rows: cached || (ms.f === f ? ms.rows : null), loading: !cached, err: null, rank: null };
      if (!cached) miniDraw();
      try {
        const rows = cached || await miniRows(f);
        if (my !== miniSeq) return;
        ms.rows = rows; ms.loading = false;
        const mine = ownValue(f), uid = Acct.on() ? Acct.state.uid : null;
        if (mine != null && !rows.some(x => x.uid === uid)) {
          const full = boardCache.get(f), i = full ? full.rows.findIndex(x => x.uid === uid) : -1;   // among the top 20 already loaded?
          ms.rank = { v: mine, n: i >= 0 ? i + 1 : null };
          if (i < 0) {
            miniDraw();
            try { const n = await placeOf(f, mine); if (my === miniSeq) ms.rank.n = n; } catch (e) { /* the line shows without a place */ }
            if (my !== miniSeq) return;
          }
        }
        miniDraw();
      } catch (e) { if (my !== miniSeq) return; ms.loading = false; ms.err = e; miniDraw(); }
    }
    function miniDraw() {
      const el = $('#mini');
      if (!el || !miniShown()) return;
      const duel = bd.kind === 'duel', f = field(), rows = ms.f === f ? ms.rows : null, uid = Acct.on() ? Acct.state.uid : null;
      const ae = document.activeElement, fk = ae && el.contains(ae) ? (ae.id || (ae.dataset && ae.dataset.v ? 'v:' + ae.dataset.v : null)) : null;
      let h = `<div class="mini-head"><h2 id="h-mini">${esc(t('bdTitle'))}</h2><div class="pick" id="miKind" role="radiogroup" aria-labelledby="h-mini">` +
        [['duel', t('bdDuel')], ['solo', t('bdSolo')]].map(([v, l]) => `<button type="button" role="radio" aria-checked="${bd.kind === v}" data-v="${v}">${esc(l)}</button>`).join('') + '</div></div>';
      if (!duel && bd.level) h += `<p class="mini-sub">${esc(`${t('level')} ${bd.level}: ${t('levels')[bd.level - 1]}`)}</p>`;
      if (!rows) {
        h += ms.err && ms.f === f ? `<p class="msg bad">${esc(ms.err.code === 'net' ? t('acNet') : t('bdFail'))}</p><button type="button" class="more" id="miRetry">${esc(t('bdRetry'))}</button>`
          : `<p class="mini-empty">${esc(t('miniLoading'))}</p>`;
      } else {
        const vs = rows.map(x => x[f]), hi = Math.max(...vs), lo = Math.min(...vs);
        const bar = v => hi > lo ? Math.round(34 + 66 * (v - lo) / (hi - lo)) : 100;   // bar length: lowest shown 34 %, highest 100 % (1.26)
        h += !rows.length ? `<p class="mini-empty">${esc(t('bdEmpty', duel))}</p>` : '<ol class="mini-list">' + rows.map((x, i) =>
          `<li class="${[x.uid === uid ? 'me' : '', idle(x.sm) ? 'idle' : ''].filter(Boolean).join(' ')}" style="--w:${bar(x[f])}%"><span class="rk">${i + 1}</span>` +
          `<button class="rowbtn" type="button" data-uid="${esc(x.uid)}">${esc(x.name)}</button><b>${x[f]}</b></li>`).join('') + '</ol>';
        const p = P();
        if (Acct.on() && p && p.want === 'pub' && !p.ban && !rows.some(x => x.uid === uid)) {
          h += `<p class="lb-own">${esc(ms.rank ? (ms.rank.n ? t('bdOwnRank', ms.rank.n, ms.rank.v) : t('bdOwnVal', ms.rank.v)) : t('bdOwnNone', duel, bd.level))}</p>`;
        }
      }
      h += `<button type="button" class="more" id="miAll">${esc(t('miniAll'))}</button>`;
      el.innerHTML = h;
      el.querySelectorAll('#miKind button').forEach(b => b.addEventListener('click', () => {
        if (bd.kind === b.dataset.v) return;
        bd.kind = b.dataset.v; LS.set('kr.board', bd); miniLoad();
        const x = el.querySelector(`#miKind [data-v="${bd.kind}"]`); if (x) x.focus();
      }));
      el.querySelectorAll('.mini-list .rowbtn').forEach(b => b.addEventListener('click', () => openProfile(b.dataset.uid, 'menu', null, b.textContent)));
      const B = (id, fn) => { const b = document.getElementById(id); if (b) b.addEventListener('click', fn); };
      B('miAll', open);
      B('miRetry', () => { miniCache.delete(f); miniLoad(); });
      if (fk) { const x = fk.startsWith('v:') ? el.querySelector(`#miKind [data-v="${fk.slice(2)}"]`) : document.getElementById(fk); if (x) x.focus({ preventScroll: true }); }
    }
    /* called when the menu or the Duel tab is shown, on a language change and after an own profile write */
    function mini() {
      const el = $('#mini');
      if (!el) return;
      el.hidden = !usable() || document.body.dataset.screen === 'board';   // the full board is open anyway
      if (el.hidden || !miniShown()) return;
      miniLoad();
    }

    let findDraft = '', findMsg = null;
    /* look a player up by username (look-alikes count): { uid, doc } or { err: 'bad' | 'none' | 'private', name } */
    async function lookup(name) {
      const nk = nameKey(name);
      if (!nk || nk.reserved) return { err: 'bad' };
      const n = await A.getName(nk.s);
      if (!n || !n.uid) return { err: 'none' };
      const doc = await getProf(n.uid);
      if (!doc || doc.hid) return { err: 'private', name: n.name };
      return { uid: n.uid, doc };
    }
    const lookErr = r => (r.err === 'bad' ? t('bdNameBad') : r.err === 'none' ? t('acUnknown') : t('bdPrivate', r.name));
    async function find() {
      const name = clip(findDraft), m = $('#bdFindMsg');
      if (!name) { $('#bdName').focus(); return; }
      if (m) { m.className = 'msg'; m.textContent = t('loading'); }
      try {
        const r = await lookup(name);
        if (document.body.dataset.screen !== 'board') return;
        if (r.err) { findMsg = { k: 'bad', text: lookErr(r) }; render(); return; }
        findMsg = null; openProfile(r.uid, 'board', r.doc);
      } catch (e) { findMsg = { k: 'bad', text: e.code === 'net' ? t('acNet') : t('bdFail') }; render(); }
    }

    /* --- a public profile --- */
    let pv = null, pvChart = 'solo', pvWin = 'all', pvOps = null;
    async function openProfile(uid, from, doc, name) {
      if (!usable()) return;
      const me = { uid, from, name, doc: doc || null, loading: !doc, err: null };
      pv = me; pvOps = null;
      show('profile'); renderProfile();
      const b = $('#profile .btn'); if (b) b.focus({ preventScroll: true });
      if (doc && doc.d) return;
      try {
        const d = await getProf(uid, from === 'account');
        if (pv !== me) return;
        me.loading = false;
        if (!d || d.hid) me.err = { k: 'private', name: d ? d.name : null }; else me.doc = d;
      } catch (e) { if (pv !== me) return; me.loading = false; me.err = { k: e.code === 'net' ? 'net' : 'fail' }; }
      renderProfile();
    }
    async function openByName(name, from) {
      if (!usable()) return;
      const me = { from, name, loading: true, doc: null, err: null };
      pv = me; pvOps = null;
      show('profile'); renderProfile();
      try {
        const r = await lookup(name);
        if (pv !== me) return;
        if (r.err) { me.loading = false; me.err = { k: r.err, name: r.name || name }; renderProfile(); return; }
        me.uid = r.uid; me.doc = r.doc; me.loading = false;
      } catch (e) { if (pv !== me) return; me.loading = false; me.err = { k: e.code === 'net' ? 'net' : 'fail' }; }
      renderProfile();
    }
    function backFromProfile() {
      const to = pv ? pv.from : 'menu';
      if (to === 'board') { show('board'); showBoard(); }
      else if (to === 'stats') { show('stats'); renderStats(); }
      else if (to === 'duel') { show('duel'); renderDuel(); }
      else if (to === 'account') Acct.open();
      else show('menu');
    }
    const actText = act => (act == null ? '' : today() - act <= 7 ? t('pfAct7') : today() - act <= IDLE_DAYS ? t('pfAct30') : t('pfActOld'));
    const seg = (id, opts, cur, label, cls = '') => `<div class="pick${cls ? ' ' + cls : ''}" id="${id}" role="radiogroup" aria-label="${esc(label)}">` +
      opts.map(([v, l]) => `<button type="button" role="radio" aria-checked="${String(v) === String(cur)}" data-v="${v}">${esc(l)}</button>`).join('') + '</div>';
    function chartHtml(d) {
      const solo = d.rs.length, duel = d.ds.length;
      if (!solo && !duel) return '';
      const kind = pvChart === 'duel' && duel ? 'duel' : solo ? 'solo' : 'duel';
      const from = pvWin === 'all' ? -Infinity : today() - (+pvWin);
      const pts = kind === 'solo' ? d.rs.filter(p => p[0] >= from).map(p => ({ rating: p[1], perf: p[2], at: dayIso(p[0]) }))
        : d.ds.filter(p => p[0] >= from).map(p => ({ rating: p[1], at: dayIso(p[0]) }));
      let h = `<section><h3>${esc(t('pfHist'))}</h3><div class="pfctl">` +
        (solo && duel ? seg('pfKind', [['solo', t('bdSolo')], ['duel', t('bdDuel')]], kind, t('pfHist')) : '') +
        seg('pfWin', [['30', t('w30')], ['90', t('w90')], ['365', t('w365')], ['all', t('wall')]], pvWin, t('period'), 'win') + '</div>';
      const peak = pvWin === 'all' ? (kind === 'solo' ? d.rp : d.dp) : pts.length ? Math.max(...pts.map(p => p.rating)) : null;   // the peak of what the chart shows
      if (peak != null) h += `<p class="pf-peak">${esc(t('ratingPeak'))}: <b>${peak}</b></p>`;
      h += pts.length >= 2 ? ratingChart(pts, kind === 'solo' ? t('ratingTitle') : t('duelRating')) + `<p class="note">${esc(kind === 'solo' ? t('ratingLegend') : t('pfDuelLegend'))}</p>`
        : `<p class="note">${esc(pts.length ? t('pfOneWin', kind === 'duel') : t('pfNoWin', kind === 'duel'))}</p>`;
      const refList = Core.RATING.ref.map((v, i) => `${i + 1}: ${dec(v)}`).join(SEP());
      h += kind === 'solo' ? `<details class="how"><summary>${esc(t('ratingHow'))}</summary>${t('ratingExplain', refList).map(p => `<p>${esc(p)}</p>`).join('')}</details>`
        : `<details class="how"><summary>${esc(t('duelHow'))}</summary>${t('duelExplain').map(p => `<p>${esc(p)}</p>`).join('')}</details>`;
      return h + '</section>';
    }
    function levelsHtml(d) {
      const rows = d.lv.map((p, i) => [i + 1, p]).filter(([, p]) => p[1] > 0 || p[2] != null || p[3] != null);
      if (!rows.length) return '';
      const long = rows.some(([, p]) => p[3] != null);   // the 3-minute column only for players who played 3-minute runs
      const v = x => (x == null ? '–' : x);
      return `<section><h3>${esc(t('pfLevels'))}</h3><div class="scroll"><table class="pft"><thead><tr><th rowspan="2">${esc(t('level'))}</th><th class="n" rowspan="2">${esc(t('ratingTitle'))}</th>` +
        `<th class="n" rowspan="2">${esc(t('runs'))}</th><th class="n grp" colspan="${long ? 2 : 1}">${esc(t('pfBest'))}</th></tr>` +
        `<tr><th class="n">${esc(t('pfBest60'))}</th>${long ? `<th class="n">${esc(t('pfBest3'))}</th>` : ''}</tr></thead><tbody>` +
        rows.map(([L, p]) => `<tr><td class="lvn"><b>${L}</b><span class="lvname">${esc(t('levels')[L - 1])}</span></td><td class="n"><b>${v(p[0])}</b></td><td class="n">${p[1]}</td>` +
          `<td class="n">${v(p[2])}</td>${long ? `<td class="n">${v(p[3])}</td>` : ''}</tr>`).join('') +
        `</tbody></table></div><p class="note">${esc(long ? t('pfLevelsNote') : t('pfLevelsNote60'))}</p></section>`;
    }
    function opsHtml(d) {
      const lv = Object.keys(d.ops).map(Number).sort((a, b) => a - b);
      if (!lv.length) return '';
      if (!lv.includes(pvOps)) pvOps = lv.slice().sort((a, b) => d.lv[b - 1][1] - d.lv[a - 1][1] || a - b)[0];   // most-played level first
      const by = {};
      for (const [o, n, sum, nf, f, nc, cl, sk] of d.ops[pvOps]) by[o] = { n, sum, nf, f, nc, cl, sk };
      const head = `<h3>${esc(t('byOp'))}</h3>` + (lv.length > 1 ? `<div class="pfctl">${seg('pfOps', lv.map(L => [L, String(L)]), pvOps, t('level'))}</div>` : '') +
        `<p class="pf-peak">${esc(t('level'))} ${pvOps}: ${esc(t('levels')[pvOps - 1])}</p>`;
      return opsTable(by, head);
    }
    function renderProfile() {
      const el = $('#profile');
      if (!el || document.body.dataset.screen !== 'profile' || !pv) return;
      const ae = document.activeElement, fk = ae && el.contains(ae) && ae.dataset && ae.dataset.v ? [ae.closest('[id]').id, ae.dataset.v] : null;
      const back = `<div class="actions"><button class="btn" id="pfBack" type="button">${esc(pv.from === 'menu' ? t('menu') : t('acBackBtn'))}</button></div>`;
      const x = pv.doc;
      let h;
      if (pv.loading) h = `<h1 class="res-head">${esc(pv.name || t('pfTitle'))}</h1><p class="note">${esc(t('loading'))}</p>`;
      else if (pv.err) {
        const e = pv.err;
        h = `<h1 class="res-head">${esc(e.name || pv.name || t('pfTitle'))}</h1><p class="lede">${esc(e.k === 'private' ? t('bdPrivate', e.name || pv.name || '') : e.k === 'none' ? t('acUnknown') : e.k === 'bad' ? t('bdNameBad') : e.k === 'net' ? t('acNet') : t('bdFail'))}</p>`;
      } else {
        const sm = x.sm, d = x.d || { rs: [], ds: [], lv: [], ops: {}, heat: {}, tot: [0, 0, 0], rp: null, dp: null };
        const sub = [sm.inp ? t('pfInput', t('inputName')[sm.inp]) : '', actText(sm.act)].filter(Boolean).join(' ');
        h = `<h1 class="res-head">${esc(x.name)}</h1>` + (sub ? `<p class="pf-sub">${esc(sub)}</p>` : '<p class="pf-sub"></p>') +
          kvHtml([[t('ratingTitle'), x.r != null ? x.r : '–'], [t('duelRating'), x.dr != null ? x.dr : '–'], [t('ratingRuns'), sm.n],
            [t('record'), sm.nd ? t('recordVal', sm.w, sm.dw, sm.l) : '–'], [t('nRounds'), d.tot[0]], [t('playTime'), fmtDur(d.tot[2])]]);
        if ((x.r == null && sm.n) || (x.dr == null && sm.nd)) h += `<p class="note kv-note">${esc(t('pfMinNote'))}</p>`;
        const parts = [chartHtml(d), levelsHtml(d)].filter(Boolean);
        if (parts.length) h += `<div class="sheet">${parts.join('')}</div>`;
        const more = [opsHtml(d), heatGrid(d.heat, t('pfHeatNote'), !d.ho)].filter(Boolean);
        if (more.length) h += `<div class="sheet">${more.join('')}</div>`;
        if (!parts.length && !more.length) h += `<p class="empty">${esc(t('pfEmpty'))}</p>`;
      }
      el.innerHTML = h + back;
      $('#pfBack').addEventListener('click', backFromProfile);
      const bindSeg = (id, fn) => el.querySelectorAll(`#${id} button`).forEach(b => b.addEventListener('click', () => { fn(b.dataset.v); renderProfile(); const f = $(`#${id} [data-v="${b.dataset.v}"]`); if (f) f.focus({ preventScroll: true }); }));
      bindSeg('pfKind', v => { pvChart = v; });
      bindSeg('pfWin', v => { pvWin = v; });
      bindSeg('pfOps', v => { pvOps = +v; });
      if (fk) { const f = document.querySelector(`#${fk[0]} [data-v="${fk[1]}"]`); if (f) f.focus({ preventScroll: true }); }
    }

    const showBoard = () => { if (boardCache.has(field())) render(); else reload(); };   // reloaded only when the cached list is gone (e.g. after an own write)
    function rerender() {
      const scr = document.body.dataset.screen;
      if (scr === 'board') showBoard(); else if (scr === 'profile') renderProfile();
      miniDraw();
    }
    Store.ready.then(() => { mini(); nav(); });
    return { usable, open, openByName, openProfile, choose, publish, refreshOwn, acctHtml, acctBind, rerender, mini, langChanged: rerender };
  })();
  if (window.__KR_TEST) { window.__krAcct = Acct; window.__krStore = Store; window.__krNameKey = nameKey; window.__krBoard = Board; }   // only for automated tests

  /* ----- go ----- */
  applyLang();
  if (location.hash !== '#admin') Lobby.start();
  const hashCode = /^#duel=([A-Z0-9]{6})$/i.exec(location.hash || ''), hashBall = /^#ball=([A-Z0-9]{6})$/i.exec(location.hash || '');
  if (hashCode) {
    history.replaceState(null, '', location.pathname + location.search);
    openDuel(hashCode[1].toUpperCase());
  } else if (hashBall) {
    history.replaceState(null, '', location.pathname + location.search);
    Ball.join(hashBall[1].toUpperCase());
  } else if (location.hash === '#admin') {
    show('admin'); renderAdmin();
  } else {
    show('menu');
  }
  renderShare();
  setTimeout(() => Central.flush(), 3000);
  window.addEventListener('hashchange', () => { if (location.hash === '#admin' && document.body.dataset.screen !== 'game') { show('admin'); renderAdmin(); } });
})();
</script>
</body>
</html>
