  }

  async function hostDuel(post) {
    const name = acctPlayer() || acctName(clip(D.nameDraft ?? LS.get('kr.name', '')));
    if (!name) { setMsg('bad', t('needName')); renderDuel(); return; }
    if (D.st !== 'menu' || await nameRefused(D, name)) return;
    rememberName(name);
    D.role = 'host';
    D.cfg = normCfg(DF);
    D.me = { name, level: D.cfg.level, cm: D.cfg.clockMin };
    setMsg('', t('connecting')); renderDuel();
    const d = D, code = randCode();
    try {
      const ek = await newEk();
      const link = await openLink(code, m => { if (D === d) receive(m); }, (u, n) => { if (D === d) relayStatus(u, n); });
      if (D !== d) { link.close(); return; }
      D.link = link; D.code = code; D.ek = ek.pair; D.ekPub = ek.pub; D.st = 'hosting'; setMsg();
      if (post) {   // a lobby challenge: wait in the main menu, the lobby shows it to everyone
        const ser = Core.duelSeries(Duels.list(), name);
        D.lobbyR = ser.length ? Math.round(ser[ser.length - 1].rating) : 1000; D.lobbyN = ser.length;
        D.lobbyClaim = await Lobby.claim(D);   // signed-in players sign the entry, so it shows a ✓
        if (D !== d) return;
        D.posted = true;
        show('menu');
        if (Lobby) Lobby.sync();
        const b = $('#lbCancel'); if (b) b.focus({ preventScroll: true });
        return;
      }
      renderDuel();
    } catch (err) {
      if (D === d) { setMsg('bad', err && err.message === 'nolib' ? t('noLib') : t('netFail')); renderDuel(); }
    }
  }

  async function joinDuel(code) {
    D.role = 'guest'; D.code = code; D.st = 'joining'; setMsg('', t('connecting')); renderDuel();
    const d = D;
    try {
      const ek = await newEk();
      const link = await openLink(code, m => { if (D === d) receive(m); }, (u, n) => { if (D === d) relayStatus(u, n); });
      if (D !== d) { link.close(); return; }
      D.link = link; D.ek = ek.pair; D.ekPub = ek.pub;
    } catch (err) {
      if (D === d) { cleanupPeer(); D.closing = false; D.st = D.lobby ? 'ended' : 'menu'; setMsg('bad', err && err.message === 'nolib' ? t('noLib') : t('netFail')); renderDuel(); }
      return;
    }
    // say hello until the host answers; no answer within 15 s means there is no open duel with this code
    const hello = () => rawSend({ t: 'hello', v: 2, ts: Core.TASKSET, pv: DUEL_PV, ek: d.ekPub });
    const started = Date.now();
    const iv = setInterval(() => {
      if (D !== d || D.partner || !D.link) { clearInterval(iv); return; }
      if (Date.now() - started > 15000) {
        clearInterval(iv);
        cleanupPeer(); D.closing = false; D.st = D.lobby ? 'ended' : 'menu'; setMsg('bad', D.lobby ? t('lobbyGone') : t('notFound')); renderDuel();
        return;
      }
      hello();
    }, 2000);
    hello();
  }

  function onLost() {
    if (!D || D.closing) return;
    const wasPlaying = G && G.duel;
    if (wasPlaying) { stopTimers(); G = null; }
    if (D.st === 'result' || D.st === 'ended') { D.again = { me: false, opp: false }; D.connected = false; renderDuel(); return; }
    if (D.role === 'host' && D.st === 'hosting' && !wasPlaying) {
      D.timers.forEach(clearInterval); D.timers = [];
      D.partner = null; D.connected = false; D.opp = null;
      D.sk = null; D.peerEk = ''; D.cfgMsg = null; if (D.link) D.link.setKey(null);   // the next joiner agrees on a new key
      renderDuel(); return;
    }
    cleanupPeer();
    D.st = 'ended'; setMsg('bad', t('lost', oppName()));
    show('duel'); renderDuel();
  }

  function onMsg(m) {
    switch (m.t) {
      case 'hello':
        if (D.role !== 'host') return;
        if (num(m.ts) !== Core.TASKSET || num(m.pv) !== DUEL_PV) { rawSend({ t: 'version', to: m.from }); setMsg('bad', t('versionMismatch')); renderDuel(); return; }
        if (typeof m.ek !== 'string' || !EK_RE.test(m.ek)) return;
        if (!D.partner) {
          D.partner = m.from; D.peerEk = m.ek; D.connected = true; startHeartbeat(); if (D.posted && Lobby) Lobby.joined();
          hostGreet(D);
        } else if (D.cfgMsg) D.link.send(D.cfgMsg, true);   // still saying hello: the settings got lost, send them again
        renderDuel();
        break;
      case 'cfg':
        if (D.role !== 'guest' || !m.cfg || D.partner) return;
        if (num(m.ts) !== Core.TASKSET || num(m.pv) !== DUEL_PV) { rawSend({ t: 'version', to: m.from }); cleanupPeer(); D.st = 'menu'; setMsg('bad', t('versionMismatch')); renderDuel(); return; }
        if (typeof m.ek !== 'string' || !EK_RE.test(m.ek)) return;
        D.partner = m.from; D.peerEk = m.ek; D.connected = true; startHeartbeat();
        D.cfg = normCfg(m.cfg);
        D.opp = { name: clip(m.name) || '?', level: validLevel(m.level), cm: D.cfg.clockMin, vf: 'wait' };
        D.myLevel = D.cfg.levels === 'same' ? D.cfg.level : S.level;
        D.st = 'joining'; setMsg();
        D.skP = guestKey(D, m);
        renderDuel();
        break;
      case 'cshow': case 'ctype': case 'cskip': case 'cdone': case 'cflag':
        if (num(m.n) === D.n) clockOpp(m);
        break;
      case 'version':
        cleanupPeer(); D.st = 'ended'; setMsg('bad', t('versionMismatch')); renderDuel();
        break;
      case 'busy':   // from the lobby: someone else was faster; the result screen's "Menu" leads back to the lobby
        cleanupPeer(); D.st = D.lobby ? 'ended' : 'menu'; setMsg('bad', D.lobby ? t('lobbyTaken') : t('busy')); renderDuel();
        break;
      case 'ready':
        if (D.role !== 'host' || m._k !== 'duel') return;
        D.opp = { name: clip(m.name) || '?', level: D.cfg.levels === 'same' ? D.cfg.level : validLevel(m.level), cm: pickClockMin(m.cm), vf: 'wait' };
        checkOpp(D, m.idc, 'guest');
        renderDuel();
        break;
      case 'start':
        if (D.role !== 'guest') return;
        D.n = num(m.n, 1);
        playRound(num(m.seed) >>> 0);
        break;
      case 'prog':
        if (num(m.n) !== D.n) return;
        D.oppScore = num(m.score);
        Duel.hud();
        break;
      case 'final':
        if (num(m.n) !== D.n) return;
        D.oppFinal = { score: num(m.score), time: num(m.time), finished: !!m.finished, perf: m.perf == null ? null : num(m.perf),
          level: validLevel(m.level), rating: num(m.rating, 1000) };
        D.oppDone = true;
        if (G && G.duel && G.running) {
          if (D.cfg.format === 'race') finish({ finished: false });
          else if (D.cfg.format === 'clock') finish({ finished: true });   // the opponent ran out of time or both are done
          else Duel.hud();
        }
        tryConclude();
        break;
      case 'again':
        D.again.opp = true;
        if (D.role === 'host' && D.again.me) startRound(); else renderDuel();
        break;
      case 'quit': {
        if (D.st === 'result') {
          D.connected = false; D.again = { me: false, opp: false };
          setMsg('', t('oppLeft', oppName())); renderDuel();
          break;
        }
        const wasPlaying = G && G.duel;
        if (wasPlaying) { stopTimers(); G = null; }
        cleanupPeer();
        D.st = 'ended'; setMsg('bad', t('oppQuit', oppName()));
        show('duel'); renderDuel();
        break;
      }
      default:
    }
  }

  /* Host, after the first hello: compute the duel's own key, then send the settings with the host's half
     (still under the code key, the guest can't open anything else yet) and switch to the duel's key. */
  async function hostGreet(d) {
    const partner = d.partner;
    try {
      const sk = await sessKey(d.ek.privateKey, d.peerEk, d.code, d.ekPub, d.peerEk);
      const idc = Acct ? await Acct.claim('duel', d.me.name, idParts(d, 'host', d.me.name)) : null;
      if (D !== d || d.partner !== partner) return;
      d.cfgMsg = Object.assign({ t: 'cfg', v: 1, ts: Core.TASKSET, pv: DUEL_PV, cfg: d.cfg, name: d.me.name, level: d.me.level, ek: d.ekPub, to: partner }, idc ? { idc } : {});
      d.link.send(d.cfgMsg, true);
      d.link.setKey(sk); d.sk = sk;
    } catch (e) {   // the joiner's half is unusable: wait for someone else
      if (D === d && d.partner === partner) { d.timers.forEach(clearInterval); d.timers = []; d.partner = null; d.connected = false; d.peerEk = ''; renderDuel(); }
    }
  }
  /* Guest, after the settings: compute the same key and switch to it; then check the host's name. */
  async function guestKey(d, m) {
    try {
      const sk = await sessKey(d.ek.privateKey, d.peerEk, d.code, d.peerEk, d.ekPub);
      if (D !== d) return false;
      d.link.setKey(sk); d.sk = sk;
    } catch (e) {
      if (D === d) { cleanupPeer(); d.closing = false; d.st = d.lobby ? 'ended' : 'menu'; setMsg('bad', t('netFail')); renderDuel(); }
      return false;
    }
    checkOpp(d, m.idc, 'host');
    return true;
  }
  /* Is the opponent's name proven? 'ok' = signed by a device registered for exactly this name, otherwise 'no' (guest). */
  async function checkOpp(d, idc, role, retry = 2) {
    const name = d.opp && d.opp.name;
    let ok = false, unknown = false;
    try { ok = !!(idc && Acct && await Acct.check(idc, 'duel', name, idParts(d, role, name))); } catch (e) { unknown = true; }
    if (D !== d || !d.opp || d.opp.name !== name) return;
    d.opp.vf = ok ? 'ok' : 'no';
    paintOppVf();
    if (unknown && retry) setTimeout(() => checkOpp(d, idc, role, retry - 1), 4000);   // registry not reachable: try again
  }

  async function guestReady() {
    const d = D;
    if (!d || d.st !== 'joining') return;
    const name = acctPlayer() || acctName(clip(d.nameDraft ?? LS.get('kr.name', '')));
    if (!name) { setMsg('bad', t('needName')); renderDuel(); return; }
    if (await nameRefused(d, name) || d.st !== 'joining') return;
    rememberName(name);
    d.me = { name, level: d.cfg.levels === 'same' ? d.cfg.level : d.myLevel, cm: d.myClockMin };
    d.st = 'waitStart'; setMsg();
    renderDuel();
    if (!(await d.skP) || D !== d) return;   // without the duel's key the duel was given up (guestKey says why)
    const idc = Acct ? await Acct.claim('duel', name, idParts(d, 'guest', name)) : null;
    if (D !== d) return;
    send(Object.assign({ t: 'ready', name, level: d.me.level, cm: d.me.cm }, idc ? { idc } : {}));
  }

  function startRound() {
    if (D.role !== 'host' || !D.opp) return;
    D.n++;
    const seed = (Math.random() * 4294967296) >>> 0;
    send({ t: 'start', n: D.n, seed });
    playRound(seed);
  }

  function playRound(seed) {
    D.myFinal = null; D.oppFinal = null; D.oppScore = 0; D.oppDone = false;
    D.again = { me: false, opp: false }; D.last = null; D.myRound = null; setMsg();
    D.myRating = Duels.rating(D.me.name);
    D.st = 'play';
    if (D.cfg.format === 'clock') {
      startGame({
        mode: 'clock', level: D.me.level, seed, duel: true, onFinish: onLocalFinish, onAbort: quitDuel,
        budget: sideBudget(D.me), oppBudget: sideBudget(D.opp), twins: D.me.level === D.opp.level, myIdx: D.role === 'host' ? 0 : 1,
        iStart: (D.n % 2 === 1) === (D.role === 'host'), oppName: D.opp.name,   // the starter alternates with every rematch
      });
      return;
    }
    startGame({
      mode: D.cfg.format === 'race' ? 'race' : 'sprint', level: D.me.level, seed, runMs: D.cfg.format === 'race' ? 0 : pickMin(D.cfg.minutes) * 60000,
      target: targetFor(D.me.level, D.cfg), duel: true, onFinish: onLocalFinish, onAbort: quitDuel,
    });
  }

  function quitDuel() {
    send({ t: 'quit' });
    cleanupPeer();
    D.st = 'ended'; setMsg('bad', t('youQuit'));
    show('duel'); renderDuel();
  }

  async function onLocalFinish(round, extra) {
    const finished = round.mode === 'sprint' ? true : !!extra.finished;
    D.myFinal = { score: round.score, time: round.durationMs, finished, perf: round.mode === 'sprint' ? Core.roundPerf(round) : null,
      level: round.level, rating: D.myRating };
    send(Object.assign({ t: 'final', n: D.n }, D.myFinal));
    round.player = D.me.name;
    round.duel = `${D.code}-${D.n}-${D.role}`;
    D.myRound = round;
    try { await Store.save(round); } catch (e) { /* the duel still counts */ }
    if (!D) return;
    if (!D.oppFinal) { D.st = 'waitFinal'; show('duel'); renderDuel(); }
    tryConclude();
  }

  function tryConclude() {
    if (!D || !D.myFinal || !D.oppFinal || D.st === 'result') return;
    const outcome = Core.duelOutcome(D.cfg, D.myFinal, D.oppFinal);
    const before = D.myRating;
    const rec = {
      id: `${D.code}-${D.n}-${D.role}`, at: new Date().toISOString(), format: D.cfg.format, levels: D.cfg.levels,
      minutes: pickMin(D.cfg.minutes), raceN: pickRaceN(D.cfg.raceN), raceScale: D.cfg.raceScale, clockEnd: 'flag', clockTime: D.cfg.clockTime,
      budget: sideBudget(D.me), oppBudget: sideBudget(D.opp),
      me: { name: D.me.name, level: D.myFinal.level, score: D.myFinal.score, time: D.myFinal.time, perf: D.myFinal.perf, finished: D.myFinal.finished },
      opp: { name: D.opp.name, level: D.oppFinal.level, score: D.oppFinal.score, time: D.oppFinal.time, perf: D.oppFinal.perf,
        finished: D.oppFinal.finished, rating: D.oppFinal.rating },
      outcome,
    };
    if (D.opp.vf === 'ok') rec.opp.v = true;   // the opponent's name was verified (✓)
    Duels.add(rec);
    D.last = { rec, before, after: Duels.rating(D.me.name) };
    statsCache = null;
    D.st = 'result';
    show('duel'); renderDuel();
  }

  let typeTimer = 0, typeLast = 0;
  const Duel = {
    progress(score) { if (D) send({ t: 'prog', n: D.n, score }); },
    clockShow(turn, text) { if (D) send({ t: 'cshow', n: D.n, turn, text }); },
    clockType(v) {   // what you type, at most about eight times per second
      if (!D || !G || !G.clock) return;
      const turn = G.clock.mySolved + 1, now = Date.now();
      clearTimeout(typeTimer);
      if (now - typeLast >= 120) { typeLast = now; send({ t: 'ctype', n: D.n, turn, v }); }
      else typeTimer = setTimeout(() => { typeLast = Date.now(); if (D) send({ t: 'ctype', n: D.n, turn, v }); }, 120);
    },
    clockSkip(turn, text, pen) { if (D) send({ t: 'cskip', n: D.n, turn, text, pen }); },
    clockDone(turn, total, q, a, dt, sk) { clearTimeout(typeTimer); if (D) send({ t: 'cdone', n: D.n, turn, total, q, a, dt, sk }); },
    clockFlag(turn) { if (D) send({ t: 'cflag', n: D.n, turn }); },
    clockHud(text, active) {
      if (!D || !D.opp) return;
      const el = $('#hudOpp'), html = `${esc(D.opp.name)} <b>${text}</b>`;
      if (el.innerHTML !== html) el.innerHTML = html;
      el.classList.toggle('clock-on', active);
    },
    hud() {   // progress bars: race = way to the target; timed run = relative to the leader (scaled by level when levels differ)
      if (!D || !D.opp || !G || !G.duel || G.clock) return;
      const race = D.cfg.format === 'race', ref = l => Core.RATING.ref[l - 1];
      const tMe = race ? G.target : 0, tOpp = race ? targetFor(D.opp.level, D.cfg) : 0;
      let fm, fo;
      if (race) { fm = G.score / tMe; fo = D.oppScore / tOpp; }
      else {
        const vm = G.score / ref(G.level), vo = D.oppScore / ref(D.opp.level), mx = Math.max(vm, vo);
        fm = mx ? vm / mx : 0; fo = mx ? vo / mx : 0;
      }
      const clamp = f => Math.max(0, Math.min(1, f || 0));
      $('#dbnMe').textContent = t('you'); $('#dbnOpp').textContent = D.opp.name;
      $('#dbiMe').style.transform = `scaleX(${clamp(fm)})`; $('#dbiOpp').style.transform = `scaleX(${clamp(fo)})`;
      $('#dbsMe').textContent = race ? `${G.score}/${tMe}` : String(G.score);
      $('#dbsOpp').textContent = (race ? `${D.oppScore}/${tOpp}` : String(D.oppScore)) + (D.oppDone ? ' ✓' : '');
    },
  };

  /* ----- duel screen ----- */
  function chips(id, cur) {
    return `<div class="lvls" id="${id}" role="radiogroup">` + Array.from({ length: Core.NLEVELS }, (_, k) => k + 1).map(i =>
      `<button type="button" role="radio" aria-checked="${i === cur}" data-l="${i}"><b>${i}</b>${esc(t('levels')[i - 1])}</button>`).join('') + '</div>';
  }
  function bindChips(id, onPick) {
    const el = $('#' + id);
    if (!el) return;
    el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      el.querySelectorAll('button').forEach(x => x.setAttribute('aria-checked', String(x === b)));
      onPick(+b.dataset.l);
    }));
  }
  const nameField = () => (acctPlayer()
    ? `<div class="field asme"><span class="lbl">${esc(t('playingAs'))}</span><p class="val" id="dMe">${meVal()}</p></div>`
    : `<div class="field"><label for="dName">${esc(t('yourName'))}</label>` +
      `<input id="dName" maxlength="30" autocomplete="off" value="${esc(D.nameDraft ?? LS.get('kr.name', ''))}"></div>`) +
    `<p class="note" id="dVf" aria-live="polite">${esc(selfVfText())}</p>`;
  const meVal = () => { const me = acctPlayer(); return me ? esc(me) + (Acct.idState(me) === 'ok' ? vfBadge('ok') : '') : ''; };
  /* ✓ = the name is verified (signed by a device registered for it); "guest" = not verified */
  const vfBadge = vf => (vf === 'ok' ? `<span class="vf ok" title="${esc(t('vfTitle'))}" aria-label="${esc(t('vfTitle'))}">✓</span>`
    : vf === 'no' ? `<span class="vf guest">${esc(t('vfGuest'))}</span>` : '');
  function selfVfText() {   // how my name will show: verified, being set up, or as a guest
    if (!D || !Acct) return '';
    const me = acctPlayer();
    if (me) { const s = Acct.idState(me); return s === 'ok' ? t('vfAcOk') : s === 'wait' ? t('vfMeWait') : s === 'fail' ? t('vfMeFail') : ''; }
    const name = acctName(clip(D.nameDraft ?? LS.get('kr.name', ''))), s = Acct.idState(name);
    return s === 'ok' ? t('vfMeOk', name) : s === 'wait' ? t('vfMeWait') : s === 'fail' ? t('vfMeFail') : s === 'guest' ? t('vfMeGuest') : '';
  }
  const takenText = (typed, reg) => (typed.toLowerCase() === reg.toLowerCase() ? t('vfTaken', reg) : t('vfTakenLike', typed, reg));
  let vfTimer = 0;
  function paintSelfVf(now) {   // the note under the name field; a name that belongs to someone else's account is flagged while typing
    const el = document.getElementById('dVf');
    if (!el || !D) return;
    el.textContent = selfVfText(); el.classList.remove('warn');
    const v = document.getElementById('dMe'); if (v) v.innerHTML = meVal();
    clearTimeout(vfTimer);
    if (acctPlayer()) return;   // signed in: the account's own name, nothing to check
    const name = acctName(clip(D.nameDraft ?? LS.get('kr.name', ''))), s = Acct ? Acct.idState(name) : 'none';
    if (!name || (s !== 'guest' && s !== 'other')) return;
    vfTimer = setTimeout(async () => {
      const reg = await Acct.nameTaken(name), e2 = document.getElementById('dVf');
      if (!reg || !e2 || !D || acctName(clip(D.nameDraft ?? LS.get('kr.name', ''))) !== name) return;
      e2.textContent = takenText(name, reg); e2.classList.add('warn');
    }, now ? 0 : 400);
  }
  /* before hosting or joining: someone else's account name is refused (null = registry not reachable, then it is allowed) */
  async function nameRefused(d, name) {
    if (!Acct || d.checking) return true;
    d.checking = true;
    const reg = await Acct.nameTaken(name);
    d.checking = false;
    if (D !== d) return true;
    if (reg) { setMsg('bad', takenText(name, reg)); renderDuel(); return true; }
    return false;
  }
  function oppVfInner() {
    const o = D && D.opp;
    if (!o || !o.vf) return '';
    return o.vf === 'ok' ? vfBadge('ok') + esc(t('vfOppOk', o.name)) : o.vf === 'no' ? vfBadge('no') + esc(t('vfOppGuest', o.name)) : esc(t('vfChecking'));
  }
  const oppVfHtml = () => `<p class="note vfnote" id="dOppVf" aria-live="polite">${oppVfInner()}</p>`;
  function paintOppVf() { const el = document.getElementById('dOppVf'); if (el) el.innerHTML = oppVfInner(); }
  const msgHtml = () => `<p class="msg ${D.msgKind}" id="dMsg" aria-live="polite">${esc(D.msg)}</p>`;
  const raceNote = cfg => (cfg.raceScale === false ? t('raceSame', pickRaceN(cfg.raceN))
    : t('raceTargets', Array.from({ length: Core.NLEVELS }, (_, k) => k + 1).map(l => `${l}: ${targetFor(l, { format: 'race', levels: 'own', raceN: cfg.raceN })}`).join(', ')));
  const seg = (id, opts, cur, cls = '') => `<div class="pick${cls ? ' ' + cls : ''}" id="${id}" role="radiogroup">` +
    opts.map(([v, label]) => `<button type="button" role="radio" aria-checked="${String(v) === String(cur)}" data-v="${v}">${esc(label)}</button>`).join('') + '</div>';
  // chess-clock time: level default or whole minutes; without the level default when one time is shared by different levels
  const clockSeg = (id, cur, level, noAuto) => seg(id, (noAuto ? [] : [['auto', t('clockAuto', Core.clockBudget(level) / 1000)]])
    .concat(MINUTES.map(m => [m, t('modeMin', m)])), cur, 'clk');

  function renderDuel() {
    if (Lobby) Lobby.sync();   // most duel state changes pass through here; the lobby entry follows them
    if (Acct) Acct.btn();      // the account button is hidden while a duel is running
    nav();                     // so are the tab bar and the statistics button, and the solo column is paused
    if (!D || document.body.dataset.screen !== 'duel') return;
    const sec = $('#duel');
    let h = `<h1 class="res-head">${esc(t('duelTitle'))}</h1>`;
    const back = `<div class="actions"><button class="btn" id="dBack" type="button">${esc(D.st === 'menu' || D.lobby ? t('toLobby') : t('menu'))}</button></div>`;   // the setup and lobby duels lead back to the lobby

    if (D.st === 'menu') {
      const post = D.mode === 'post';
      h += `<p class="lede">${esc(post ? t('lobbyPostLede') : t('duelLede'))}</p>` + nameField();
      h += `<h2>${esc(t('format'))}</h2><div class="modes" id="dFormat" role="radiogroup">` +
        radioOpt('v', 'time', DF.format === 'time', t('fTime'), t('fTimeDesc')) + radioOpt('v', 'race', DF.format === 'race', t('fRace'), t('fRaceDesc')) +
        radioOpt('v', 'clock', DF.format === 'clock', t('fClock'), t('fClockDesc')) + '</div>';
      const own = DF.levels === 'own';
      h += `<h2>${esc(t('levelsMode'))}</h2><div class="modes" id="dLevels" role="radiogroup">` +

    } else if (D.st === 'hosting') {

          : t('oppReady', D.opp.name, D.opp.level))}</p>` + oppVfHtml() +

    } else if (D.st === 'joining') {

        h += nameField();
        if (D.cfg.levels === 'own') {
          h += `<h2>${esc(t('yourLevel'))}</h2>` + chips('dLvl', D.myLevel);
          if (D.cfg.format === 'race') h += `<p class="note">${esc(raceNote(D.cfg))}</p>`;
        }
        if (clock && D.cfg.clockTime === 'own') h += `<h2>${esc(t('yourTime'))}</h2>` + clockSeg('dMyClockMin', D.myClockMin, D.myLevel, false);
        h += `<div class="actions"><button class="btn primary" id="dReady" type="button">${esc(t('ready'))}</button></div>` + relayHtml() + msgHtml();
      }
      h += `<div class="actions"><button class="btn" id="dBack" type="button">${esc(t('abort'))}</button></div>`;
    } else if (D.st === 'waitStart') {

        `<div class="actions"><button class="btn" id="dBack" type="button">${esc(t('abort'))}</button></div>`;

    } else if (D.st === 'result' && D.last) {

      const race = rec.format === 'race' || rec.format === 'clock';
      const left = rec.format === 'clock' && rec.clockEnd === 'flag' && rec.budget;
      const row = (s, b, vf) => `<tr><td>${vf ? pfName(s.name, vf === 'ok') : esc(s.name)}${vfBadge(vf)}</td><td class="n">${s.level}</td><td class="n">${s.score}</td>` +
        (race ? `<td class="n">${s.finished ? esc(left ? fmtLeft(b - s.time) : fmtClock(s.time)) : esc(rec.format === 'clock' ? t('flagged') : t('notFinished'))}</td>` : `<td class="n">${Math.round(s.perf)}</td>`) + '</tr>';
      h += `<p class="duel-head${rec.outcome === 1 ? ' win' : ''}">${esc(head)}</p><p class="res-sub">${esc(cfgText(D.cfg))}</p>`;
      h += `<div class="sheet"><div class="scroll"><table><thead><tr><th>${esc(t('player'))}</th><th class="n">${esc(t('level'))}</th>` +
        `<th class="n">${esc(t('score'))}</th><th class="n">${esc(left ? t('leftCol') : rec.format === 'clock' ? t('clockCol') : race ? t('time') : t('perf'))}</th></tr></thead><tbody>` +
        row(rec.me, rec.budget) + row(rec.opp, rec.oppBudget || rec.budget, rec.opp.v ? 'ok' : 'no') + '</tbody></table></div>' +
        `<p class="rating-msg">${esc(t('duelRating'))}: ${Math.round(after)} (${esc(signed(Math.round(after) - Math.round(before)))})</p>` +
        `<p class="note">${esc(t('duelSaved'))}</p></div>`;
      let status = '';
      if (D.again.me) status = t('rematchWait', oppName());
      else if (D.again.opp) status = t('rematchAsk', oppName());
      if (status) h += `<p class="status">${esc(status)}</p>`;
      h += msgHtml();
      h += '<div class="actions">' + (linked() && !D.again.me ? `<button class="btn primary" id="dAgain" type="button">${esc(t('rematch'))}</button>` : '') +
        `<button class="btn" id="dBack" type="button">${esc(D.lobby ? t('toLobby') : t('menu'))}</button></div>`;
    } else {
      h += msgHtml() + back;
    }
    sec.innerHTML = h;
    paintSelfVf(true);

    const nameIn = $('#dName');
    if (nameIn) nameIn.addEventListener('input', e => { D.nameDraft = e.target.value; paintSelfVf(); });
    const bindOpt = (id, key) => {
      const el = $('#' + id);
      if (el) el.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => { DF[key] = b.dataset.v; saveDF(); renderDuel(); const f = $(`#${id} [data-v="${DF[key]}"]`); if (f) f.focus(); }));
    };
    bindOpt('dFormat', 'format'); bindOpt('dLevels', 'levels'); bindOpt('dClockTime', 'clockTime');
    const bindSeg = (id, key, parse) => {
      const el = $('#' + id);
      if (el) el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { DF[key] = parse(b.dataset.v); saveDF(); renderDuel(); const f = $(`#${id} [data-v="${b.dataset.v}"]`); if (f) f.focus(); }));
    };
    bindSeg('dMin', 'minutes', pickMin); bindSeg('dRaceN', 'raceN', pickRaceN); bindSeg('dClockMin', 'clockMin', pickClockMin);
    const myMin = $('#dMyClockMin');   // the guest's own chess-clock time
    if (myMin) myMin.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      D.myClockMin = pickClockMin(b.dataset.v); renderDuel(); const f = $(`#dMyClockMin [data-v="${b.dataset.v}"]`); if (f) f.focus();
    }));
    bindChips('dLvl', l => {   // the chess-clock time shows the level's default, so the clock settings are redrawn
      const clock = D.st === 'menu' ? DF.format === 'clock' : D.cfg && D.cfg.format === 'clock';
      if (D.st === 'menu') { DF.level = l; saveDF(); } else D.myLevel = l;
      if (clock) { renderDuel(); const f = $(`#dLvl [data-l="${l}"]`); if (f) f.focus(); }
    });
    const on = (id, fn) => { const el = $('#' + id); if (el) el.addEventListener('click', fn); };
    on('dCreate', () => hostDuel());
    on('dPost', () => { audioReady(); hostDuel(true); });   // the click unlocks sound for the join signal
    on('dJoin', () => {
      const code = ($('#dCode').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (code.length !== 6) { setMsg('bad', t('codeBad')); renderDuel(); return; }
      joinDuel(code);
    });
    const codeIn = $('#dCode');
    if (codeIn) codeIn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#dJoin').click(); } });
    on('dCopy', async () => {
      const link = duelLink(D.code);
      try { await navigator.clipboard.writeText(link); setMsg('ok', t('copied')); }
      catch (e) { const r = document.createRange(); r.selectNodeContents($('#dLink')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      renderDuel();
    });
    on('dShare', () => { navigator.share({ title: t('duelTitle'), text: cfgText(D.cfg), url: duelLink(D.code) }).catch(() => {}); });
    on('dStart', () => { audioReady(); startRound(); });
    const warmMic = () => { if (S.input === 'voice' && SR) Voice.start(() => {}, () => {}); };
    on('dReady', () => { audioReady(); warmMic(); guestReady(); });
    on('dAgain', () => {
      if (D.role === 'guest') warmMic();
      D.again.me = true;
      send({ t: 'again' });
      if (D.role === 'host' && D.again.opp) startRound(); else renderDuel();
    });
    on('dRaceScale', () => { DF.raceScale = DF.raceScale === false; saveDF(); renderDuel(); $('#dRaceScale').focus(); });
    on('dBack', () => {
      if ((D.st === 'result' || D.st === 'ended') && !D.lobby) {   // after a private duel: back to the duel screen for the next one
        openDuel();
        const f = $('#dFormat [aria-checked="true"]'); if (f) f.focus({ preventScroll: true });
        return;
      }
      leaveDuel(); show('menu');   // lobby duels and everything else: back to the main menu with the lobby
      const f = $('#lbPost') || $('#startBtn'); if (f) f.focus({ preventScroll: true });
    });
  }

  $('#duel').addEventListener('click', e => { const b = e.target.closest('[data-pf]'); if (b && Board) Board.openByName(b.dataset.pf, 'duel'); });

  /* ----- duel lobby: how many are online, and open challenges anyone can join -----
     A shared channel on the same relays as the duels. It is not encrypted, because everyone has to be able to read it.
     Its name contains the task set and the duel protocol, so only compatible versions see each other.
     Every page sends its state there: active or away, plus at most one open challenge (code, name, duel rating, settings).
     - The state goes out when it changes and again every 30 s. A page not heard from on any relay for 100 s is dropped.
     - A page that connects asks "who's here?", and everyone answers on that relay at once, so the list fills right away.
     - Leaving: "bye" on every relay. If a connection breaks, the relay sends the "bye" itself (MQTT last will).
     - Each relay is tracked on its own: one relay losing someone doesn't remove them while another one still hears them.
     Active = tab visible, window focused and some input in the last 5 minutes; a running round always counts.
     Joining a challenge is the normal duel handshake with its code; a second joiner gets the usual "already two players".
     Verified names: a signed-in player's entry carries a signature (v) over this page's ID and the whole entry, made with
     the device key registered for the name; everyone checks it against the name registry and shows ✓ or "guest".
     Copying an entry to another page ID or changing any field breaks the signature. */
  Lobby = (() => {
    const TOPIC = `kopfrechnen/lobby1/${Core.TASKSET}-${DUEL_PV}`;
    const REFRESH = 30000, EXPIRE = 100000, IDLE = window.__KR_IDLE_MS || 300000, SHOW = 4, MAXLIST = 30, MAXPEERS = 300;
    const CODE_RE = new RegExp(`^[${CODE_ABC}]{6}$`);
    const id = hex(crypto.getRandomValues(new Uint8Array(6)));
    const peers = new Map();    // id -> { q, a, c, since, seen: Map(relay index -> last heard) }
    const counts = new Map();   // id -> [window start, messages]: guard against floods
    let clients = [], status = 'idle', startedAt = 0, ticker = 0;
    let seq = 0, mySig = '', myState = { a: 0, c: null }, lastSent = 0, sendTimer = 0;
    let lastInput = Date.now(), lastMove = 0, showAll = false, renderTimer = 0, shownSig = '', alerted = false;

    const focused = () => (window.__KR_FOCUS != null ? !!window.__KR_FOCUS : document.hasFocus());
    const active = () => document.visibilityState === 'visible' && focused() && (!!(G && G.running) || Date.now() - lastInput < IDLE);
    const entry = d => ({ code: d.code, name: d.me.name, r: d.lobbyR, nd: d.lobbyN, cfg: d.cfg });
    function mine() {   // my open challenge, as long as nobody has joined it (sent exactly as others will clean it, so the signature fits)
      if (!D || !D.posted || D.role !== 'host' || D.st !== 'hosting' || D.partner || !D.link || !D.code) return null;
      const c = clean(entry(D));
      if (c) c.v = D.lobbyClaim || null;
      return c;
    }
    const signed = (pid, c) => [pid, c.code, c.name, c.r, c.nd, c.cfg];   // what the signature of an entry covers
    async function claim(d) {
      const c = Acct && clean(entry(d));
      return c ? Acct.claim('lobby', c.name, signed(id, c)) : null;
    }
    /* Devices signed in to the same account send the same tag, so the online count shows them once.
       Tag = first 16 hex of SHA-256 over the day (UTC) and the account key: only devices with the key can make it,
       it changes every day and reveals neither the name nor the key. */
    let tag = null, tagSrc = '';
    function refreshTag() {
      const a = Acct && Acct.state, k = a && a.rt && a.key ? String(a.key).toUpperCase().replace(/[^0-9A-Z]/g, '') : '';
      const src = k ? new Date().toISOString().slice(0, 10) + '|' + k : '';
      if (src === tagSrc) return;
      tagSrc = src; tag = null;
      if (!src) { sync(); return; }
      crypto.subtle.digest('SHA-256', new TextEncoder().encode('kopfrechnen-lobby-presence:' + src))
        .then(h => { if (tagSrc === src) { tag = hex(new Uint8Array(h)).slice(0, 16); sync(); } }).catch(() => {});
    }
    const stateText = () => JSON.stringify(Object.assign({ k: 's', id, q: seq, a: myState.a, c: myState.c }, myState.u ? { u: myState.u } : {}));
    function publishAll(text) { for (const c of clients) if (c.connected) c.publish(TOPIC, text, { qos: 0 }); }

    /* Send my state when it has changed; with force, send it again as a sign of life.
       Changes of the challenge go out at once; going active/away at most once per second. */
    function sync(force) {
      const st = { a: active() ? 1 : 0, c: mine(), u: tag };
      const sig = JSON.stringify(st), now = Date.now();
      if (sig === mySig) { if (force) { lastSent = now; publishAll(stateText()); } return; }
      if (JSON.stringify(st.c) === JSON.stringify(myState.c) && now - lastSent < 1000) {
        if (!sendTimer) sendTimer = setTimeout(() => { sendTimer = 0; sync(); }, 1000 - (now - lastSent));
        return;
      }
      mySig = sig; myState = st; seq++; lastSent = now;
      publishAll(stateText());
      scheduleRender();
    }

    function clean(c) {   // an open challenge from someone else, checked field by field
      if (!c || typeof c !== 'object' || typeof c.code !== 'string' || !CODE_RE.test(c.code) || !c.cfg || typeof c.cfg !== 'object') return null;
      const name = clip(c.name);
      if (!name) return null;
      const r = Math.round(num(c.r, 1000)), v = c.v;
      return { code: c.code, name, r: r > 0 && r < 10000 ? r : 1000, nd: Math.max(0, Math.min(99999, Math.round(num(c.nd)))), cfg: normCfg(c.cfg),
        v: v && typeof v === 'object' && typeof v.n === 'string' && typeof v.d === 'string' && typeof v.g === 'string' && v.n.length <= 30 && v.d.length <= 20 && v.g.length <= 100
          ? { n: v.n, d: v.d, g: v.g } : null };
    }
    /* check an entry's signature once per entry; until the answer is there the row shows neither ✓ nor "guest" */
    function verify(pid, p) {
      const c = p.c, vk = c ? JSON.stringify([c.code, c.name, c.r, c.nd, c.cfg, c.v]) : '';
      if (vk === p.vk) return;
      p.vk = vk;
      if (!c || !c.v || !Acct) { p.vf = 'no'; return; }
      p.vf = 'wait';
      Acct.check(c.v, 'lobby', c.name, signed(pid, c)).catch(() => null).then(ok => {
        if (p.vk !== vk) return;
        p.vf = ok ? 'ok' : 'no';
        if (ok === null) setTimeout(() => { if (p.vk === vk && peers.get(pid) === p) { p.vk = ''; verify(pid, p); } }, 30000);   // registry not reachable: again later
        scheduleRender();
      });
    }
    function flood(pid) {
      const now = Date.now();
      let e = counts.get(pid);
      if (!e || now - e[0] > 30000) { if (counts.size > 2000) counts.clear(); e = [now, 0]; counts.set(pid, e); }
      return ++e[1] > 100;
    }
    function receive(i, text) {
      if (text.length > 2000) return;
      let m;
      try { m = JSON.parse(text); } catch (e) { return; }
      if (!m || typeof m !== 'object' || typeof m.id !== 'string' || !/^[0-9a-f]{12}$/.test(m.id) || m.id === id || flood(m.id)) return;
      if (m.k === 'q') { const c = clients[i]; if (c && c.connected) c.publish(TOPIC, stateText(), { qos: 0 }); return; }
      let p = peers.get(m.id);
      if (m.k === 'b') { if (p && p.seen.delete(i) && !p.seen.size) { peers.delete(m.id); scheduleRender(); } return; }
      if (m.k !== 's') return;
      const now = Date.now();
      if (!p) { if (peers.size >= MAXPEERS) return; p = { q: -1, a: 0, c: null, u: null, since: 0, seen: new Map(), vk: '', vf: '' }; peers.set(m.id, p); }
      const fresh = !p.seen.size;
      p.seen.set(i, now);
      const q = Number.isSafeInteger(m.q) ? m.q : 0;
      if (q > p.q) {   // the same state arrives once per relay; only a newer one counts
        const c = clean(m.c);
        if (!c || !p.c || c.code !== p.c.code) p.since = c ? now : 0;
        p.q = q; p.a = m.a === 1 ? 1 : 0; p.c = c; p.u = typeof m.u === 'string' && /^[0-9a-f]{16}$/.test(m.u) ? m.u : null;
        verify(m.id, p);
        scheduleRender();
      } else if (fresh) scheduleRender();
    }
    function prune() {
      const now = Date.now();
      let changed = false;
      for (const [pid, p] of peers) {
        for (const [i, at] of p.seen) if (now - at > EXPIRE) p.seen.delete(i);
        if (!p.seen.size) { peers.delete(pid); changed = true; }
      }
      if (changed) scheduleRender();
    }

    function updStatus() {
      const st = clients.some(c => c.connected) ? 'on' : Date.now() - startedAt < 10500 ? 'connecting' : 'off';
      if (st !== status) { status = st; scheduleRender(); }
    }
    async function start() {
      if (clients.length || status === 'loading') return;
      status = 'loading'; startedAt = Date.now();
      refreshTag(); sync();
      scheduleRender();
      try { await loadMqtt(); } catch (e) {
        status = 'off'; scheduleRender();
        setTimeout(() => { status = 'idle'; start(); }, 30000);
        return;
      }
      const bye = JSON.stringify({ k: 'b', id });
      clients = BROKERS.map((b, i) => {
        const c = window.mqtt.connect(b.url, Object.assign({
          clientId: 'krl_' + id + '_' + i, clean: true, keepalive: 30, reconnectPeriod: 5000, connectTimeout: 10000,
          will: { topic: TOPIC, payload: bye, qos: 0, retain: false },
        }, b.username ? { username: b.username, password: b.password } : {}));
        c.on('connect', () => {
          c.subscribe(TOPIC, { qos: 0 });
          c.publish(TOPIC, stateText(), { qos: 0 });
          c.publish(TOPIC, JSON.stringify({ k: 'q', id }), { qos: 0 });
          updStatus();
        });
        c.on('close', updStatus);
        c.on('message', (_t, buf) => receive(i, buf.toString()));
        c.on('error', () => {});
        return c;
      });
      status = 'connecting'; startedAt = Date.now(); scheduleRender();
      setTimeout(updStatus, 11000);
      ticker = setInterval(() => { refreshTag(); prune(); sync(Date.now() - lastSent >= REFRESH - 1000); updStatus(); }, 5000);
    }

    /* someone said hello to my posted challenge: signal it, even in a background tab, and open the duel screen */
    function joined() {
      chime();
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* not supported */ }
      if (!active()) { alerted = true; document.title = '🔔 ' + t('lobbyJoined'); }
      if (document.body.dataset.screen !== 'duel') show('duel');
    }
    function restoreTitle() { if (alerted) { alerted = false; document.title = t('title'); } }

    const onInput = () => {
      const was = Date.now() - lastInput >= IDLE;
      lastInput = Date.now();
      restoreTitle();
      if (was) sync();
    };
    ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, onInput, { passive: true, capture: true }));
    document.addEventListener('pointermove', () => { const now = Date.now(); if (now - lastMove > 1000) { lastMove = now; onInput(); } }, { passive: true });
    window.addEventListener('scroll', onInput, { passive: true });
    const onFocusChange = () => { if (active()) restoreTitle(); sync(); };
    document.addEventListener('visibilitychange', onFocusChange);
    window.addEventListener('focus', onFocusChange);
    window.addEventListener('blur', onFocusChange);
    window.addEventListener('pagehide', () => publishAll(JSON.stringify({ k: 'b', id })));
    window.addEventListener('pageshow', e => { if (e.persisted) { publishAll(stateText()); publishAll(JSON.stringify({ k: 'q', id })); } });

    function scheduleRender() { if (!renderTimer) renderTimer = setTimeout(() => { renderTimer = 0; render(); }, 150); }
    /* the number of others' open challenges on the Duel tab of the tab bar, so they are noticed from the other tabs */
    function badge() {
      const so = $('#sideOnline');

  /* ----- online accounts (optional) -----
     Sign-in with a public name and a key the app generates (16 characters from CODE_ABC, no e-mail address).
     Firebase Authentication holds the login: an internal random address plus a hash of the key.
     Firestore holds names/<name key> (public, readable one at a time, never listed) and users/<uid> with the
     sub-collections rounds and duels: one private document per round or duel record, {d: JSON text, up: server time},
     or {del: true, up} once it was deleted. Every device pulls what changed since its cursor, then pushes what is new. */
  const PRIVACY_CONTACT = { name: 'Rui Yang', email: 'rui.yang@outlook.de' };   // operator, shown in the privacy text
  const ST_BASE = window.__KR_ST_BASE || 'https://securetoken.googleapis.com/v1';
  Acct = (() => {
    const DB = () => `projects/${FB.projectId}/databases/(default)/documents`;
    const docName = path => `${DB()}/${path}`;
    const KEY_RE = new RegExp(`^[${CODE_ABC}]{16}$`);
    const normKey = k => String(k || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    const fmtKey = k => String(k).replace(/(.{4})(?=.)/g, '$1-');
    const keyHtml = k => { const f = fmtKey(k); return `<span class="kp">${esc(f.slice(0, 10))}</span><span class="kp">${esc(f.slice(10))}</span>`; };
    const PAGE = 300;

    // other devices notice a key change (or a deleted account) within minutes.
    const TOKEN_USE = window.__KR_TOKEN_USE || 5 * 60 * 1000;

      const out = [], buf = new Uint8Array(48);
      while (out.length < 16) {

    /* --- REST calls; errors come back as { code, status, http } --- */
    async function call(url, opt) {
      let res;
      try { res = await fetch(url, opt); } catch (e) { throw { code: 'net' }; }
      let j = null;
      try { j = await res.json(); } catch (e) { /* empty body */ }
      if (!res.ok) {
        const er = (j && (Array.isArray(j) ? j[0] && j[0].error : j.error)) || {};
        throw { code: String(er.message || ''), status: String(er.status || ''), http: res.status };
      }
      return j;
    }
    const json = (body, tok) => ({ method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, tok ? { Authorization: 'Bearer ' + tok } : {}), body: JSON.stringify(body) });
    const idApi = (op, body) => call(`${ID_BASE}/accounts:${op}?${kq()}`, json(body));
    const commit = (writes, tok) => call(`${FS_BASE}/${DB()}:commit?${kq()}`, json({ writes }, tok));
    async function getName(s) {
      try {
        const d = await call(`${FS_BASE}/${DB()}/names/${encodeURIComponent(s)}?${kq()}`, { method: 'GET' });
        const f = (d && d.fields) || {};
        return { uid: fromFs(f.uid), name: fromFs(f.name), login: fromFs(f.login), k: fromKeys(f.k), ut: d && d.updateTime };
      } catch (e) { if (e.http === 404) return null; throw e; }
    }
    /* names/<s>.k = the account's device keys: { <device id>: { p: public key (base64), t: registered or refreshed (ms) } } */
    const DEV_RE = /^d[0-9a-f]{10}$/, SIG_RE = /^[A-Za-z0-9+/]{86}==$/, PUB_RE = /^[A-Za-z0-9+/]{87}=$/;
    function fromKeys(v) {
      const out = {}, m = v && v.mapValue && v.mapValue.fields;
      if (!m) return out;
      for (const [dk, e] of Object.entries(m)) {

    const toKeys = k => ({ mapValue: { fields: Object.fromEntries(Object.entries(k).map(([dk, e]) => [dk, { mapValue: { fields: { p: fsStr(e.p), t: fsInt(e.t) } } }])) } });

    /* --- session --- */
    let st = LS.get('kr.acct', null);   // { uid, name, s, login, key, rt, lost, merged, at, cur, known, del }
    if (!st || !st.uid) st = null;
    const save = () => LS.set('kr.acct', st);
    let idt = null, idExp = 0;
    const on = () => !!(st && st.rt);
    const usable = () => Store.kind === 'local' && Central.configured();
    function setMe() { Me.uid = on() ? st.uid : null; Me.name = on() ? st.name : null; Me.s = on() ? st.s : null; }
    setMe();
    function startSession(info, r) {

      st.rt = null; st.key = null; st.lost = true; idt = null; save(); setMe(); paint();

    async function token() {
      if (idt && Date.now() < idExp) return idt;
      try {
        const j = await call(`${ST_BASE}/token?${kq()}`, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(st.rt) });

      } catch (e) {
        if (e.code === 'net' || e.http >= 500) throw e;

    async function create(nk, key) {
      if (await getName(nk.s)) throw { code: 'taken' };

  /* ----- public profiles and the online leaderboard (since 1.23) -----
     profiles/<uid> holds one public document per account. Only the account's own devices write it, computed from the
     account's rounds and duel records with the same formulas as the statistics, so all devices write the same thing,
     and only when something changed. Public: { name, s, v, up, sm, d, [r, r1…r8, dr] }; hidden: { name, s, v, up, hid: true }.
     r = solo rating (all levels), rN = rating from level N's runs only, dr = duel rating; each one only from five runs
     or duels on, so a missing field keeps the account off that board. sm = small summary for the board rows (JSON),
     d = details for the profile page (JSON). A board is one query sorted by a rating field: top 20, reading only
     name, sm and that field. No opponent names, no single tasks, no times of day; dates only as days in the rating history.
     Trust-based: the rules check fields and ranges, not whether the numbers are true. The admin can hide a profile (bans/<uid>). */
  Board = (() => {
    const A = Acct.api;
    const PV = 1, MIN_N = 5, TOP = 20, IDLE_DAYS = 30, HIST = 500, CACHE_MS = 60000;
    const RK = ['r', 'r1', 'r2', 'r3', 'r4', 'r5', 'r6', 'r7', 'r8', 'dr'];
    const INPUTS = ['keyboard', 'touch', 'voice'];
    const usable = () => Acct.usable();
    const dayNo = iso => Math.floor(new Date(iso).getTime() / 864e5);
    const today = () => Math.floor(Date.now() / 864e5);
    const dayIso = n => new Date(n * 864e5 + 432e5).toISOString();   // noon UTC, so the shown day doesn't slip
    const N = v => (typeof v === 'number' && Number.isFinite(v) ? v : null);
    const arr = (a, max) => (Array.isArray(a) ? a.slice(0, max) : []);
    const js = v => { try { return typeof v === 'string' ? JSON.parse(v) : null; } catch (e) { return null; } };
    function thin(a) {   // at most HIST points: the newer half as they are, the older ones evenly sampled
      if (a.length <= HIST) return a;
      const keep = HIST / 2, old = a.slice(0, a.length - keep), out = [];
      for (let i = 0; i < keep; i++) out.push(old[Math.floor(i * old.length / keep)]);
      return out.concat(a.slice(-keep));
    }
    function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36) + '.' + s.length; }

    /* --- the signed-in account's profile, from the account's rounds and duel records on this device --- */
    function compute(st) {
      const rounds = LS.get('kr.rounds', []).filter(r => r.acct === st.uid && r.startedAt && Number.isFinite(dayNo(r.startedAt)));
      const duels = LS.get('kr.duels', []).filter(d => d.acct === st.uid && d.me && d.me.name === st.name && Number.isFinite(dayNo(d.at)));
      const ser = Core.ratingSeries(rounds);
      const doc = { name: st.name, s: st.s };
      if (ser.length >= MIN_N) doc.r = Math.round(ser[ser.length - 1].rating);
      const lv = [], nl = [], ops = {};
      const best = list => (list.length ? Math.max(...list.map(r => num(r.score))) : null);
      for (let L = 1; L <= Core.NLEVELS; L++) {
        const mine = rounds.filter(r => r.level === L), ls = Core.ratingSeries(mine);
        const rt = ls.length >= MIN_N ? Math.round(ls[ls.length - 1].rating) : null;
        if (rt != null) doc['r' + L] = rt;
        nl.push(ls.length);
        lv.push([rt, ls.length, best(mine.filter(r => r.mode === 'sprint' && (r.durationMs || 60000) === 60000)), best(mine.filter(r => r.mode === 'long'))]);
        const rows = Object.entries(opsCount(mine.flatMap(r => r.items || []))).sort((a, b) => b[1].n - a[1].n).slice(0, 24)
          .map(([o, x]) => [String(o).slice(0, 12), x.n, Math.round(x.sum), x.nf, Math.round(x.f), x.nc, x.cl, x.sk]);
        if (rows.length) ops[L] = rows;
      }
      const ds = Core.duelSeries(duels, st.name);
      if (ds.length >= MIN_N) doc.dr = Math.round(ds[ds.length - 1].rating);
      const cnt = v => duels.filter(d => d.outcome === v).length;
      const inputs = {};
      for (const r of rounds) { const k = INPUTS.includes(r.input) ? r.input : 'keyboard'; inputs[k] = (inputs[k] || 0) + 1; }
      const inp = Object.entries(inputs).sort((a, b) => b[1] - a[1])[0];
      const days = rounds.map(r => dayNo(r.startedAt)).concat(duels.map(d => dayNo(d.at)));
      const heat = {};
      for (const [k, v] of Object.entries(heatAvg(rounds))) heat[k] = Math.round(v);
      doc.sm = { n: ser.length, nl, nd: ds.length, w: cnt(1), dw: cnt(0.5), l: cnt(0), inp: inp ? inp[0] : null, act: days.length ? Math.max(...days) : null };
      doc.d = {

        rp: ser.length ? Math.round(Math.max(...ser.map(p => p.rating))) : null,
        ds: thin(ds.map(x => [dayNo(x.d.at), Math.round(x.rating)])),
        dp: ds.length ? Math.round(Math.max(...ds.map(x => x.rating))) : null,
        lv, ops, heat, ho: 1,   // ho = times-table keys in the order shown (since 1.28)

    }
    function fields(doc) {
      const f = { name: fsStr(doc.name), s: fsStr(doc.s), v: fsInt(PV) };
      if (doc.hid) { f.hid = { booleanValue: true }; return f; }
      for (const k of RK) if (doc[k] != null) f[k] = fsInt(doc[k]);
      f.sm = fsStr(JSON.stringify(doc.sm)); f.d = fsStr(JSON.stringify(doc.d));

    }
    /* A profile from the server, written by someone's device: every value is checked, nothing is trusted. */
    function parse(d) {
      const f = (d && d.fields) || {};
      const out = { uid: String(d.name || '').split('/').pop(), name: clip(fromFs(f.name)), s: String(fromFs(f.s) || ''), hid: fromFs(f.hid) === true, ut: d.updateTime || null };
      for (const k of RK) { const v = N(fromFs(f[k])); if (v != null) out[k] = Math.round(v); }
      const m = js(fromFs(f.sm)) || {};
      out.sm = { n: N(m.n) || 0, nl: Array.from({ length: Core.NLEVELS }, (_, i) => N(arr(m.nl, Core.NLEVELS)[i]) || 0), nd: N(m.nd) || 0,
        w: N(m.w) || 0, dw: N(m.dw) || 0, l: N(m.l) || 0, inp: INPUTS.includes(m.inp) ? m.inp : null, act: N(m.act) };
      const x = f.d ? js(fromFs(f.d)) : null;

        const pts = (a, k) => arr(a, 3000).filter(Array.isArray).map(p => p.slice(0, k).map(N)).filter(p => p[0] != null && p[1] != null);
        const ops = {};
        for (let L = 1; L <= Core.NLEVELS; L++) {
          const rows = arr(x.ops && typeof x.ops === 'object' ? x.ops[L] : null, 40).filter(Array.isArray)
            .map(p => [String(p[0]).slice(0, 12)].concat(p.slice(1, 8).map(v => Math.max(0, N(v) || 0))));
          if (rows.length) ops[L] = rows;
        }
        const heat = {};
        if (x.heat && typeof x.heat === 'object') for (const [k, v] of Object.entries(x.heat)) if (/^(10|[2-9])x(10|[2-9])$/.test(k) && N(v) > 0) heat[k] = N(v);
        out.d = { rs: pts(x.rs, 3), rp: N(x.rp), ds: pts(x.ds, 2), dp: N(x.dp),
          lv: Array.from({ length: Core.NLEVELS }, (_, i) => { const p = arr(arr(x.lv, Core.NLEVELS)[i], 4); return [N(p[0]), N(p[1]) || 0, N(p[2]), N(p[3])]; }),
          ops, heat, ho: x.ho === 1, tot: Array.from({ length: 3 }, (_, i) => N(arr(x.tot, 3)[i]) || 0) };

    }
    async function getDoc(path, tok) {
      try { return await A.call(`${FS_BASE}/${A.DB()}/${path}?${A.kq()}`, tok ? { method: 'GET', headers: { Authorization: 'Bearer ' + tok } } : { method: 'GET' }); }
      catch (e) { if (e.http === 404) return null; throw e; }
    }
    const profCache = new Map();
    async function getProf(uid, fresh) {

      const d = await getDoc('profiles/' + encodeURIComponent(uid));
      const doc = d ? parse(d) : null;
      profCache.set(uid, { at: Date.now(), doc });
      return doc;
    }

    /* --- the own profile: state on this device (kept in kr.acct as prof) ---
       want: 'pub' | 'hid' | null (not decided yet: accounts from before 1.23); known: the server's state was read once;
       ut: update time of the last version seen or written (writes are made only on top of it, so a choice made on
       another device is noticed); h: hash of what was last written; ban: hidden by the admin. */
    const P = () => { const st = Acct.state; return st ? (st.prof || (st.prof = { want: null, known: false, ut: null, h: null, ban: false })) : null; };

    }
    let run = null, rerun = false, forceNext = false, lastErr = null, wrote = false;
    const same = st => Acct.state === st && Acct.on();
    async function banned(uid) { try { return !!(await getDoc('bans/' + encodeURIComponent(uid), await A.token())); } catch (e) { return false; } }
    function publish(force) {
      if (force) forceNext = true;
      if (!Acct.on() || !usable()) return Promise.resolve();
      if (run) { rerun = true; return run; }
      run = (async () => {
        try { do { rerun = false; const f = forceNext; forceNext = false; await publishOnce(f); } while (rerun && Acct.on()); lastErr = null; }
        catch (e) { lastErr = e; }
        finally {
          run = null; A.save(); A.rerender();
          if (document.body.dataset.screen === 'board') { if (wrote) reload(); else render(); }
          if (wrote) mini();

    }
    async function publishOnce(force) {
      const st = Acct.state, uid = st.uid, p = P();
      if (!p.known) { const doc = await getProf(uid, true); if (!same(st)) return; adopt(p, doc); }
      if (!p.want) return;
      if (p.ban) {

        if (await banned(uid)) { p.banAt = Date.now(); return; }

        if (!p.want || (!force && p.want === 'hid' && p.ut)) return;   // hidden and already written as hidden

        if (!force) w.currentDocument = p.ut ? { updateTime: p.ut } : { exists: false };
        try {
          const res = await A.commit([w], await A.token());

          p.ut = (wr && wr.updateTime) || null; p.h = h;
          p.top = Object.fromEntries(RK.filter(k => doc[k] != null).map(k => [k, doc[k]]));

        } catch (e) {

          if (force || !['FAILED_PRECONDITION', 'ABORTED', 'ALREADY_EXISTS', 'NOT_FOUND'].includes(e.status)) throw e;

      if (fresh) p.ut = null;

    let ownAt = 0;
    async function refreshOwn(force) {

      ownAt = Date.now();
      try {
        const doc = await getProf(st.uid, true), p = P();
        if (!same(st) || run) return;
        const was = JSON.stringify([p.want, p.ut, p.known]);
        adopt(p, doc); A.save();
        if (JSON.stringify([p.want, p.ut, p.known]) !== was) { A.rerender(); if (document.body.dataset.screen === 'board') render(); }
        if (p.want === 'pub' && !doc) publish();   // chosen here earlier, but not written yet
      } catch (e) { /* stays as it was */ }
    }
    Me.synced = () => publish();

    /* --- account page: the public-profile section --- */
    const btn = (id, label, primary) => `<button class="btn small${primary ? ' primary' : ''}" id="${id}" type="button">${esc(label)}</button>`;
    function acctHtml() {

    }
    function acctBind() {

    /* --- the leaderboard --- */
    let bd = Object.assign({ kind: 'duel', level: 0 }, LS.get('kr.board', {}));   // the duel board first (since 1.24, with the small board next to the lobby)
    if (!['solo', 'duel'].includes(bd.kind)) bd.kind = 'duel';

    const boardCache = new Map(), rankCache = new Map();

      const rows = (Array.isArray(res) ? res : []).map(e => e && e.document).filter(Boolean).map(parse).filter(x => x.name && x[f] != null);

    async function placeOf(f, v) {   // own place when not among the top: how many have more, plus one (one read)

    }
    const idle = sm => sm.act == null || today() - sm.act > IDLE_DAYS;
    function ownBox() {

      if (!Acct.on()) return box(t('bdOwnOut'), btn('bdAcct', t('bdToAcct')));

        `<button class="btn" id="bdFindGo" type="submit">${esc(t('bdFindGo'))}</button></form><p class="msg ${findMsg ? findMsg.k : ''}" id="bdFindMsg" aria-live="polite">${findMsg ? esc(findMsg.text) : ''}</p></section>` +
        `<div class="actions"><button class="btn" id="bdBack" type="button">${esc(t('menu'))}</button></div>`;
      el.innerHTML = h;
      el.querySelectorAll('#bdKind button').forEach(b => b.addEventListener('click', () => {

    /* --- the small leaderboard in the side panel (since 1.24) ---
       The top 5 of the board chosen last (duels by default), the own place, and a link to the whole board.
       Reads: none while the whole board is cached (its first 5 rows), else 5 per load, kept for 5 minutes; the own place
       when not among them costs one more (cached 60 s). Loaded only while it is visible: on wide screens with the menu,

    const MINI = 5, MINI_MS = 300000, miniCache = new Map(), miniPending = new Map();
    let ms = { f: null, rows: null, loading: false, err: null, rank: null }, miniSeq = 0;
    const miniShown = () => sideHomeShown() && document.body.dataset.screen !== 'board';
    function miniCached(f) {
      const c = boardCache.get(f);
      if (c && Date.now() - c.at < CACHE_MS) return c.rows.slice(0, MINI);
      const m = miniCache.get(f);
      return m && Date.now() - m.at < MINI_MS ? m.rows : null;
    }
    function miniRows(f) {   // one request per board at a time (the menu and the account start can ask together)
      if (!miniPending.has(f)) miniPending.set(f, miniFetch(f).finally(() => miniPending.delete(f)));
      return miniPending.get(f);
    }
    async function miniFetch(f) {
      const q = { from: [{ collectionId: 'profiles' }], select: { fields: ['name', 'sm', f].map(fieldPath => ({ fieldPath })) },
        orderBy: [{ field: { fieldPath: f }, direction: 'DESCENDING' }], limit: MINI };
      const res = await A.call(`${FS_BASE}/${A.DB()}:runQuery?${A.kq()}`, A.json({ structuredQuery: q }));
      const rows = (Array.isArray(res) ? res : []).map(e => e && e.document).filter(Boolean).map(parse).filter(x => x.name && x[f] != null);
      miniCache.set(f, { at: Date.now(), rows });
      return rows;
    }
    async function miniLoad() {
      const f = field(), my = ++miniSeq, cached = miniCached(f);
      ms = { f, rows: cached || (ms.f === f ? ms.rows : null), loading: !cached, err: null, rank: null };
      if (!cached) miniDraw();
      try {
        const rows = cached || await miniRows(f);
        if (my !== miniSeq) return;
        ms.rows = rows; ms.loading = false;
        const mine = ownValue(f), uid = Acct.on() ? Acct.state.uid : null;
        if (mine != null && !rows.some(x => x.uid === uid)) {
          const full = boardCache.get(f), i = full ? full.rows.findIndex(x => x.uid === uid) : -1;   // among the top 20 already loaded?
          ms.rank = { v: mine, n: i >= 0 ? i + 1 : null };
          if (i < 0) {
            miniDraw();
            try { const n = await placeOf(f, mine); if (my === miniSeq) ms.rank.n = n; } catch (e) { /* the line shows without a place */ }
            if (my !== miniSeq) return;
          }
        }
        miniDraw();
      } catch (e) { if (my !== miniSeq) return; ms.loading = false; ms.err = e; miniDraw(); }
    }
    function miniDraw() {
      const el = $('#mini');
      if (!el || !miniShown()) return;
      const duel = bd.kind === 'duel', f = field(), rows = ms.f === f ? ms.rows : null, uid = Acct.on() ? Acct.state.uid : null;
      const ae = document.activeElement, fk = ae && el.contains(ae) ? (ae.id || (ae.dataset && ae.dataset.v ? 'v:' + ae.dataset.v : null)) : null;
      let h = `<div class="mini-head"><h2 id="h-mini">${esc(t('bdTitle'))}</h2><div class="pick" id="miKind" role="radiogroup" aria-labelledby="h-mini">` +
        [['duel', t('bdDuel')], ['solo', t('bdSolo')]].map(([v, l]) => `<button type="button" role="radio" aria-checked="${bd.kind === v}" data-v="${v}">${esc(l)}</button>`).join('') + '</div></div>';
      if (!duel && bd.level) h += `<p class="mini-sub">${esc(`${t('level')} ${bd.level}: ${t('levels')[bd.level - 1]}`)}</p>`;
      if (!rows) {
        h += ms.err && ms.f === f ? `<p class="msg bad">${esc(ms.err.code === 'net' ? t('acNet') : t('bdFail'))}</p><button type="button" class="more" id="miRetry">${esc(t('bdRetry'))}</button>`
          : `<p class="mini-empty">${esc(t('miniLoading'))}</p>`;
      } else {
        const vs = rows.map(x => x[f]), hi = Math.max(...vs), lo = Math.min(...vs);
        const bar = v => hi > lo ? Math.round(34 + 66 * (v - lo) / (hi - lo)) : 100;   // bar length: lowest shown 34 %, highest 100 % (1.26)
        h += !rows.length ? `<p class="mini-empty">${esc(t('bdEmpty', duel))}</p>` : '<ol class="mini-list">' + rows.map((x, i) =>
          `<li class="${[x.uid === uid ? 'me' : '', idle(x.sm) ? 'idle' : ''].filter(Boolean).join(' ')}" style="--w:${bar(x[f])}%"><span class="rk">${i + 1}</span>` +
          `<button class="rowbtn" type="button" data-uid="${esc(x.uid)}">${esc(x.name)}</button><b>${x[f]}</b></li>`).join('') + '</ol>';
        const p = P();
        if (Acct.on() && p && p.want === 'pub' && !p.ban && !rows.some(x => x.uid === uid)) {
          h += `<p class="lb-own">${esc(ms.rank ? (ms.rank.n ? t('bdOwnRank', ms.rank.n, ms.rank.v) : t('bdOwnVal', ms.rank.v)) : t('bdOwnNone', duel, bd.level))}</p>`;
        }
      }
      h += `<button type="button" class="more" id="miAll">${esc(t('miniAll'))}</button>`;
      el.innerHTML = h;
      el.querySelectorAll('#miKind button').forEach(b => b.addEventListener('click', () => {
        if (bd.kind === b.dataset.v) return;
        bd.kind = b.dataset.v; LS.set('kr.board', bd); miniLoad();
        const x = el.querySelector(`#miKind [data-v="${bd.kind}"]`); if (x) x.focus();
      }));
      el.querySelectorAll('.mini-list .rowbtn').forEach(b => b.addEventListener('click', () => openProfile(b.dataset.uid, 'menu', null, b.textContent)));
      const B = (id, fn) => { const b = document.getElementById(id); if (b) b.addEventListener('click', fn); };
      B('miAll', open);
      B('miRetry', () => { miniCache.delete(f); miniLoad(); });
      if (fk) { const x = fk.startsWith('v:') ? el.querySelector(`#miKind [data-v="${fk.slice(2)}"]`) : document.getElementById(fk); if (x) x.focus({ preventScroll: true }); }
    }
    /* called when the menu or the Duel tab is shown, on a language change and after an own profile write */
    function mini() {
      const el = $('#mini');
      if (!el) return;
      el.hidden = !usable() || document.body.dataset.screen === 'board';   // the full board is open anyway
      if (el.hidden || !miniShown()) return;
      miniLoad();
    }

    let findDraft = '', findMsg = null;
    /* look a player up by username (look-alikes count): { uid, doc } or { err: 'bad' | 'none' | 'private', name } */
    async function lookup(name) {
      const nk = nameKey(name);
      if (!nk || nk.reserved) return { err: 'bad' };
      const n = await A.getName(nk.s);
      if (!n || !n.uid) return { err: 'none' };
      const doc = await getProf(n.uid);
      if (!doc || doc.hid) return { err: 'private', name: n.name };
      return { uid: n.uid, doc };
    }
    const lookErr = r => (r.err === 'bad' ? t('bdNameBad') : r.err === 'none' ? t('acUnknown') : t('bdPrivate', r.name));
    async function find() {
      const name = clip(findDraft), m = $('#bdFindMsg');
      if (!name) { $('#bdName').focus(); return; }
      if (m) { m.className = 'msg'; m.textContent = t('loading'); }
      try {
        const r = await lookup(name);
        if (document.body.dataset.screen !== 'board') return;
        if (r.err) { findMsg = { k: 'bad', text: lookErr(r) }; render(); return; }
        findMsg = null; openProfile(r.uid, 'board', r.doc);
      } catch (e) { findMsg = { k: 'bad', text: e.code === 'net' ? t('acNet') : t('bdFail') }; render(); }
    }

    /* --- a public profile --- */
    let pv = null, pvChart = 'solo', pvWin = 'all', pvOps = null;
    async function openProfile(uid, from, doc, name) {
      if (!usable()) return;
      const me = { uid, from, name, doc: doc || null, loading: !doc, err: null };
      pv = me; pvOps = null;
      show('profile'); renderProfile();
      const b = $('#profile .btn'); if (b) b.focus({ preventScroll: true });
      if (doc && doc.d) return;
      try {
        const d = await getProf(uid, from === 'account');
        if (pv !== me) return;
        me.loading = false;
        if (!d || d.hid) me.err = { k: 'private', name: d ? d.name : null }; else me.doc = d;
      } catch (e) { if (pv !== me) return; me.loading = false; me.err = { k: e.code === 'net' ? 'net' : 'fail' }; }
      renderProfile();
    }
    async function openByName(name, from) {
      if (!usable()) return;
      const me = { from, name, loading: true, doc: null, err: null };
      pv = me; pvOps = null;
      show('profile'); renderProfile();
      try {
        const r = await lookup(name);
        if (pv !== me) return;
        if (r.err) { me.loading = false; me.err = { k: r.err, name: r.name || name }; renderProfile(); return; }
        me.uid = r.uid; me.doc = r.doc; me.loading = false;
      } catch (e) { if (pv !== me) return; me.loading = false; me.err = { k: e.code === 'net' ? 'net' : 'fail' }; }
      renderProfile();
    }
    function backFromProfile() {
      const to = pv ? pv.from : 'menu';
      if (to === 'board') { show('board'); showBoard(); }
      else if (to === 'stats') { show('stats'); renderStats(); }
      else if (to === 'duel') { show('duel'); renderDuel(); }
      else if (to === 'account') Acct.open();
      else show('menu');
    }
    const actText = act => (act == null ? '' : today() - act <= 7 ? t('pfAct7') : today() - act <= IDLE_DAYS ? t('pfAct30') : t('pfActOld'));
    const seg = (id, opts, cur, label, cls = '') => `<div class="pick${cls ? ' ' + cls : ''}" id="${id}" role="radiogroup" aria-label="${esc(label)}">` +
      opts.map(([v, l]) => `<button type="button" role="radio" aria-checked="${String(v) === String(cur)}" data-v="${v}">${esc(l)}</button>`).join('') + '</div>';
    function chartHtml(d) {
      const solo = d.rs.length, duel = d.ds.length;
      if (!solo && !duel) return '';
      const kind = pvChart === 'duel' && duel ? 'duel' : solo ? 'solo' : 'duel';
      const from = pvWin === 'all' ? -Infinity : today() - (+pvWin);
      const pts = kind === 'solo' ? d.rs.filter(p => p[0] >= from).map(p => ({ rating: p[1], perf: p[2], at: dayIso(p[0]) }))
        : d.ds.filter(p => p[0] >= from).map(p => ({ rating: p[1], at: dayIso(p[0]) }));
      let h = `<section><h3>${esc(t('pfHist'))}</h3><div class="pfctl">` +
        (solo && duel ? seg('pfKind', [['solo', t('bdSolo')], ['duel', t('bdDuel')]], kind, t('pfHist')) : '') +
        seg('pfWin', [['30', t('w30')], ['90', t('w90')], ['365', t('w365')], ['all', t('wall')]], pvWin, t('period'), 'win') + '</div>';
      const peak = pvWin === 'all' ? (kind === 'solo' ? d.rp : d.dp) : pts.length ? Math.max(...pts.map(p => p.rating)) : null;   // the peak of what the chart shows
      if (peak != null) h += `<p class="pf-peak">${esc(t('ratingPeak'))}: <b>${peak}</b></p>`;
      h += pts.length >= 2 ? ratingChart(pts, kind === 'solo' ? t('ratingTitle') : t('duelRating')) + `<p class="note">${esc(kind === 'solo' ? t('ratingLegend') : t('pfDuelLegend'))}</p>`
        : `<p class="note">${esc(pts.length ? t('pfOneWin', kind === 'duel') : t('pfNoWin', kind === 'duel'))}</p>`;
      const refList = Core.RATING.ref.map((v, i) => `${i + 1}: ${dec(v)}`).join(SEP());
      h += kind === 'solo' ? `<details class="how"><summary>${esc(t('ratingHow'))}</summary>${t('ratingExplain', refList).map(p => `<p>${esc(p)}</p>`).join('')}</details>`
        : `<details class="how"><summary>${esc(t('duelHow'))}</summary>${t('duelExplain').map(p => `<p>${esc(p)}</p>`).join('')}</details>`;
      return h + '</section>';
    }
    function levelsHtml(d) {
      const rows = d.lv.map((p, i) => [i + 1, p]).filter(([, p]) => p[1] > 0 || p[2] != null || p[3] != null);
      if (!rows.length) return '';
      const long = rows.some(([, p]) => p[3] != null);   // the 3-minute column only for players who played 3-minute runs
      const v = x => (x == null ? '–' : x);
      return `<section><h3>${esc(t('pfLevels'))}</h3><div class="scroll"><table class="pft"><thead><tr><th rowspan="2">${esc(t('level'))}</th><th class="n" rowspan="2">${esc(t('ratingTitle'))}</th>` +
        `<th class="n" rowspan="2">${esc(t('runs'))}</th><th class="n grp" colspan="${long ? 2 : 1}">${esc(t('pfBest'))}</th></tr>` +
        `<tr><th class="n">${esc(t('pfBest60'))}</th>${long ? `<th class="n">${esc(t('pfBest3'))}</th>` : ''}</tr></thead><tbody>` +
        rows.map(([L, p]) => `<tr><td class="lvn"><b>${L}</b><span class="lvname">${esc(t('levels')[L - 1])}</span></td><td class="n"><b>${v(p[0])}</b></td><td class="n">${p[1]}</td>` +
          `<td class="n">${v(p[2])}</td>${long ? `<td class="n">${v(p[3])}</td>` : ''}</tr>`).join('') +
        `</tbody></table></div><p class="note">${esc(long ? t('pfLevelsNote') : t('pfLevelsNote60'))}</p></section>`;
    }
    function opsHtml(d) {
      const lv = Object.keys(d.ops).map(Number).sort((a, b) => a - b);
      if (!lv.length) return '';
      if (!lv.includes(pvOps)) pvOps = lv.slice().sort((a, b) => d.lv[b - 1][1] - d.lv[a - 1][1] || a - b)[0];   // most-played level first
      const by = {};
      for (const [o, n, sum, nf, f, nc, cl, sk] of d.ops[pvOps]) by[o] = { n, sum, nf, f, nc, cl, sk };
      const head = `<h3>${esc(t('byOp'))}</h3>` + (lv.length > 1 ? `<div class="pfctl">${seg('pfOps', lv.map(L => [L, String(L)]), pvOps, t('level'))}</div>` : '') +
        `<p class="pf-peak">${esc(t('level'))} ${pvOps}: ${esc(t('levels')[pvOps - 1])}</p>`;
      return opsTable(by, head);
    }
    function renderProfile() {
      const el = $('#profile');
      if (!el || document.body.dataset.screen !== 'profile' || !pv) return;
      const ae = document.activeElement, fk = ae && el.contains(ae) && ae.dataset && ae.dataset.v ? [ae.closest('[id]').id, ae.dataset.v] : null;
      const back = `<div class="actions"><button class="btn" id="pfBack" type="button">${esc(pv.from === 'menu' ? t('menu') : t('acBackBtn'))}</button></div>`;
      const x = pv.doc;
      let h;
      if (pv.loading) h = `<h1 class="res-head">${esc(pv.name || t('pfTitle'))}</h1><p class="note">${esc(t('loading'))}</p>`;
      else if (pv.err) {
        const e = pv.err;
        h = `<h1 class="res-head">${esc(e.name || pv.name || t('pfTitle'))}</h1><p class="lede">${esc(e.k === 'private' ? t('bdPrivate', e.name || pv.name || '') : e.k === 'none' ? t('acUnknown') : e.k === 'bad' ? t('bdNameBad') : e.k === 'net' ? t('acNet') : t('bdFail'))}</p>`;
      } else {
        const sm = x.sm, d = x.d || { rs: [], ds: [], lv: [], ops: {}, heat: {}, tot: [0, 0, 0], rp: null, dp: null };
        const sub = [sm.inp ? t('pfInput', t('inputName')[sm.inp]) : '', actText(sm.act)].filter(Boolean).join(' ');
        h = `<h1 class="res-head">${esc(x.name)}</h1>` + (sub ? `<p class="pf-sub">${esc(sub)}</p>` : '<p class="pf-sub"></p>') +
          kvHtml([[t('ratingTitle'), x.r != null ? x.r : '–'], [t('duelRating'), x.dr != null ? x.dr : '–'], [t('ratingRuns'), sm.n],
            [t('record'), sm.nd ? t('recordVal', sm.w, sm.dw, sm.l) : '–'], [t('nRounds'), d.tot[0]], [t('playTime'), fmtDur(d.tot[2])]]);
        if ((x.r == null && sm.n) || (x.dr == null && sm.nd)) h += `<p class="note kv-note">${esc(t('pfMinNote'))}</p>`;
        const parts = [chartHtml(d), levelsHtml(d)].filter(Boolean);
        if (parts.length) h += `<div class="sheet">${parts.join('')}</div>`;
        const more = [opsHtml(d), heatGrid(d.heat, t('pfHeatNote'), !d.ho)].filter(Boolean);
        if (more.length) h += `<div class="sheet">${more.join('')}</div>`;
        if (!parts.length && !more.length) h += `<p class="empty">${esc(t('pfEmpty'))}</p>`;
      }
      el.innerHTML = h + back;
      $('#pfBack').addEventListener('click', backFromProfile);
      const bindSeg = (id, fn) => el.querySelectorAll(`#${id} button`).forEach(b => b.addEventListener('click', () => { fn(b.dataset.v); renderProfile(); const f = $(`#${id} [data-v="${b.dataset.v}"]`); if (f) f.focus({ preventScroll: true }); }));
      bindSeg('pfKind', v => { pvChart = v; });
      bindSeg('pfWin', v => { pvWin = v; });
      bindSeg('pfOps', v => { pvOps = +v; });
      if (fk) { const f = document.querySelector(`#${fk[0]} [data-v="${fk[1]}"]`); if (f) f.focus({ preventScroll: true }); }
    }

    const showBoard = () => { if (boardCache.has(field())) render(); else reload(); };   // reloaded only when the cached list is gone (e.g. after an own write)
    function rerender() {
      const scr = document.body.dataset.screen;
      if (scr === 'board') showBoard(); else if (scr === 'profile') renderProfile();
      miniDraw();
    }
    Store.ready.then(() => { mini(); nav(); });
    return { usable, open, openByName, openProfile, choose, publish, refreshOwn, acctHtml, acctBind, rerender, mini, langChanged: rerender };
  })();
  if (window.__KR_TEST) { window.__krAcct = Acct; window.__krStore = Store; window.__krNameKey = nameKey; window.__krBoard = Board; }   // only for automated tests

  /* ----- go ----- */
  applyLang();
  if (location.hash !== '#admin') Lobby.start();
  const hashCode = /^#duel=([A-Z0-9]{6})$/i.exec(location.hash || '');
  if (hashCode) {
    history.replaceState(null, '', location.pathname + location.search);
    openDuel(hashCode[1].toUpperCase());
  } else if (location.hash === '#admin') {
    show('admin'); renderAdmin();
  } else {
    show('menu');
  }
  renderShare();
  setTimeout(() => Central.flush(), 3000);
  window.addEventListener('hashchange', () => { if (location.hash === '#admin' && document.body.dataset.screen !== 'game') { show('admin'); renderAdmin(); } });
})();
</script>
</body>
</html>
