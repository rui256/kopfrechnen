<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://mental-math.github.io/">
<title>Kopfrechnen</title>
<script>
/* The game has moved to the new address. This page stays at the old one and tells visitors about it. A link with a hash
   (duel, room, admin) goes straight on, with the hash, when there is nothing to move. Data from the game on this device
   can be taken along: the page opens the new address in a new tab as ?move, and when that tab says hello, it sends every
   kr.* key there in a window message (to the new origin only). The new tab stores it and answers done. Someone signed in
   also gets their user name and key to copy, for signing in by hand at the new address. */
(function () {
  var NEW = window.__KR_NEW || 'https://mental-math.github.io';
  function get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function n(k) { var a = get(k); return Array.isArray(a) ? a.length : 0; }
  var total = n('kr.rounds') + n('kr.duels') + n('kr.balls');
  var a = get('kr.acct'), signed = !!(a && a.uid && a.rt), moved = get('kr.moved');
  var done = moved && typeof moved === 'object' && total <= (moved.n || 0) && (!signed || moved.u === a.uid);
  if (location.hash.length > 1 && ((!total && !signed) || done)) {
    document.documentElement.setAttribute('data-go', '');
    location.replace(NEW + '/' + location.hash);
  }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F8FAFD; --grid:#DFE8F3; --ink:#18212C; --soft:#566273;
  --accent:#1C3FA8; --on-accent:#FFFFFF; --red:#D0283A; --good:#1F7A4D;
  --surface:#FFFFFF; --line:#C7D3E2; --mark:rgba(28,63,168,.13);
  --font:"Atkinson Hyperlegible","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mx:max(8px, env(safe-area-inset-left,0px));
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1D2925; --grid:#25332E; --ink:#EDF1EA; --soft:#A3B0A7;
    --accent:#F2D36B; --on-accent:#1D2925; --red:#F293A8; --good:#9AD9A8;
    --surface:#22302B; --line:#3A4A43; --mark:rgba(242,211,107,.16); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1D2925; --grid:#25332E; --ink:#EDF1EA; --soft:#A3B0A7;
  --accent:#F2D36B; --on-accent:#1D2925; --red:#F293A8; --good:#9AD9A8;
  --surface:#22302B; --line:#3A4A43; --mark:rgba(242,211,107,.16); color-scheme:dark;
}
html[data-go] body{visibility:hidden}
html{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100%;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);font-family:var(--font);font-size:1.0625rem;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{position:relative;max-width:780px;min-height:100vh;margin:0 auto;
  padding:18px max(20px, env(safe-area-inset-right,0px)) 56px calc(var(--mx) + 30px)}
.margin{position:absolute;top:0;bottom:0;left:var(--mx);width:3px;border-radius:2px;background:color-mix(in srgb,var(--red) 20%,transparent)}
.brand{display:block;font-weight:700;color:var(--soft);padding:6px 0;margin-bottom:clamp(28px,9vh,72px)}
.moved{margin:0 0 4px;color:var(--soft);font-size:1.125rem}
h1{margin:0 0 18px;font-size:clamp(2rem,8vw,3.75rem);line-height:1.08;letter-spacing:-.02em;color:var(--accent);overflow-wrap:anywhere}
h1 span{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.lede{max-width:46ch;margin:0 0 34px;color:var(--soft);font-size:1.125rem}
.sheet{max-width:600px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:16px 20px 18px}
h2{margin:0 0 4px;font-size:1rem}
.sum{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:10px 12px;margin-top:18px}
.btn{font:inherit;font-weight:700;min-height:48px;padding:10px 22px;border-radius:6px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);padding:10px 32px;font-size:1.125rem}
.btn:disabled{opacity:.6;cursor:default}
.msg{margin:14px 0 0;font-size:.9375rem;font-weight:700}
.msg:empty{display:none}
.msg.ok{color:var(--good)} .msg.bad{color:var(--red)}
.note{color:var(--soft);font-size:.9375rem;margin:14px 0 0;max-width:62ch}
.lede + .actions{margin:-16px 0 0}
.sheet + .sheet{margin-top:16px}
.cred{margin:14px 0 0}
.cred dt{font-size:.875rem;color:var(--soft);margin:0}
.cred dd{margin:0 0 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.cred dd:last-child{margin-bottom:0}
.val{font-size:1.25rem;font-weight:700;overflow-wrap:anywhere;margin-right:auto}
.val.key{letter-spacing:.08em;font-variant-numeric:tabular-nums}
.val.key.masked{letter-spacing:0;color:var(--soft);font-family:"Atkinson Hyperlegible",Arial,Helvetica,sans-serif}   /* CJK fonts draw • full width */
.cb{display:inline-flex;gap:8px}
.btn.small{min-height:38px;padding:6px 14px;font-weight:400;font-size:.9375rem}
.btn.small.ok{color:var(--good);border-color:var(--good)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (max-width:420px){
  .wrap{padding-left:calc(var(--mx) + 22px);padding-right:16px}
  .sheet{padding:14px 14px 16px}
  .btn.primary{padding:10px 22px}
  .actions .btn{flex:1 1 auto;justify-content:center}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="margin" aria-hidden="true"></div>
  <span class="brand" id="brand">Kopfrechnen</span>
  <main>
    <p class="moved" id="moved"></p>
    <h1><span>mental-math<wbr>.github.io</span></h1>
    <p class="lede" id="lede"></p>
    <div class="actions" id="topActs" hidden></div>
    <section class="sheet" id="box" aria-labelledby="boxH" hidden>
      <h2 id="boxH"></h2>
      <p class="sum" id="sum"></p>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
      <div class="actions" id="acts"></div>
      <p class="note" id="how"></p>
    </section>
    <section class="sheet" id="acc" aria-labelledby="accH" hidden>
      <h2 id="accH"></h2>
      <p class="note" id="accNote"></p>
      <dl class="cred">
        <dt id="lblName"></dt>
        <dd><span class="val" id="valName"></span><span class="cb"><button class="btn small" id="cpName" type="button"></button></span></dd>
        <dt id="lblKey"></dt>
        <dd><span class="val key" id="valKey"></span><span class="cb"><button class="btn small" id="shKey" type="button" aria-pressed="false"></button><button class="btn small" id="cpKey" type="button"></button></span></dd>
      </dl>
      <p class="msg" id="accMsg" role="status" aria-live="polite"></p>
    </section>
  </main>
</div>
<noscript><p style="padding:0 30px">Kopfrechnen: <a href="https://mental-math.github.io/">mental-math.github.io</a></p></noscript>
<script>
(function () {
  'use strict';
  const NEW = window.__KR_NEW || 'https://mental-math.github.io';
  if (document.documentElement.hasAttribute('data-go')) return;   // forwarding already
  const $ = id => document.getElementById(id);
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const arr = v => (Array.isArray(v) ? v : []);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const T = {
    de: {
      brand: 'Kopfrechnen', moved: 'Kopfrechnen ist umgezogen nach',
      lede: 'Konten, Profile und die Bestenliste sind dort unverändert. Bitte nutze ab jetzt die neue Adresse und ändere auch deine Lesezeichen.',
      here: 'Auf diesem Gerät',
      rounds: n => `${n} ${n === 1 ? 'Runde' : 'Runden'}`, duels: n => `${n} ${n === 1 ? 'Duell' : 'Duelle'}`,
      balls: n => `${n} ${n === 1 ? 'Mathefußball-Spiel' : 'Mathefußball-Spiele'}`,
      list: p => (p.length > 1 ? p.slice(0, -1).join(', ') + ' und ' + p[p.length - 1] : p[0]) + '.',
      signed: n => `Angemeldet als ${n}.`,
      take: 'Daten mitnehmen', skip: 'Ohne Daten weiter', busy: 'Wird übertragen …',
      how: s => `Ein neuer Tab öffnet die neue Adresse und übernimmt dort alles${s ? ', auch deine Anmeldung' : ''}. Hier bleibt eine Kopie.`,
      wait: 'Der neue Tab übernimmt deine Daten.',
      done: 'Fertig: Deine Daten sind jetzt unter der neuen Adresse. Diesen Tab kannst du schließen.', go: 'Zur neuen Adresse',
      blocked: 'Das hat nicht geklappt: Der Browser hat den neuen Tab blockiert.',
      timeout: 'Das hat nicht geklappt: Der neue Tab hat nicht geantwortet.',
      quota: 'Das hat nicht geklappt: Unter der neuen Adresse ist nicht genug Speicherplatz.',
      fail: 'Das hat nicht geklappt: Die Daten ließen sich unter der neuen Adresse nicht speichern.',
      retry: 'Erneut versuchen', file: 'Als Datei sichern',
      fileHow: 'Die Datei liest du unter der neuen Adresse in der Statistik mit „Daten importieren“ ein.',
      saved: 'Datei gespeichert.',
      already: 'Deine Daten sind schon unter der neuen Adresse.', again: 'Nochmal mitnehmen',
      accH: 'Dein Konto', accNote: 'Falls du unter der neuen Adresse noch nicht angemeldet bist, melde dich dort mit diesem Benutzernamen und Schlüssel an.',
      lblName: 'Benutzername', lblKey: 'Schlüssel', copy: 'Kopieren', copied: 'Kopiert', show: 'Anzeigen', hide: 'Verbergen',
      copiedName: 'Benutzername kopiert.', copiedKey: 'Schlüssel kopiert.',
      copyFail: 'Kopieren hat nicht geklappt. Lass dir den Schlüssel anzeigen und schreib ihn ab.',
    },
    en: {
      brand: 'Mental Math', moved: 'Mental Math has moved to',
      lede: 'Accounts, profiles and the leaderboard are unchanged there. Please use the new address from now on, and update your bookmarks too.',
      here: 'On this device',
      rounds: n => `${n} ${n === 1 ? 'round' : 'rounds'}`, duels: n => `${n} ${n === 1 ? 'duel' : 'duels'}`,
      balls: n => `${n} math football ${n === 1 ? 'match' : 'matches'}`,
      list: p => (p.length > 1 ? p.slice(0, -1).join(', ') + ' and ' + p[p.length - 1] : p[0]) + '.',
      signed: n => `Signed in as ${n}.`,
      take: 'Take my data along', skip: 'Continue without data', busy: 'Moving …',
      how: s => `A new tab opens the new address and takes everything over${s ? ', your sign-in included' : ''}. A copy stays here.`,
      wait: 'The new tab is taking over your data.',
      done: 'Done: your data is now at the new address. You can close this tab.', go: 'Go to the new address',
      blocked: 'That didn’t work: the browser blocked the new tab.',
      timeout: 'That didn’t work: the new tab didn’t answer.',
      quota: 'That didn’t work: there isn’t enough storage space at the new address.',
      fail: 'That didn’t work: the data couldn’t be stored at the new address.',
      retry: 'Try again', file: 'Save as a file',
      fileHow: 'At the new address, load the file under Statistics with “Import data”.',
      saved: 'File saved.',
      already: 'Your data is already at the new address.', again: 'Take it along again',
      accH: 'Your account', accNote: 'If you aren’t signed in at the new address yet, sign in there with this username and key.',
      lblName: 'Username', lblKey: 'Key', copy: 'Copy', copied: 'Copied', show: 'Show', hide: 'Hide',
      copiedName: 'Username copied.', copiedKey: 'Key copied.',
      copyFail: 'Copying didn’t work. Show the key and write it down instead.',
    },
    zh: {
      brand: '心算', moved: '心算已迁移到',
      lede: '账户、个人资料和排行榜在那里都保持不变。今后请使用新地址，也记得更新你的书签。',
      here: '这台设备上',
      rounds: n => `${n} 轮`, duels: n => `${n} 场对决`, balls: n => `${n} 场数学足球`,
      list: p => p.join('、') + '。',
      signed: n => `已登录：${n}。`,
      take: '带上我的数据', skip: '不带数据继续', busy: '正在转移……',
      how: s => `将在新标签页打开新地址，并把所有数据${s ? '（包括登录状态）' : ''}带过去。这里会保留一份副本。`,
      wait: '新标签页正在接收你的数据。',
      done: '完成：你的数据已在新地址上。可以关闭这个标签页了。', go: '前往新地址',
      blocked: '没有成功：浏览器拦截了新标签页。',
      timeout: '没有成功：新标签页没有响应。',
      quota: '没有成功：新地址上的存储空间不够。',
      fail: '没有成功：数据无法保存到新地址。',
      retry: '重试', file: '保存为文件',
      fileHow: '在新地址的“统计”中用“导入数据”读入这个文件。',
      saved: '文件已保存。',
      already: '你的数据已经在新地址上了。', again: '再转移一次',
      accH: '你的账户', accNote: '如果你在新地址上还没有登录，请用这个用户名和密钥登录。',
      lblName: '用户名', lblKey: '密钥', copy: '复制', copied: '已复制', show: '显示', hide: '隐藏',
      copiedName: '用户名已复制。', copiedKey: '密钥已复制。',
      copyFail: '复制失败。请显示密钥后手动抄下来。',
    },
  };
  let lang = get('kr.lang', null);
  if (!T[lang]) { const nl = (navigator.language || 'en').toLowerCase(); lang = nl.startsWith('de') ? 'de' : nl.startsWith('zh') ? 'zh' : 'en'; }
  const t = (k, ...a) => { const v = T[lang][k]; return typeof v === 'function' ? v(...a) : v; };
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  const th = get('kr.theme', null);
  if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;

  const rounds = arr(get('kr.rounds', [])), duels = arr(get('kr.duels', [])), balls = arr(get('kr.balls', []));
  const acct = get('kr.acct', null), signed = !!(acct && acct.uid && acct.rt);
  const total = rounds.length + duels.length + balls.length;
  const newUrl = () => NEW + '/' + location.hash;
  const mv = get('kr.moved', null);
  const wasMoved = !!(mv && typeof mv === 'object' && total <= (mv.n || 0) && (!signed || mv.u === acct.uid));
  const canKey = signed && typeof acct.name === 'string' && acct.name && typeof acct.key === 'string' && acct.key.length >= 16;
  const fmtKey = k => String(k).replace(/(.{4})(?=.)/g, '$1-');

  /* every kr.* key as stored (strings), except the note that the move is done */
  function payload() {
    const ls = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('kr.') && k !== 'kr.moved') ls[k] = localStorage.getItem(k);
    }
    return ls;
  }

  // none = nothing here to move, moved = moved on an earlier visit; then ask, busy, done, fail, saved
  let state = !total && !signed ? 'none' : wasMoved ? 'moved' : 'ask', why = '', win = null, timer = 0, keyShown = false, focusNext = null;
  function render() {
    document.title = t('brand');
    $('brand').textContent = t('brand');
    $('moved').textContent = t('moved');
    $('lede').textContent = t('lede');
    const goLink = `<a class="btn primary" id="go" href="${esc(newUrl())}">${esc(t('go'))}</a>`;
    $('topActs').hidden = state !== 'none';
    $('topActs').innerHTML = state === 'none' ? goLink : '';
    $('box').hidden = state === 'none';
    if (state !== 'none') {
      $('boxH').textContent = t('here');
      const parts = [];
      if (rounds.length) parts.push(t('rounds', rounds.length));
      if (duels.length) parts.push(t('duels', duels.length));
      if (balls.length) parts.push(t('balls', balls.length));
      $('sum').textContent = [parts.length ? t('list', parts) : '', signed ? t('signed', acct.name) : ''].filter(Boolean).join(lang === 'zh' ? '' : ' ');
      const B = (id, label, cls) => `<button class="btn${cls ? ' ' + cls : ''}" id="${id}" type="button"${state === 'busy' && id === 'take' ? ' disabled' : ''}>${esc(label)}</button>`;
      let h;
      if (state === 'ask' || state === 'busy') h = B('take', state === 'busy' ? t('busy') : t('take'), 'primary') + B('skip', t('skip'));
      else if (state === 'moved') h = goLink + B('take', t('again'));
      else if (state === 'done') h = goLink;
      else h = B('take', t('retry'), 'primary') + B('file', t('file')) + B('skip', t('skip'));
      $('acts').innerHTML = h;
      const msg = $('msg');
      msg.className = 'msg' + (state === 'done' || state === 'saved' || state === 'moved' ? ' ok' : state === 'fail' ? ' bad' : '');
      msg.textContent = { busy: t('wait'), done: t('done'), moved: t('already'), fail: why ? t(why) : '', saved: t('saved') }[state] || '';
      $('how').hidden = state === 'done';
      $('how').textContent = state === 'fail' || state === 'saved' ? t('fileHow') : t('how', signed);
    }
    $('acc').hidden = !canKey;
    if (canKey) {
      $('accH').textContent = t('accH');
      $('accNote').textContent = t('accNote');
      $('lblName').textContent = t('lblName');
      $('lblKey').textContent = t('lblKey');
      $('valName').textContent = acct.name;
      $('valKey').textContent = keyShown ? fmtKey(acct.key) : '••••-••••-••••-••••';
      $('valKey').classList.toggle('masked', !keyShown);
      $('shKey').textContent = keyShown ? t('hide') : t('show');
      $('shKey').setAttribute('aria-pressed', String(keyShown));
      for (const id of ['cpName', 'cpKey']) { const b = $(id); if (!b.classList.contains('ok')) b.textContent = t('copy'); }
    }
    const on = (id, fn) => { const b = $(id); if (b) b.addEventListener('click', fn); };
    on('take', start); on('skip', () => location.assign(newUrl())); on('file', saveFile);
    if (focusNext) { const f = $(focusNext); focusNext = null; if (f) f.focus(); }
  }
  function fail(code) { clearTimeout(timer); state = 'fail'; why = code; focusNext = 'take'; render(); }
  function start() {
    if (state === 'busy') return;
    win = window.open(NEW + '/?move=1' + location.hash, '_blank');   // must stay in the click: a pop-up blocker allows only that
    if (!win) { fail('blocked'); return; }
    state = 'busy'; render();
    clearTimeout(timer);
    timer = setTimeout(() => { if (state === 'busy') fail('timeout'); }, window.__KR_MOVE_TIMEOUT || 20000);
  }
  window.addEventListener('message', e => {
    const m = e.data;
    if (e.origin !== NEW || !win || e.source !== win || !m || m.v !== 1) return;
    if (m.t === 'kr-move-hello' && state === 'busy') {
      try { win.postMessage({ t: 'kr-move', v: 1, ls: payload() }, NEW); } catch (er) { fail('fail'); }
    } else if (m.t === 'kr-move-done' && (state === 'busy' || state === 'fail')) {
      clearTimeout(timer);
      if (m.ok) {
        try { localStorage.setItem('kr.moved', JSON.stringify({ n: total, u: signed ? acct.uid : null })); } catch (er) { /* asked again next time */ }
        state = 'done'; focusNext = 'go'; render();
      } else fail(m.code === 'quota' ? 'quota' : 'fail');
    }
  });
  /* the export format of the game itself, so "Import data" at the new address reads it */
  function saveFile() {
    const blob = new Blob([JSON.stringify({ app: 'kopfrechnen', format: 2, version: '1.44', exportedAt: new Date().toISOString(), rounds, duels, balls })], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `kopfrechnen-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    state = 'saved'; focusNext = 'take'; render();
  }
  /* copying: the Clipboard API, else the old select-and-copy way; the button says "Kopiert" for 2 s */
  async function copyText(text) {
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) { /* try the old way */ }
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }
  const btnTimers = {};
  function copied(id, ok, what) {
    const b = $(id), m = $('accMsg');
    clearTimeout(btnTimers[id]);
    if (ok) {
      b.classList.add('ok'); b.textContent = t('copied');
      m.className = 'msg sr-only'; m.textContent = t(what);
      btnTimers[id] = setTimeout(() => { b.classList.remove('ok'); b.textContent = t('copy'); }, 2000);
    } else { m.className = 'msg bad'; m.textContent = t('copyFail'); }
  }
  if (canKey) {
    $('cpName').addEventListener('click', async () => copied('cpName', await copyText(acct.name), 'copiedName'));
    $('cpKey').addEventListener('click', async () => copied('cpKey', await copyText(fmtKey(acct.key)), 'copiedKey'));
    $('shKey').addEventListener('click', () => { keyShown = !keyShown; render(); });
  }
  render();
})();
</script>
</body>
</html>
