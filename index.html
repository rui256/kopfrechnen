  const F = Object.assign({ player: '*', period: '30', from: '', to: '', mode: '*', level: '*', input: '*' }, LS.get('kr.filters', {}));
  const saveF = () => LS.set('kr.filters', F);
  const ts = r => new Date(r.startedAt).getTime();
  const tsD = d => new Date(d.at).getTime();
  function ioMsg(kind, text) { const m = $('#ioMsg'); m.className = 'msg ' + (kind || ''); m.textContent = text || ''; }

  function bounds() {
    if (F.period === 'all') return [null, null];
    if (F.period === 'custom') {
      return [F.from ? new Date(F.from + 'T00:00:00').getTime() : null, F.to ? new Date(F.to + 'T23:59:59.999').getTime() : null];
    }
    return [Date.now() - (+F.period || 30) * 86400000, null];
  }
  const inWin = (x, [a, b]) => (a == null || x >= a) && (b == null || x <= b);

  async function openStats() {
    show('stats');
    ioMsg();
    $('#filters').innerHTML = '';
    $('#statsBody').innerHTML = `<p class="note">${esc(t('loading'))}</p>`;
    try { statsCache = await Store.list(); }
    catch (e) { $('#statsBody').innerHTML = `<p class="msg bad">${esc(t('loadFail'))}</p>`; return; }
    if (document.body.dataset.screen === 'stats') renderStats();
  }

  function renderStats() { renderFilters(); renderStatsBody(); }

  const optHtml = (v, label, cur) => `<option value="${esc(v)}"${String(cur) === String(v) ? ' selected' : ''}>${esc(label)}</option>`;

  function allPlayers() {
    const names = new Set((statsCache || []).map(r => r.player).filter(Boolean));
    for (const d of Duels.list()) if (d.me && d.me.name) names.add(d.me.name);
    return [...names].sort((a, b) => a.localeCompare(b, LOCALE[lang]));
  }

  function renderFilters() {
    const rounds = statsCache || [];
    const el = $('#filters');
    const players = allPlayers();
    if (F.player !== '*' && !players.includes(F.player)) F.player = '*';
    if (!rounds.length && !Duels.list().length) { el.innerHTML = ''; return; }
    const sel = (id, label, options) => `<div class="field"><label for="${id}">${esc(label)}</label><select id="${id}">${options}</select></div>`;
    let h = sel('fPlayer', t('player'), optHtml('*', t('all'), F.player) + players.map(p => optHtml(p, p, F.player)).join(''));
    h += sel('fPeriod', t('period'), ['7', '30', '365', 'all', 'custom'].map(p => optHtml(p, t('p' + p), F.period)).join(''));
    if (F.period === 'custom') {
      h += `<div class="field"><label for="fFrom">${esc(t('from'))}</label><input type="date" id="fFrom" value="${esc(F.from)}"></div>`;
      h += `<div class="field"><label for="fTo">${esc(t('to'))}</label><input type="date" id="fTo" value="${esc(F.to)}"></div>`;
    }
    const modes = ['sprint', 'long', 'train'].concat(['race', 'clock'].filter(m => rounds.some(r => r.mode === m)));
    h += sel('fMode', t('mode'), optHtml('*', t('allModes'), F.mode) + modes.map(m => optHtml(m, t('modeName')[m], F.mode)).join(''));
    h += sel('fLevel', t('level'), optHtml('*', t('allLevels'), F.level) +
      Array.from({ length: Core.NLEVELS }, (_, k) => k + 1).map(i => optHtml(i, `${i}: ${t('levels')[i - 1]}`, F.level)).join(''));
    const inputs = [...new Set(rounds.map(r => r.input || 'keyboard'))];
    if (F.input !== '*' && !inputs.includes(F.input)) F.input = '*';
    if (inputs.length > 1) {
      h += sel('fInput', t('inputLbl'), optHtml('*', t('allInputs'), F.input) +
        ['keyboard', 'touch', 'voice'].filter(i => inputs.includes(i)).map(i => optHtml(i, t('inputName')[i], F.input)).join(''));
    }
    el.innerHTML = h;
    const bind = (id, key, rebuild) => {
      const x = $('#' + id);
      if (!x) return;
      x.addEventListener('change', () => {
        F[key] = x.value; saveF();
        if (rebuild) { renderFilters(); const y = $('#' + id); if (y) y.focus(); }
        renderStatsBody();
      });
    };
    bind('fPlayer', 'player'); bind('fPeriod', 'period', true); bind('fFrom', 'from'); bind('fTo', 'to');
    bind('fMode', 'mode'); bind('fLevel', 'level'); bind('fInput', 'input');
  }

  function ratingChart(win) {
    const W = 560, H = 220, L = 46, R = 14, T = 12, Bm = 30;
    const ys = win.flatMap(p => [p.rating, p.perf]);
    let lo = Math.floor(Math.min(...ys) / 100) * 100, hi = Math.ceil(Math.max(...ys) / 100) * 100;
    if (hi - lo < 200) { const m = (hi + lo) / 2; lo = Math.floor((m - 100) / 100) * 100; hi = lo + 200; }
    const step = hi - lo > 1200 ? 400 : hi - lo > 600 ? 200 : 100;
    const X = i => L + (W - L - R) * (win.length === 1 ? 0.5 : i / (win.length - 1));
    const Y = v => T + (H - T - Bm) * (1 - (v - lo) / (hi - lo));
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('ratingTitle'))}">`;
    for (let v = lo; v <= hi; v += step) {
      s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"></line>` +
        `<text x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`;
    }
    s += win.map((p, i) => `<circle class="pdot" cx="${X(i).toFixed(1)}" cy="${Y(p.perf).toFixed(1)}" r="3"></circle>`).join('');
    s += `<path class="rline" d="${win.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.rating).toFixed(1)).join(' ')}"></path>`;
    const last = win.length - 1;
    s += `<circle class="rdot" cx="${X(last).toFixed(1)}" cy="${Y(win[last].rating).toFixed(1)}" r="4.5"></circle>`;
    s += `<text x="${L}" y="${H - 8}">${esc(fmtDay(win[0].r.startedAt))}</text>` +
      `<text x="${W - R}" y="${H - 8}" text-anchor="end">${esc(fmtDay(win[last].r.startedAt))}</text>`;
    return s + '</svg>';
  }

  function ratingHtml(all, B, byInput) {
    const [a, b] = B;
    const refList = Core.RATING.ref.map((v, i) => `${i + 1}: ${dec(v)}`).join(SEP());
    const howTo = `<details class="how"><summary>${esc(t('ratingHow'))}</summary>${t('ratingExplain', refList).map(p => `<p>${esc(p)}</p>`).join('')}</details>`;
    let h = '<div class="sheet"><section>';
    if (F.player !== '*') {
      h += `<h3>${esc(t('ratingTitle'))}</h3>`;
      const series = Core.ratingSeries(all.filter(r => r.player === F.player && byInput(r)));
      const upto = series.filter(p => b == null || ts(p.r) <= b);
      if (!upto.length) {
        h += `<p class="note">${esc(t('ratingNone'))}</p>`;
      } else {
        const cur = upto[upto.length - 1].rating;
        const prior = series.filter(p => a != null && ts(p.r) < a);
        const win = upto.filter(p => a == null || ts(p.r) >= a);
        const ref = prior.length ? prior[prior.length - 1].rating : (win.length ? win[0].rating : cur);
        const peak = Math.max(...upto.map(p => p.rating));
        h += kvHtml([[t('ratingNow'), Math.round(cur)], [t('ratingChange'), signed(Math.round(cur) - Math.round(ref))],
          [t('ratingPeak'), Math.round(peak)], [t('ratingRuns'), upto.length]]);
        if (win.length >= 2) h += ratingChart(win) + `<p class="note">${esc(t('ratingLegend'))}</p>`;
      }
    } else {
      h += `<h3>${esc(t('board'))}</h3>`;
      const players = [...new Set(all.map(r => r.player).filter(Boolean))];
      const rows = players.map(p => {
        const ser = Core.ratingSeries(all.filter(r => r.player === p && byInput(r))).filter(x => b == null || ts(x.r) <= b);
        if (!ser.length) return null;
        return { p, cur: ser[ser.length - 1].rating, n: ser.length, peak: Math.max(...ser.map(x => x.rating)) };
      }).filter(Boolean).sort((x, y) => y.cur - x.cur);
      if (!rows.length) h += `<p class="note">${esc(t('ratingNone'))}</p>`;
      else h += `<div class="scroll"><table><thead><tr><th>${esc(t('rank'))}</th><th>${esc(t('player'))}</th>` +
        `<th class="n">${esc(t('ratingTitle'))}</th><th class="n">${esc(t('ratingPeak'))}</th><th class="n">${esc(t('ratingRuns'))}</th></tr></thead><tbody>` +
        rows.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.p)}</td><td class="n"><b>${Math.round(x.cur)}</b></td>` +
          `<td class="n">${Math.round(x.peak)}</td><td class="n">${x.n}</td></tr>`).join('') + '</tbody></table></div>';
    }
    return h + howTo + '</section></div>';
  }

  function heatHtml(rounds) {
    const cell = {};
    for (const r of rounds) for (const it of r.items || []) {
      if (it.o !== 'mul' || it.s) continue;
      const m = /^(\d+) × (\d+)$/.exec(it.q);
      if (!m) continue;
      const x = +m[1], y = +m[2];
      if (x < 2 || x > 10 || y < 2 || y > 10) continue;
      const k = Math.min(x, y) + 'x' + Math.max(x, y);
      (cell[k] || (cell[k] = [])).push(it.t);
    }
    const avg = {};
    for (const k in cell) avg[k] = cell[k].reduce((p, q) => p + q, 0) / cell[k].length;
    const vals = Object.values(avg);
    if (vals.length < 8) return '';
    const sorted = vals.slice().sort(byNum);
    const rankOf = v => (sorted.length > 1 ? sorted.indexOf(v) / (sorted.length - 1) : 0);
    let g = '<div class="heat" role="table"><div class="h">×</div>';
    for (let c = 2; c <= 10; c++) g += `<div class="h">${c}</div>`;
    for (let rr = 2; rr <= 10; rr++) {
      g += `<div class="h">${rr}</div>`;
      for (let c = 2; c <= 10; c++) {
        const k = Math.min(rr, c) + 'x' + Math.max(rr, c);
        if (avg[k] == null) { g += '<div class="e"></div>'; continue; }
        const f = rankOf(avg[k]);
        const bg = f < 0.5
          ? `color-mix(in srgb, var(--good) ${Math.round(8 + (0.5 - f) * 2 * 50)}%, var(--surface))`
          : `color-mix(in srgb, var(--red) ${Math.round(8 + (f - 0.5) * 2 * 55)}%, var(--surface))`;
        g += `<div style="background:${bg}" title="${rr} × ${c}: ${esc(fmtS(avg[k]))}">${esc(dec((avg[k] / 1000).toFixed(1)))}</div>`;
      }
    }
    return `<section><h3>${esc(withUnit(t('heat')))}</h3>${g}</div><p class="note">${esc(t('heatNote'))}</p></section>`;
  }

  function steadyHtml(sel, times) {
    const end = endPhase(sel);
    const q1 = times.length >= 4 ? quant(times, 0.25) : null, q3 = times.length >= 4 ? quant(times, 0.75) : null;
    if (q1 == null && !end) return '';
    return `<section><h3>${esc(t('steadyTitle'))}</h3>` +
      kvHtml([[t('spread'), fmtRange(q1, q3)], [t('fatigue'), endText(end)]]) +
      `<p class="note">${esc(t('spreadNote'))}</p><p class="note">${esc(t('fatNote'))}</p></section>`;
  }

  const outcomeWord = o => (o === 1 ? t('resWin') : o === 0 ? t('resLoss') : t('resDraw'));
  const duelScoreText = d => (d.format === 'race' || d.format === 'clock'
    ? `${d.me.finished ? fmtClock(d.me.time) : t(d.format === 'clock' ? 'flagged' : 'notFinished')} : ${d.opp.finished ? fmtClock(d.opp.time) : t(d.format === 'clock' ? 'flagged' : 'notFinished')}`
    : `${d.me.score} : ${d.opp.score}`);

  function duelStatsHtml(B) {
    const all = Duels.list();
    if (!all.length) return '';
    const [a, b] = B;
    const howTo = `<details class="how"><summary>${esc(t('duelHow'))}</summary>${t('duelExplain').map(p => `<p>${esc(p)}</p>`).join('')}</details>`;
    const wdl = list => t('recordVal', list.filter(x => x.d.outcome === 1).length, list.filter(x => x.d.outcome === 0.5).length, list.filter(x => x.d.outcome === 0).length);
    let h = `<div class="sheet"><section><h3>${esc(t('duelsTitle'))}</h3>`;
    if (F.player !== '*') {
      const ser = Core.duelSeries(all, F.player);
      if (!ser.length) return '';
      const upto = ser.filter(x => b == null || tsD(x.d) <= b);
      const win = upto.filter(x => a == null || tsD(x.d) >= a);
      const cur = upto.length ? upto[upto.length - 1].rating : 1000;
      h += kvHtml([[t('duelRating'), Math.round(cur)], [t('record'), wdl(win)], [t('nDuels'), win.length]]);
      if (win.length) {
        h += `<div class="scroll"><table><thead><tr><th>${esc(t('date'))}</th><th>${esc(t('opponent'))}</th><th>${esc(t('format'))}</th>` +
          `<th>${esc(t('result'))}</th><th class="n">${esc(t('score'))}</th><th class="n">${esc(t('duelRating'))}</th></tr></thead><tbody>` +
          win.slice().reverse().slice(0, 30).map(x => `<tr><td>${esc(fmtDate(x.d.at))}</td><td>${esc(x.d.opp.name)}</td>` +
            `<td>${esc(t('modeName')[x.d.format === 'race' ? 'race' : x.d.format === 'clock' ? 'clock' : 'sprint'])}</td><td>${esc(outcomeWord(x.d.outcome))}</td>` +
            `<td class="n">${esc(duelScoreText(x.d))}</td><td class="n">${Math.round(x.rating)}</td></tr>`).join('') + '</tbody></table></div>';
      }
    } else {
      const names = [...new Set(all.map(d => d.me && d.me.name).filter(Boolean))];
      const rows = names.map(n => {
        const s = Core.duelSeries(all, n).filter(x => b == null || tsD(x.d) <= b);
        return s.length ? { n, r: s[s.length - 1].rating, s } : null;
      }).filter(Boolean).sort((x, y) => y.r - x.r);
      if (!rows.length) return '';
      h += `<div class="scroll"><table><thead><tr><th>${esc(t('rank'))}</th><th>${esc(t('player'))}</th><th class="n">${esc(t('duelRating'))}</th>` +
        `<th>${esc(t('record'))}</th><th class="n">${esc(t('nDuels'))}</th></tr></thead><tbody>` +
        rows.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.n)}</td><td class="n"><b>${Math.round(x.r)}</b></td>` +
          `<td>${esc(wdl(x.s))}</td><td class="n">${x.s.length}</td></tr>`).join('') + '</tbody></table></div>';
    }
    return h + howTo + '</section></div>';
  }

  function renderStatsBody() {
    const body = $('#statsBody');
    const all = statsCache || [];
    let html = `<p class="note">${esc(Store.kind === 'db' ? t('storeDb') : t('storeLocal'))}</p>`;
    if (!all.length && !Duels.list().length) { body.innerHTML = html + `<p class="empty">${esc(t('empty'))}</p>`; return; }
    const B = bounds();
    const byInput = r => F.input === '*' || (r.input || 'keyboard') === F.input;
    const sel = all.filter(r => (F.player === '*' || r.player === F.player) && byInput(r) && inWin(ts(r), B) &&
      (F.mode === '*' || r.mode === F.mode) && (F.level === '*' || r.level === +F.level));

    html += ratingHtml(all, B, byInput);
    html += duelStatsHtml(B);

    if (!sel.length) { body.innerHTML = html + `<p class="empty">${esc(t('noMatch'))}</p>`; return; }

    const solved = sel.flatMap(r => (r.items || []).filter(i => !i.s));
    const times = solved.map(i => i.t).sort(byNum);
    const thinks = solved.filter(i => Number.isFinite(i.f)).map(i => i.f).sort(byNum);
    const withC = solved.filter(i => Number.isFinite(i.c));
    const skipSum = sel.reduce((p, r) => p + (r.skipped || 0), 0);
    const playMs = sel.reduce((p, r) => p + (r.durationMs || 0), 0);
    html += `<h2>${esc(t('overview'))}</h2>` + kvHtml([
      [t('nRounds'), sel.length], [t('nSolved'), solved.length], [t('playTime'), fmtDur(playMs)],
      [t('medianTask'), fmtS(quant(times, 0.5))], [t('think'), thinks.length ? fmtS(quant(thinks, 0.5)) : '–'],
      [t('clean'), withC.length ? pct(withC.filter(i => i.c === 0).length / withC.length) : '–'], [t('skipped'), skipSum]]);

    html += '<div class="sheet">';
    const sprints = sel.filter(Core.rated);
    if (sprints.length) {
      const lv = {};
      for (const r of sprints) { const k = r.level + (r.mode === 'long' ? 'L' : ''); (lv[k] || (lv[k] = [])).push(r); }
      const mean = v => dec((v.reduce((p, q) => p + q, 0) / v.length).toFixed(1));
      html += `<section><h3>${esc(t('byLevel'))}</h3><div class="scroll"><table><thead><tr><th>${esc(t('level'))}</th>` +
        `<th class="n">${esc(t('runs'))}</th><th class="n">${esc(t('best'))}</th><th class="n">${esc(t('avgScore'))}</th>` +
        `<th class="n">${esc(t('last5'))}</th></tr></thead><tbody>` +
        Object.keys(lv).sort((x, y) => parseInt(x, 10) - parseInt(y, 10) || x.length - y.length).map(k => {
          const sc = lv[k].slice().sort((x, y) => ts(y) - ts(x)).map(r => r.score);
          const lvl = parseInt(k, 10);
          return `<tr><td>${lvl}: ${esc(t('levels')[lvl - 1])}${k.endsWith('L') ? ' (' + esc(t('modeName').long) + ')' : ''}</td><td class="n">${sc.length}</td><td class="n"><b>${Math.max(...sc)}</b></td>` +
            `<td class="n">${mean(sc)}</td><td class="n">${mean(sc.slice(0, 5))}</td></tr>`;
        }).join('') + '</tbody></table></div></section>';
    }
    if (times.length) html += `<section><h3>${esc(withUnit(t('hist')))}</h3>${histSvg(times)}</section>`;
    html += steadyHtml(sel, times);
    html += opsTableHtml(sel.flatMap(r => r.items || []));
    if (withC.length) html += nearTableHtml(sel);
    html += heatHtml(sel);
    html += '</div>';

    const shown = sel.slice(0, 100);
    html += `<h2>${esc(t('roundsList'))}</h2><div class="sheet"><div class="scroll"><table><thead><tr><th>${esc(t('date'))}</th>` +
      `<th>${esc(t('player'))}</th><th>${esc(t('mode'))}</th><th class="n">${esc(t('level'))}</th>` +
      `<th class="n">${esc(t('score'))}</th><th class="n">${esc(t('median'))}</th><th class="n">${esc(t('perf'))}</th></tr></thead><tbody>` +
      shown.map(r => `<tr><td><button class="rowbtn" type="button" data-id="${esc(r.id)}">${esc(fmtDate(r.startedAt))}</button></td>` +
        `<td>${esc(r.player)}</td><td>${esc((t('modeName')[r.mode] || r.mode) + (r.duel ? SEP() + t('duelTag') : ''))}</td><td class="n">${r.level}</td>` +
        `<td class="n">${r.score}</td><td class="n">${fmtS(analyze(r).median)}</td>` +
        `<td class="n">${Core.rated(r) ? Math.round(Core.roundPerf(r)) : '–'}</td></tr>`).join('') +
      '</tbody></table></div>' + (sel.length > shown.length ? `<p class="more">${esc(t('more', shown.length))}</p>` : '') + '</div>';

    body.innerHTML = html;
    body.querySelectorAll('.rowbtn').forEach(btn => btn.addEventListener('click', () => {
      const r = all.find(x => x.id === btn.dataset.id);
      if (r) showResults(r, true);
    }));
  }

  /* ----- export / import ----- */
  const num = (v, d = 0) => (Number.isFinite(+v) ? +v : d);
  const ID_RE = /^[A-Za-z0-9_-]{1,80}$/;
  function cleanRound(r) {
    if (!r || typeof r.id !== 'string' || !ID_RE.test(r.id)) return null;
    if (typeof r.startedAt !== 'string' || isNaN(Date.parse(r.startedAt))) return null;
    if (!['sprint', 'long', 'train', 'race', 'clock'].includes(r.mode)) return null;
    const level = +r.level;
    if (!Number.isInteger(level) || level < 1 || level > Core.NLEVELS || !Array.isArray(r.items)) return null;
    const out = {
      id: r.id, v: num(r.v, 1), player: clip(r.player), mode: r.mode, level,
      input: ['keyboard', 'touch', 'voice'].includes(r.input) ? r.input : 'keyboard',
      lang: ['de', 'en', 'zh'].includes(r.lang) ? r.lang : 'en', seed: num(r.seed),
      startedAt: new Date(r.startedAt).toISOString(), durationMs: num(r.durationMs, 60000),
      score: num(r.score), skipped: num(r.skipped),
      items: r.items.filter(i => i && typeof i === 'object').map(i => {
        const it = { q: String(i.q || '').slice(0, 80), a: String(i.a || '').slice(0, 40), o: String(i.o || '').slice(0, 10), t: num(i.t), s: i.s ? 1 : 0 };
        if (Number.isFinite(+i.f) && i.f !== null) it.f = +i.f;
        if (Number.isFinite(+i.c) && i.c !== null) it.c = +i.c;
        if (Number.isFinite(+i.w) && i.w !== null && i.c == null) it.w = +i.w;
        if (['k', 'p', 'v'].includes(i.m)) it.m = i.m;
        if (Number.isFinite(+i.g) && i.g !== null) it.g = +i.g;
        if (Number.isFinite(+i.e) && +i.e > 0) it.e = +i.e;
        if (Array.isArray(i.nm) && Number.isFinite(+i.av)) { it.nm = i.nm.map(Number).filter(Number.isFinite).slice(0, 3); it.av = +i.av; }
        return it;
      }),
    };
    if (r.target) out.target = num(r.target);
    if (num(r.ts) > 0) out.ts = num(r.ts);
    if (num(r.guessPen) > 0) out.guessPen = num(r.guessPen);
    if (num(r.skipPen) > 0) out.skipPen = num(r.skipPen);
    if (r.open && typeof r.open === 'object') {
      out.open = { q: String(r.open.q || '').slice(0, 80), a: String(r.open.a || '').slice(0, 40), o: String(r.open.o || '').slice(0, 10), t: num(r.open.t) };
      if (Number.isFinite(+r.open.c)) out.open.c = +r.open.c;
      if (Number.isFinite(+r.open.f)) out.open.f = +r.open.f;
      if (typeof r.open.last === 'string') out.open.last = r.open.last.slice(0, 30);
      if (Array.isArray(r.open.nm)) out.open.nm = r.open.nm.map(Number).filter(Number.isFinite).slice(0, 3);
    }
    if (typeof r.duel === 'string' && ID_RE.test(r.duel)) out.duel = r.duel;
    return out;
  }
  function cleanDuel(d) {
    if (!d || typeof d.id !== 'string' || !ID_RE.test(d.id) || typeof d.at !== 'string' || isNaN(Date.parse(d.at))) return null;
    if (!d.me || !d.opp || ![0, 0.5, 1].includes(d.outcome)) return null;
    const side = s => ({ name: clip(s.name), level: Math.min(Core.NLEVELS, Math.max(1, num(s.level, 1))), score: num(s.score), time: num(s.time),
      perf: s.perf == null ? null : num(s.perf), finished: !!s.finished, rating: num(s.rating, 1000) });
    return { id: d.id, at: new Date(d.at).toISOString(), format: ['race', 'clock'].includes(d.format) ? d.format : 'time', levels: d.levels === 'own' ? 'own' : 'same',
      me: side(d.me), opp: side(d.opp), outcome: d.outcome };
  }

  $('#exportBtn').addEventListener('click', async () => {
    try {
      const rounds = await Store.list();
      const duels = Duels.list();
      const blob = new Blob([JSON.stringify({ app: 'kopfrechnen', format: 2, version: APP_VERSION, exportedAt: new Date().toISOString(), rounds, duels })],
        { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `kopfrechnen-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      ioMsg('ok', t('exported', rounds.length + duels.length));
    } catch (e) { ioMsg('bad', t('loadFail')); }
  });
  $('#importBtn').addEventListener('click', () => $('#importIn').click());
  $('#importIn').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const list = Array.isArray(data) ? data : data && Array.isArray(data.rounds) ? data.rounds : [];
      const rounds = list.map(cleanRound).filter(Boolean);
      const duels = (data && Array.isArray(data.duels) ? data.duels : []).map(cleanDuel).filter(Boolean);
      if (!rounds.length && !duels.length) { ioMsg('bad', t('importFail')); return; }
      const r1 = rounds.length ? await Store.importMany(rounds) : { added: 0, dup: 0 };
      const r2 = duels.length ? Duels.importMany(duels) : { added: 0, dup: 0 };
      statsCache = await Store.list();
      renderStats();
      ioMsg('ok', t('imported', r1.added + r2.added, r1.dup + r2.dup));
    } catch (err) {
      ioMsg('bad', err && err.code === 'quota_exceeded' ? t('quota') : t('importFail'));
    }
  });
  /* ----- duels: encrypted messages through two public MQTT brokers -----
     Both players only open outgoing WebSocket connections, so this works in almost every network.
     Every message is encrypted with AES-GCM; key and topic are derived from the duel code, so the
     broker and anyone listening there see neither the code nor the content. Each message goes to
     both brokers; duplicates are dropped by sender and sequence number. */
  const MQTT_URL = 'https://cdn.jsdelivr.net/npm/mqtt@5.16.0/dist/mqtt.min.js';
  const MQTT_SRI = 'sha384-9WWboT9UtuPFRlOLq4FygQkcJxzYcpz8SXGkNyCEXM+44n14xzjNlrRKYZwuF/A6';
  /* Two brokers on port 443 (allowed in strict networks such as universities) and two on other ports. */
  const BROKERS = (window.__KR_BROKERS || [
    { url: 'wss://mqtt.eclipseprojects.io:443/mqtt' },
    { url: 'wss://public.cloud.shiftr.io', username: 'public', password: 'public' },
    'wss://broker.emqx.io:8084/mqtt',
    'wss://broker.hivemq.com:8884/mqtt',
  ]).map(b => (typeof b === 'string' ? { url: b } : b));
  const CODE_ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const DF = Object.assign({ format: 'time', levels: 'same', level: S.level, clockEnd: 'flag' }, LS.get('kr.duelCfg', {}));
  const saveDF = () => LS.set('kr.duelCfg', { format: DF.format, levels: DF.levels, level: DF.level, clockEnd: DF.clockEnd });
  let D = null;

  function newD() {
    return { st: 'menu', role: null, link: null, partner: null, code: '', cfg: null, me: null, opp: null, connected: false,
      n: 0, myFinal: null, oppFinal: null, oppScore: 0, oppDone: false, again: { me: false, opp: false },
      msg: '', msgKind: '', last: null, myRound: null, closing: false, nameDraft: null, myLevel: S.level,
      lastHeard: 0, timers: [] };
  }
  const oppName = () => (D && D.opp && D.opp.name) || t('oppWord');
  const validLevel = l => Math.min(Core.NLEVELS, Math.max(1, parseInt(l, 10) || 1));
  const linked = () => !!(D && D.link && D.partner && D.connected);

  function loadMqtt() {
    if (window.mqtt) return Promise.resolve();
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = MQTT_URL; s.integrity = MQTT_SRI; s.crossOrigin = 'anonymous';
      s.onload = () => (window.mqtt ? res() : rej(new Error('nolib')));
      s.onerror = () => rej(new Error('nolib'));
      document.head.appendChild(s);
    });
  }
  const enc = new TextEncoder(), decd = new TextDecoder();
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const hex = buf => Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
  async function duelKeys(code) {
    const kd = await crypto.subtle.digest('SHA-256', enc.encode('kopfrechnen-duel-key:' + code));
    const td = await crypto.subtle.digest('SHA-256', enc.encode('kopfrechnen-duel-topic:' + code));
    return { key: await crypto.subtle.importKey('raw', kd, 'AES-GCM', false, ['encrypt', 'decrypt']), topic: 'kopfrechnen/v2/' + hex(td).slice(0, 24) };
  }
  async function seal(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));
    return JSON.stringify({ iv: b64(iv), ct: b64(ct) });
  }
  async function unseal(key, text) {
    try {
      const o = JSON.parse(text);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(o.iv) }, key, unb64(o.ct));
      const m = JSON.parse(decd.decode(pt));
      return m && typeof m === 'object' ? m : null;
    } catch (e) { return null; }
  }

  /* One link = this device's connection to the duel topic on all brokers. Resolves once at least one broker is reachable. */
  async function openLink(code, onMessage, onStatus) {
    await loadMqtt();
    const { key, topic } = await duelKeys(code);
    const id = hex(crypto.getRandomValues(new Uint8Array(6)));
    const will = await seal(key, { t: 'gone', from: id, seq: 0 });
    const seen = new Set();
    const RELIABLE = new Set(['cfg', 'ready', 'start', 'final', 'again', 'quit', 'version', 'busy', 'cdone', 'cflag']);
    const pending = new Map();   // seq -> { payload, tries }: important messages until the other side confirms them
    let seq = 0, chain = Promise.resolve(), closed = false;
    const clients = BROKERS.map((b, i) => window.mqtt.connect(b.url, Object.assign({
      clientId: 'kr_' + id + '_' + i, clean: true, keepalive: 20, reconnectPeriod: 3000, connectTimeout: 8000,
      will: { topic, payload: will, qos: 1, retain: false },
    }, b.username ? { username: b.username, password: b.password } : {})));
    const report = () => { if (!closed && onStatus) onStatus(clients.filter(c => c.connected).length, clients.length); };
    function publishAll(payload) { for (const c of clients) if (c.connected) c.publish(topic, payload, { qos: 1 }); }
    const resendTimer = setInterval(() => {
      for (const [s, p] of pending) { if (++p.tries > 40) pending.delete(s); else publishAll(p.payload); }
    }, 1500);
    const link = {
      id,
      send(obj) {
        if (closed) return;
        chain = chain.then(async () => {
          const s = ++seq;
          const payload = await seal(key, Object.assign({}, obj, { from: id, seq: s }));
          if (RELIABLE.has(obj.t)) pending.set(s, { payload, tries: 0 });
          publishAll(payload);
        }).catch(() => {});
      },
      close() {
        if (closed) return;
        closed = true;
        clearInterval(resendTimer);
        chain.then(() => setTimeout(() => clients.forEach(c => { try { c.end(false); } catch (e) { /* ignore */ } }), 300));
      },
    };
    for (const c of clients) {
      c.on('connect', () => { c.subscribe(topic, { qos: 1 }); report(); });
      c.on('close', report);
      c.on('message', async (_t, payload) => {
        if (closed) return;
        const m = await unseal(key, payload.toString());
        if (!m || m.from === id || typeof m.from !== 'string') return;
        if (m.to && m.to !== id) return;
        if (m.t === 'ack') { pending.delete(m.ack); return; }
        if (RELIABLE.has(m.t)) link.send({ t: 'ack', ack: m.seq, to: m.from });   // confirm every copy, the first confirmation may get lost
        const k = m.from + ':' + m.seq;
        if (seen.has(k)) return;
        seen.add(k);
        onMessage(m);
      });
      c.on('error', () => {});
    }
    await new Promise((res, rej) => {
      let fails = 0;
      const to = setTimeout(() => rej(new Error('net')), 15000);
      for (const c of clients) {
        c.once('connect', () => { clearTimeout(to); setTimeout(res, 150); });
        c.once('error', () => { if (++fails === clients.length) { clearTimeout(to); rej(new Error('net')); } });
      }
    }).catch(err => { link.close(); throw err; });
    return link;
  }

  const randCode = () => Array.from({ length: 6 }, () => CODE_ABC[Math.floor(Math.random() * CODE_ABC.length)]).join('');
  const duelLink = code => location.origin + location.pathname + location.search + '#duel=' + code;
  function cfgText(cfg) {
    if (cfg.format === 'clock') {
      return t('fClock') + SEP() + `${t('level')} ${cfg.level}` + SEP() +
        (cfg.clockEnd === 'tasks' ? t('tasksEach', 10) : t('perPlayer', Core.clockBudget(cfg.level) / 1000));
    }
    const f = cfg.format === 'race' ? t('fRace') : t('fTime');
    const l = cfg.levels === 'same' ? `${t('level')} ${cfg.level}` : t('lOwn');
    return f + SEP() + l;
  }
  const targetFor = (level, cfg) => (cfg.format === 'race' ? Core.raceTarget(level, cfg.levels) : 0);

  function setMsg(kind, text) { if (D) { D.msg = text || ''; D.msgKind = kind || ''; } }
  function relayStatus(up, total) {
    if (!D) return;
    D.relay = [up, total];
    const el = document.getElementById('dRelay');
    if (el) el.textContent = t('relayStatus', up, total);
  }
  const relayHtml = () => (D && D.relay ? `<p class="note" id="dRelay">${esc(t('relayStatus', D.relay[0], D.relay[1]))}</p>` : '');
  function send(m) { if (D && D.link) D.link.send(D.partner && !m.to ? Object.assign({ to: D.partner }, m) : m); }
  const rawSend = m => { if (D && D.link) D.link.send(m); };
  function cleanupPeer() {
    if (!D) return;
    D.closing = true;
    D.timers.forEach(clearInterval); D.timers = [];
    if (D.link) D.link.close();
    D.link = null; D.connected = false;
  }
  function leaveDuel() {
    if (!D) return;
    if (linked()) send({ t: 'quit' });
    cleanupPeer();
    D = null;
  }
  window.addEventListener('pagehide', () => { if (linked()) send({ t: 'quit' }); });

  function openDuel(joinCode) {
    if (D) leaveDuel();
    D = newD();
    show('duel');
    if (joinCode) joinDuel(joinCode); else renderDuel();
  }

  /* Heartbeat: both sides send a ping every 3 s. The connection counts as lost after 20 s of silence,
     or 10 s after a server announced that the opponent dropped out, if nothing has arrived since.
     One server losing the opponent briefly is not enough, because the other servers or a reconnect keep it alive. */
  function startHeartbeat() {
    const d = D;
    d.lastHeard = Date.now(); d.goneAt = 0;
    d.timers.push(setInterval(() => {
      if (D !== d || !linked()) return;
      send({ t: 'ping' });
      const now = Date.now();
      if (now - d.lastHeard > 20000 || (d.goneAt && now - d.goneAt > 10000 && d.lastHeard < d.goneAt)) onLost();
    }, 3000));
  }

  function receive(m) {
    if (!D) return;
    if (D.partner && m.from !== D.partner) {
      if (D.role === 'host' && m.t === 'hello') rawSend({ t: 'busy', to: m.from });
      return;
    }
    if (m.t === 'gone') { if (D.partner && !D.goneAt) D.goneAt = Date.now(); return; }
    D.lastHeard = Date.now(); D.goneAt = 0;
    if (m.t === 'ping') return;
    onMsg(m);
  }

  async function hostDuel() {
    const name = clip(D.nameDraft ?? LS.get('kr.name', ''));
    if (!name) { setMsg('bad', t('needName')); renderDuel(); return; }
    rememberName(name);
    D.role = 'host';
    D.cfg = { format: DF.format, levels: DF.format === 'clock' ? 'same' : DF.levels, level: DF.level, clockEnd: DF.clockEnd === 'tasks' ? 'tasks' : 'flag' };
    D.me = { name, level: DF.level };
    setMsg('', t('connecting')); renderDuel();
    const d = D, code = randCode();
    try {
      const link = await openLink(code, m => { if (D === d) receive(m); }, (u, n) => { if (D === d) relayStatus(u, n); });
      if (D !== d) { link.close(); return; }
      D.link = link; D.code = code; D.st = 'hosting'; setMsg();
      renderDuel();
    } catch (err) {
      if (D === d) { setMsg('bad', err && err.message === 'nolib' ? t('noLib') : t('netFail')); renderDuel(); }
    }
  }

  async function joinDuel(code) {
    D.role = 'guest'; D.code = code; D.st = 'joining'; setMsg('', t('connecting')); renderDuel();
    const d = D;
    try {
      D.link = await openLink(code, m => { if (D === d) receive(m); }, (u, n) => { if (D === d) relayStatus(u, n); });
    } catch (err) {
      if (D === d) { cleanupPeer(); D.closing = false; D.st = 'menu'; setMsg('bad', err && err.message === 'nolib' ? t('noLib') : t('netFail')); renderDuel(); }
      return;
    }
    if (D !== d) return;
    // say hello until the host answers; no answer within 15 s means there is no open duel with this code
    const started = Date.now();
    const iv = setInterval(() => {
      if (D !== d || D.partner || !D.link) { clearInterval(iv); return; }
      if (Date.now() - started > 15000) {
        clearInterval(iv);
        cleanupPeer(); D.closing = false; D.st = 'menu'; setMsg('bad', t('notFound')); renderDuel();
        return;
      }
      rawSend({ t: 'hello', v: 2, ts: Core.TASKSET });
    }, 2000);
    rawSend({ t: 'hello', v: 2, ts: Core.TASKSET });
  }

  function onLost() {
    if (!D || D.closing) return;
    const wasPlaying = G && G.duel;
    if (wasPlaying) { stopTimers(); G = null; }
    if (D.st === 'result' || D.st === 'ended') { D.again = { me: false, opp: false }; D.connected = false; renderDuel(); return; }
    if (D.role === 'host' && D.st === 'hosting' && !wasPlaying) {
      D.timers.forEach(clearInterval); D.timers = [];
      D.partner = null; D.connected = false; D.opp = null; renderDuel(); return;
    }
    cleanupPeer();
    D.st = 'ended'; setMsg('bad', t('lost', oppName()));
    show('duel'); renderDuel();
  }

  function onMsg(m) {
    switch (m.t) {
      case 'hello':
        if (D.role !== 'host') return;
        if (num(m.ts) !== Core.TASKSET) { rawSend({ t: 'version', to: m.from }); setMsg('bad', t('versionMismatch')); renderDuel(); return; }
        if (!D.partner) { D.partner = m.from; D.connected = true; startHeartbeat(); }
        send({ t: 'cfg', v: 1, ts: Core.TASKSET, cfg: D.cfg, name: D.me.name, level: D.me.level });
        renderDuel();
        break;
      case 'cfg':
        if (D.role !== 'guest' || !m.cfg) return;
        if (num(m.ts) !== Core.TASKSET) { rawSend({ t: 'version', to: m.from }); cleanupPeer(); D.st = 'menu'; setMsg('bad', t('versionMismatch')); renderDuel(); return; }
        if (!D.partner) { D.partner = m.from; D.connected = true; startHeartbeat(); }
        D.cfg = { format: ['race', 'clock'].includes(m.cfg.format) ? m.cfg.format : 'time', levels: m.cfg.levels === 'own' && m.cfg.format !== 'clock' ? 'own' : 'same',
          level: validLevel(m.cfg.level), clockEnd: m.cfg.clockEnd === 'tasks' ? 'tasks' : 'flag' };
        D.opp = { name: clip(m.name) || '?', level: validLevel(m.level) };
        D.myLevel = D.cfg.levels === 'same' ? D.cfg.level : S.level;
        D.st = 'joining'; setMsg();
        renderDuel();
        break;
      case 'cshow': case 'ctype': case 'cskip': case 'cdone': case 'cflag':
        if (num(m.n) === D.n) clockOpp(m);
        break;
      case 'version':
        cleanupPeer(); D.st = 'ended'; setMsg('bad', t('versionMismatch')); renderDuel();
        break;
      case 'busy':
        cleanupPeer(); D.st = 'menu'; setMsg('bad', t('busy')); renderDuel();
        break;
      case 'ready':
        if (D.role !== 'host') return;
        D.opp = { name: clip(m.name) || '?', level: D.cfg.levels === 'same' ? D.cfg.level : validLevel(m.level) };
        renderDuel();
        break;
      case 'start':
        if (D.role !== 'guest') return;
        D.n = num(m.n, 1);
        playRound(num(m.seed) >>> 0);
        break;
      case 'prog':
        if (num(m.n) !== D.n) return;
        D.oppScore = num(m.score);
        Duel.hud();
        break;
      case 'final':
        if (num(m.n) !== D.n) return;
        D.oppFinal = { score: num(m.score), time: num(m.time), finished: !!m.finished, perf: m.perf == null ? null : num(m.perf),
          level: validLevel(m.level), rating: num(m.rating, 1000) };
        D.oppDone = true;
        if (G && G.duel && G.running) {
          if (D.cfg.format === 'race') finish({ finished: false });
          else if (D.cfg.format === 'clock') finish({ finished: true });   // the opponent ran out of time or both are done
          else Duel.hud();
        }
        tryConclude();
        break;
      case 'again':
        D.again.opp = true;
        if (D.role === 'host' && D.again.me) startRound(); else renderDuel();
        break;
      case 'quit': {
        if (D.st === 'result') {
          D.connected = false; D.again = { me: false, opp: false };
          setMsg('', t('oppLeft', oppName())); renderDuel();
          break;
        }
        const wasPlaying = G && G.duel;
        if (wasPlaying) { stopTimers(); G = null; }
        cleanupPeer();
        D.st = 'ended'; setMsg('bad', t('oppQuit', oppName()));
        show('duel'); renderDuel();
        break;
      }
      default:
    }
  }

  function guestReady() {
    const name = clip(D.nameDraft ?? LS.get('kr.name', ''));
    if (!name) { setMsg('bad', t('needName')); renderDuel(); return; }
    rememberName(name);
    D.me = { name, level: D.cfg.levels === 'same' ? D.cfg.level : D.myLevel };
    D.st = 'waitStart'; setMsg();
    send({ t: 'ready', name, level: D.me.level });
    renderDuel();
  }

  function startRound() {
    if (D.role !== 'host' || !D.opp) return;
    D.n++;
    const seed = (Math.random() * 4294967296) >>> 0;
    send({ t: 'start', n: D.n, seed });
    playRound(seed);
  }

  function playRound(seed) {
    D.myFinal = null; D.oppFinal = null; D.oppScore = 0; D.oppDone = false;
    D.again = { me: false, opp: false }; D.last = null; D.myRound = null; setMsg();
    D.myRating = Duels.rating(D.me.name);
    D.st = 'play';
    if (D.cfg.format === 'clock') {
      startGame({
        mode: 'clock', level: D.me.level, seed, duel: true, onFinish: onLocalFinish, onAbort: quitDuel,
        clockEnd: D.cfg.clockEnd, budget: Core.clockBudget(D.me.level), nTasks: 10, myIdx: D.role === 'host' ? 0 : 1,
        iStart: (D.n % 2 === 1) === (D.role === 'host'), oppName: D.opp.name,   // the starter alternates with every rematch
      });
      return;
    }
    startGame({
      mode: D.cfg.format === 'race' ? 'race' : 'sprint', level: D.me.level, seed,
      target: targetFor(D.me.level, D.cfg), duel: true, onFinish: onLocalFinish, onAbort: quitDuel,
    });
  }

  function quitDuel() {
    send({ t: 'quit' });
    cleanupPeer();
    D.st = 'ended'; setMsg('bad', t('youQuit'));
    show('duel'); renderDuel();
  }

  async function onLocalFinish(round, extra) {
    const finished = round.mode === 'sprint' ? true : !!extra.finished;
    D.myFinal = { score: round.score, time: round.durationMs, finished, perf: round.mode === 'sprint' ? Core.roundPerf(round) : null,
      level: round.level, rating: D.myRating };
    send(Object.assign({ t: 'final', n: D.n }, D.myFinal));
    round.player = D.me.name;
    round.duel = `${D.code}-${D.n}-${D.role}`;
    D.myRound = round;
    try { await Store.save(round); } catch (e) { /* the duel still counts */ }
    if (!D) return;
    if (!D.oppFinal) { D.st = 'waitFinal'; show('duel'); renderDuel(); }
    tryConclude();
  }

  function tryConclude() {
    if (!D || !D.myFinal || !D.oppFinal || D.st === 'result') return;
    const outcome = Core.duelOutcome(D.cfg, D.myFinal, D.oppFinal);
    const before = D.myRating;
    const rec = {
      id: `${D.code}-${D.n}-${D.role}`, at: new Date().toISOString(), format: D.cfg.format, levels: D.cfg.levels,
      me: { name: D.me.name, level: D.myFinal.level, score: D.myFinal.score, time: D.myFinal.time, perf: D.myFinal.perf, finished: D.myFinal.finished },
      opp: { name: D.opp.name, level: D.oppFinal.level, score: D.oppFinal.score, time: D.oppFinal.time, perf: D.oppFinal.perf,
        finished: D.oppFinal.finished, rating: D.oppFinal.rating },
      outcome,
    };
    Duels.add(rec);
    D.last = { rec, before, after: Duels.rating(D.me.name) };
    statsCache = null;
    D.st = 'result';
    show('duel'); renderDuel();
  }

  let typeTimer = 0, typeLast = 0;
  const Duel = {
    progress(score) { if (D) send({ t: 'prog', n: D.n, score }); },
    clockShow(turn, text) { if (D) send({ t: 'cshow', n: D.n, turn, text }); },
    clockType(v) {   // what you type, at most about eight times per second
      if (!D || !G || !G.clock) return;
      const turn = G.clock.mySolved + 1, now = Date.now();
      clearTimeout(typeTimer);
      if (now - typeLast >= 120) { typeLast = now; send({ t: 'ctype', n: D.n, turn, v }); }
      else typeTimer = setTimeout(() => { typeLast = Date.now(); if (D) send({ t: 'ctype', n: D.n, turn, v }); }, 120);
    },
    clockSkip(turn, text, pen) { if (D) send({ t: 'cskip', n: D.n, turn, text, pen }); },
    clockDone(turn, total, q, a, dt) { clearTimeout(typeTimer); if (D) send({ t: 'cdone', n: D.n, turn, total, q, a, dt }); },
    clockFlag(turn) { if (D) send({ t: 'cflag', n: D.n, turn }); },
    clockHud(text, active) {
      if (!D || !D.opp) return;
      const el = $('#hudOpp'), html = `${esc(D.opp.name)} <b>${text}</b>`;
      if (el.innerHTML !== html) el.innerHTML = html;
      el.classList.toggle('clock-on', active);
    },
    hud() {
      if (!D || !D.opp) return;
      const el = $('#hudOpp');
      if (D.cfg.format === 'clock') { el.innerHTML = `${esc(D.opp.name)} <b>–</b>`; return; }
      const tgt = D.cfg.format === 'race' ? `/${targetFor(D.opp.level, D.cfg)}` : '';
      el.innerHTML = `${esc(D.opp.name)} <b>${D.oppScore}${tgt}</b>${D.oppDone ? ' (' + esc(t('oppDone')) + ')' : ''}`;
    },
  };

  /* ----- duel screen ----- */
  function chips(id, cur) {
    return `<div class="lvls" id="${id}" role="radiogroup">` + Array.from({ length: Core.NLEVELS }, (_, k) => k + 1).map(i =>
      `<button type="button" role="radio" aria-checked="${i === cur}" data-l="${i}"><b>${i}</b>${esc(t('levels')[i - 1])}</button>`).join('') + '</div>';
  }
  function bindChips(id, onPick) {
    const el = $('#' + id);
    if (!el) return;
    el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      el.querySelectorAll('button').forEach(x => x.setAttribute('aria-checked', String(x === b)));
      onPick(+b.dataset.l);
    }));
  }
  const nameField = () => `<div class="field"><label for="dName">${esc(t('yourName'))}</label>` +
    `<input id="dName" maxlength="30" autocomplete="off" value="${esc(D.nameDraft ?? LS.get('kr.name', ''))}"></div>`;
  const msgHtml = () => `<p class="msg ${D.msgKind}" id="dMsg" aria-live="polite">${esc(D.msg)}</p>`;
  const raceNote = () => t('raceTargets', Array.from({ length: Core.NLEVELS }, (_, k) => k + 1).map(l => `${l}: ${Core.raceTarget(l, 'own')}`).join(', '));

  function renderDuel() {
    if (!D || document.body.dataset.screen !== 'duel') return;
    const sec = $('#duel');
    let h = `<h1 class="res-head">${esc(t('duelTitle'))}</h1>`;
    const back = `<div class="actions"><button class="btn" id="dBack" type="button">${esc(t('menu'))}</button></div>`;

    if (D.st === 'menu') {
      h += `<p class="lede">${esc(t('duelLede'))}</p>` + nameField();
      h += `<h2>${esc(t('format'))}</h2><div class="modes" id="dFormat" role="radiogroup">` +
        radioOpt('v', 'time', DF.format === 'time', t('fTime'), t('fTimeDesc')) + radioOpt('v', 'race', DF.format === 'race', t('fRace'), t('fRaceDesc')) +
        radioOpt('v', 'clock', DF.format === 'clock', t('fClock'), t('fClockDesc')) + '</div>';
      if (DF.format === 'clock') {
        h += `<h2>${esc(t('clockEnd'))}</h2><div class="modes" id="dClockEnd" role="radiogroup">` +
          radioOpt('v', 'flag', DF.clockEnd !== 'tasks', t('endFlag'), t('endFlagDesc', Core.clockBudget(DF.level) / 1000)) +
          radioOpt('v', 'tasks', DF.clockEnd === 'tasks', t('endTasks'), t('endTasksDesc')) + '</div>';
        h += `<h2>${esc(t('duelLevel'))}</h2>` + chips('dLvl', DF.level) + `<p class="note">${esc(t('twinNote'))}</p>`;
      } else {
        h += `<h2>${esc(t('levelsMode'))}</h2><div class="modes" id="dLevels" role="radiogroup">` +
          radioOpt('v', 'same', DF.levels === 'same', t('lSame'), t('lSameDesc')) + radioOpt('v', 'own', DF.levels === 'own', t('lOwn'), t('lOwnDesc')) + '</div>';
        h += `<h2>${esc(DF.levels === 'same' ? t('duelLevel') : t('yourLevel'))}</h2>` + chips('dLvl', DF.level);
        if (DF.levels === 'own' && DF.format === 'race') h += `<p class="note">${esc(raceNote())}</p>`;
      }
      h += `<div class="actions"><button class="btn primary" id="dCreate" type="button">${esc(t('create'))}</button></div>`;
      h += `<h2>${esc(t('orJoin'))}</h2><div class="save"><div class="field"><label for="dCode">${esc(t('codeLbl'))}</label>` +
        `<input id="dCode" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>` +
        `<button class="btn" id="dJoin" type="button">${esc(t('join'))}</button></div>`;
      h += msgHtml() + back;
    } else if (D.st === 'hosting') {
      const link = duelLink(D.code);
      h += `<p>${esc(t('shareLink'))}</p><div class="linkbox" id="dLink">${esc(link)}</div>`;
      h += `<div class="actions"><button class="btn" id="dCopy" type="button">${esc(t('copy'))}</button>` +
        (navigator.share ? `<button class="btn" id="dShare" type="button">${esc(t('share'))}</button>` : '') + '</div>';
      h += `<p>${esc(t('codeIs'))} <span class="code">${esc(D.code)}</span></p><p class="note">${esc(cfgText(D.cfg))}</p>`;
      if (D.opp) {
        h += `<p class="status">${esc(t('oppReady', D.opp.name, D.opp.level))}</p>` +
          `<div class="actions"><button class="btn primary" id="dStart" type="button">${esc(t('startDuel'))}</button></div>`;
      } else {
        h += `<p class="status">${esc(D.connected ? t('oppJoined') : t('waiting'))}</p>`;
      }
      h += relayHtml() + msgHtml() + `<div class="actions"><button class="btn" id="dBack" type="button">${esc(t('abort'))}</button></div>`;
    } else if (D.st === 'joining') {
      if (!D.cfg) {
        h += msgHtml();
      } else {
        h += `<p class="status">${esc(t('challenge', D.opp.name, cfgText(D.cfg)))}</p>` + nameField();
        if (D.cfg.levels === 'own') {
          h += `<h2>${esc(t('yourLevel'))}</h2>` + chips('dLvl', D.myLevel);
          if (D.cfg.format === 'race') h += `<p class="note">${esc(raceNote())}</p>`;
        }
        h += `<div class="actions"><button class="btn primary" id="dReady" type="button">${esc(t('ready'))}</button></div>` + relayHtml() + msgHtml();
      }
      h += `<div class="actions"><button class="btn" id="dBack" type="button">${esc(t('abort'))}</button></div>`;
    } else if (D.st === 'waitStart') {
      h += `<p class="status">${esc(t('waitStart', oppName()))}</p><p class="note">${esc(cfgText(D.cfg))}</p>` +
        `<div class="actions"><button class="btn" id="dBack" type="button">${esc(t('abort'))}</button></div>`;
    } else if (D.st === 'waitFinal') {
      h += `<p class="status">${esc(t('waitFinal', oppName()))}</p>` +
        `<div class="actions"><button class="btn" id="dBack" type="button">${esc(t('abort'))}</button></div>`;
    } else if (D.st === 'result' && D.last) {
      const { rec, before, after } = D.last;
      const head = rec.outcome === 1 ? t('win') : rec.outcome === 0 ? t('loss', rec.opp.name) : t('draw');
      const race = rec.format === 'race' || rec.format === 'clock';
      const row = s => `<tr><td>${esc(s.name)}</td><td class="n">${s.level}</td><td class="n">${s.score}</td>` +
        (race ? `<td class="n">${s.finished ? esc(fmtClock(s.time)) : esc(rec.format === 'clock' ? t('flagged') : t('notFinished'))}</td>` : `<td class="n">${Math.round(s.perf)}</td>`) + '</tr>';
      h += `<p class="duel-head${rec.outcome === 1 ? ' win' : ''}">${esc(head)}</p><p class="res-sub">${esc(cfgText(D.cfg))}</p>`;
      h += `<div class="sheet"><div class="scroll"><table><thead><tr><th>${esc(t('player'))}</th><th class="n">${esc(t('level'))}</th>` +
        `<th class="n">${esc(t('score'))}</th><th class="n">${esc(rec.format === 'clock' ? t('clockCol') : race ? t('time') : t('perf'))}</th></tr></thead><tbody>` +
        row(rec.me) + row(rec.opp) + '</tbody></table></div>' +
        `<p class="rating-msg">${esc(t('duelRating'))}: ${Math.round(after)} (${esc(signed(Math.round(after) - Math.round(before)))})</p>` +
        `<p class="note">${esc(t('duelSaved'))}</p></div>`;
      let status = '';
      if (D.again.me) status = t('rematchWait', oppName());
      else if (D.again.opp) status = t('rematchAsk', oppName());
      if (status) h += `<p class="status">${esc(status)}</p>`;
      h += msgHtml();
      h += '<div class="actions">' + (linked() && !D.again.me ? `<button class="btn primary" id="dAgain" type="button">${esc(t('rematch'))}</button>` : '') +
        `<button class="btn" id="dBack" type="button">${esc(t('menu'))}</button></div>`;
    } else {
      h += msgHtml() + back;
    }
    sec.innerHTML = h;

    const nameIn = $('#dName');
    if (nameIn) nameIn.addEventListener('input', e => { D.nameDraft = e.target.value; });
    const bindOpt = (id, key) => {
      const el = $('#' + id);
      if (el) el.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => { DF[key] = b.dataset.v; saveDF(); renderDuel(); const f = $(`#${id} [data-v="${DF[key]}"]`); if (f) f.focus(); }));
    };
    bindOpt('dFormat', 'format'); bindOpt('dLevels', 'levels'); bindOpt('dClockEnd', 'clockEnd');
    bindChips('dLvl', l => { if (D.st === 'menu') { DF.level = l; saveDF(); if (DF.format === 'clock') renderDuel(); } else D.myLevel = l; });
    const on = (id, fn) => { const el = $('#' + id); if (el) el.addEventListener('click', fn); };
    on('dCreate', () => hostDuel());
    on('dJoin', () => {
      const code = ($('#dCode').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (code.length !== 6) { setMsg('bad', t('codeBad')); renderDuel(); return; }
      joinDuel(code);
    });
    const codeIn = $('#dCode');
    if (codeIn) codeIn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#dJoin').click(); } });
    on('dCopy', async () => {
      const link = duelLink(D.code);
      try { await navigator.clipboard.writeText(link); setMsg('ok', t('copied')); }
      catch (e) { const r = document.createRange(); r.selectNodeContents($('#dLink')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      renderDuel();
    });
    on('dShare', () => { navigator.share({ title: t('duelTitle'), text: cfgText(D.cfg), url: duelLink(D.code) }).catch(() => {}); });
    on('dStart', () => startRound());
    const warmMic = () => { if (S.input === 'voice' && SR) Voice.start(() => {}, () => {}); };
    on('dReady', () => { warmMic(); guestReady(); });
    on('dAgain', () => {
      if (D.role === 'guest') warmMic();
      D.again.me = true;
      send({ t: 'again' });
      if (D.role === 'host' && D.again.opp) startRound(); else renderDuel();
    });
    on('dBack', () => { leaveDuel(); show('menu'); $('#duelBtn').focus(); });
  }

  /* ----- go ----- */
  applyLang();
  const hashCode = /^#duel=([A-Z0-9]{6})$/i.exec(location.hash || '');
  if (hashCode) {
    history.replaceState(null, '', location.pathname + location.search);
    openDuel(hashCode[1].toUpperCase());
  } else {
    show('menu');
  }
})();
</script>
</body>
</html>
