    ans.readOnly = coarse; ans.value = '';
    setTurnLine(true);
    $('#skipBtn').disabled = false;
    nextQ();
    Duel.clockShow(C.mySolved + 1, G.cur.text);
    if (!coarse) ans.focus();
  }
  function clockWait() {
    G.clock.myTurn = false;
    ans.readOnly = true; ans.classList.add('spect'); taskEl.classList.add('spect');
    $('#stuckLine').hidden = true;
    $('#skipBtn').disabled = true;
    setTurnLine(false);
    renderSpect();
  }
  function renderSpect() {
    const C = G.clock;
    taskEl.innerHTML = C.oppTask ? mk(C.oppTask) : '…';
    ans.value = C.oppTyped || '';
  }
  /* Move list: one row per turn, your tasks left, the opponent's right, like chess notation. */
  function renderMoves() {
    const C = G.clock, rows = Math.max(C.moves.me.length, C.moves.opp.length), first = Math.max(0, rows - 5);
    const cell = x => (x ? `${mk(x.q)} = ${mk(x.a)}<span class="tm">${esc(fmtS(x.dt))}</span>` +
      (x.sk ? `<br><span class="sk">${esc(t('skippedN', x.sk))}</span>` : '') : '');
    let html = `<table><thead><tr><th>${esc(t('you'))}</th><th>${esc(C.oppName)}</th></tr></thead><tbody>`;
    for (let i = first; i < rows; i++) html += `<tr><td>${cell(C.moves.me[i])}</td><td>${cell(C.moves.opp[i])}</td></tr>`;

  }
  function clockEndMyTurn() {
    const C = G.clock;

  /* Messages from the opponent's turn. Each device times only its own turns, so network delay costs nobody time. */
  function clockOpp(m) {
    if (!G || !G.clock) return;
    const C = G.clock, turn = num(m.turn);
    if (turn !== C.oppSolved + 1) return;   // late or out of order
    if (m.t === 'cshow' || m.t === 'cskip') {
      if (C.myTurn) return;
      C.oppTask = String(m.text || '').slice(0, 80); C.oppTyped = '';
      if (m.t === 'cshow') C.oppTurnStart = performance.now(); else C.oppExtra += num(m.pen);
      if (G.running) renderSpect();
    } else if (m.t === 'ctype') {
      if (C.myTurn) return;
      C.oppTyped = String(m.v || '').slice(0, 30);
      if (G.running) renderSpect();
    } else if (m.t === 'cdone') {
      C.oppUsed = num(m.total); C.oppExtra = 0; C.oppSolved = turn; C.oppTurnStart = 0; C.oppTask = ''; C.oppTyped = '';
      C.moves.opp.push({ q: String(m.q || '').slice(0, 80), a: String(m.a || '').slice(0, 40), dt: num(m.dt), sk: num(m.sk) });
      renderMoves();
      if (!G.running) return;
      clack();
      clockMyTurn();
    } else if (m.t === 'cflag') {
      C.oppUsed = C.oppBudget;
      if (G.running) finish({ finished: true });
    }
  }
  /* One clock card: time left, active frame, red below 10 s, bar = time left. Each player has their own budget. */
  function card(who, time, on, low, frac, solved) {
    const C = G.clock, key = [time, on, low, Math.round(Math.max(0, Math.min(1, frac)) * 200), solved].join('|');
    if (C.shown[who] === key) return;
    C.shown[who] = key;
    $('#cc' + who + 'Time').textContent = time;
    $('#cc' + who + 'Turn').textContent = on ? '● ' + t('turnMark') : '';
    $('#cc' + who + 'Bar').style.transform = `scaleX(${Math.max(0, Math.min(1, frac))})`;
    $('#cc' + who + 'Solved').textContent = t('solvedN', solved);
    const el = $('#cc' + who);
    el.classList.toggle('on', on); el.classList.toggle('low', low);
  }
  function clockTick(now) {
    const C = G.clock;
    const mine = C.used + (C.myTurn ? now - C.turnStart : 0);
    const theirs = C.oppUsed + C.oppExtra + (!C.myTurn && C.oppTurnStart ? now - C.oppTurnStart : 0);
    if (C.myTurn && mine >= C.budget) {   // out of time: this player loses
      C.used = C.budget; C.myTurn = false;
      Duel.clockFlag(C.mySolved + 1);
      finish({ finished: false });
      return true;
    }

    return false;
  }
  function paintClocks(mine, theirs, myTurn, started) {
    const C = G.clock, B = C.budget, OB = C.oppBudget;
    card('Me', fmtLeft(B - mine), started && myTurn, B - mine <= 10000, 1 - mine / B, C.mySolved);
    card('Opp', fmtLeft(OB - theirs), started && !myTurn, OB - theirs <= 10000, 1 - theirs / OB, C.oppSolved);
  }

  /* ----- buzzer duel: both get the same task, whoever solves it first scores -----
     Network delay must not decide who was first, so each device times a task from the moment it appears on its own screen
     (like the chess clock) and sends exactly one report per task:
       's' solved after ms, 'k' skipped after ms,
       'p' passed: its own clock went past the opponent's solve time, or past the time left in a timed game, without a solution,
       'o' out of time: the opponent had skipped and the extra time ran out (counts as a skip).
     A device that hears "solved in t" keeps playing until its own clock reaches t, so a task that appeared later on its screen
     still gets the same time. After a skip, the other player may go on until BZ_SKIP_K times the task's estimated time
     (seconds for a player rated 1000) has passed since the task appeared, and at least BZ_SKIP_MIN after hearing of the skip.
     Both devices decide each task from the same two reports, so they always agree: the lower solve time scores, equal times
     score nothing. Game time = the sum of the deciding times (the winner's time, otherwise the later report), the same on both
     devices; the pauses between tasks don't count, and a timed game ends when it reaches the chosen minutes.
     Tries on the estimation levels: three are free, each further one locks the input for a second (instead of the time penalty).
     Buzzer duels only count for the duel rating: no saved round, no solo rating, no central data. */
  const BZ_PAUSE = 1200, BZ_SKIP_K = 3, BZ_SKIP_MIN = 5000;
  const bzLocked = () => !!(G && G.buzz && performance.now() < G.buzz.lock);
  const bzEst = () => 1000 * (Number.isFinite(G.cur.est) && G.cur.est > 0 ? G.cur.est : 60 / Core.RATING.ref[G.level - 1]);
  function bzLine(text, soft) {
    const el = $('#turnLine');
    el.hidden = !text; el.textContent = text || ''; el.classList.toggle('opp', !!soft);
  }
  function bzLimit() {   // [when this task ends for me on my own clock, what I report then]
    const B = G.buzz;
    let L = B.cap, r = 'p';
    if (B.oppSolve != null && B.oppSolve < L) L = B.oppSolve;
    if (B.deadline < L) { L = B.deadline; r = 'o'; }
    return [L, r];
  }
  function bzDue() {   // my time on this task is over: report it (true = nothing left to wait for)
    const B = G.buzz;
    if (!G.running || B.phase !== 'play') return true;
    const [L, r] = bzLimit();
    if (performance.now() - G.qStart < L) return false;
    bzReport(r, L);
    return true;
  }
  function bzArm() {   // a timer as well, because background tabs don't animate
    const B = G.buzz, g = G;
    clearTimeout(B.timer);
    const [L] = bzLimit();
    if (B.phase === 'play' && Number.isFinite(L)) B.timer = setTimeout(() => { if (G === g && !bzDue()) bzArm(); }, Math.max(0, L - (performance.now() - G.qStart)) + 5);
  }
  function bzNext() {
    const B = G.buzz;
    Object.assign(B, { phase: 'play', mine: null, oppSolve: null, deadline: Infinity, left: null, lock: 0, cap: B.limit ? B.limit - B.sum : Infinity });
    taskEl.classList.remove('spect'); ans.classList.remove('spect');
    $('#skipBtn').disabled = false;
    bzLine('');
    nextQ();
    ans.readOnly = coarse;
    if (!coarse) ans.focus();
    bzArm();
    if (B.opp.has(B.k)) bzOpp();   // the opponent may have reported this task already
  }
  function bzEnd(kind) {   // solved ('s') or skipped ('k'); after the end of my time on this task it counts as that end
    const [L, r] = bzLimit(), e = performance.now() - G.qStart;
    if (e > L) bzReport(r, L); else bzReport(kind, e);
  }
  function bzReport(r, ms) {
    const B = G.buzz;
    if (B.phase !== 'play') return;
    B.mine = { r, ms: Math.max(0, Math.round(ms)) };
    B.phase = 'wait';
    clearTimeout(B.timer);
    ans.readOnly = true;
    $('#skipBtn').disabled = true;
    Duel.buzz(B.k, B.mine.r, B.mine.ms);
    if (bzDecide()) return;
    bzLine(r === 's' ? t('bzWait', fmtS(B.mine.ms), B.oppName) : r === 'k' ? t('bzSkipWait', B.oppName) : t('bzWaitOpp', B.oppName), r !== 's');
  }
  function bzHear(m) {   // a report from the opponent; reports of later tasks wait until this device gets there
    const B = G.buzz, k = num(m.k, -1), ms = num(m.ms, -1);
    if (!Number.isInteger(k) || k < B.k || !['s', 'k', 'p', 'o'].includes(m.r) || !(ms >= 0) || B.opp.has(k)) return;
    B.opp.set(k, { r: m.r, ms: Math.round(ms) });
    if (k === B.k) bzOpp();
  }
  function bzOpp() {   // the opponent's report for the current task
    const B = G.buzz, o = B.opp.get(B.k);
    if (B.phase === 'play') {
      if (o.r === 's') { B.oppSolve = o.ms; bzLine(t('bzOppSolved', B.oppName, fmtS(o.ms)), true); }
      else if (o.r === 'k') B.deadline = Math.max(BZ_SKIP_K * bzEst(), performance.now() - G.qStart + BZ_SKIP_MIN);
      if (!bzDue()) bzArm();
    }
    bzDecide();
  }
  function bzDecide() {   // both reports are there: who scores, then a short pause and the next task
    const B = G.buzz, me = B.mine, op = B.opp.get(B.k);
    if (B.phase !== 'wait' || !op) return false;
    const a = me.r === 's' ? me.ms : Infinity, b = op.r === 's' ? op.ms : Infinity;
    const w = a < b ? 1 : b < a ? 2 : 0;   // 1 = me, 2 = the opponent, 0 = nobody
    B.sum += w ? Math.min(a, b) : Math.max(me.ms, op.ms);
    if (w === 1) B.me++; else if (w === 2) B.op++;
    const q = G.cur.text, at = Core.ansText(G.cur);
    B.log.push({ q, a: at, o: G.cur.op, w, m: me, p: op });
    pushTrail({ who: w === 1 ? t('you') : w === 2 ? B.oppName : '', q, a: at, dt: Math.min(a, b), skipped: !w });
    bzLine(w === 1 ? (b < Infinity ? t('bzPtMe2', fmtS(a), fmtS(b)) : t('bzPtMe', fmtS(a)))
      : w === 2 ? (a < Infinity ? t('bzPtOpp2', B.oppName, fmtS(b), fmtS(a)) : t('bzPtOpp', B.oppName, fmtS(b)))
      : a < Infinity ? t('bzTie') : me.r === 'p' || op.r === 'p' ? t('bzTimeUp') : t('bzNone'), w !== 1);
    taskEl.classList.add('spect'); ans.classList.add('spect'); ans.value = at;   // the answer stays visible during the pause
    B.phase = 'pause';
    B.k++;
    Duel.hud();
    const g = G, over = B.limit ? B.sum >= B.limit : Math.max(B.me, B.op) >= B.n;
    G.timers.push(setTimeout(() => { if (G !== g) return; if (over) finish({ finished: true, bz: B }); else bzNext(); }, BZ_PAUSE));
    return true;
  }
  function bzTick(now) {   // game clock (counts down in timed games) and the countdown after the opponent skipped
    const B = G.buzz;
    if (B.phase === 'play') bzDue();
    const run = B.sum + (B.phase === 'play' ? Math.min(now - G.qStart, B.cap) : B.phase === 'wait' ? B.mine.ms : 0);
    let s;
    if (B.limit) {
      const rem = Math.max(0, B.limit - run), secs = Math.ceil(rem / 1000);
      s = rem < 5000 ? fmtLeft(rem) : B.limit > 60000 ? fmtClock(secs * 1000) : String(secs);
      hudTime.classList.toggle('low', secs <= 10);
      setMargin(rem / B.limit, true);
    } else s = fmtClock(run);
    if (s !== G.lastTime) { hudTime.textContent = s; G.lastTime = s; }
    if (B.phase === 'play' && B.deadline < Infinity) {
      const left = Math.max(0, Math.ceil((B.deadline - (now - G.qStart)) / 1000));
      if (left !== B.left) { B.left = left; bzLine(t('bzOppSkipped', B.oppName, left), true); }
    }
  }
  function bzLock() {   // estimation levels: from the fourth try on, each wrong try locks the input for a second
    const B = G.buzz, g = G;
    B.lock = performance.now() + GUESS_PEN;
    ans.value = ''; G.prevVal = ''; G.grew = false;
    ans.classList.add('spect');
    const el = $('#hudPen');
    el.textContent = t('bzLocked', GUESS_PEN / 1000);
    el.classList.add('on');
    clearTimeout(penTimer);
    penTimer = setTimeout(() => { el.classList.remove('on'); if (G === g && B.phase === 'play') ans.classList.remove('spect'); }, GUESS_PEN);
  }

  /* ----- Mathefußball in the game loop (1.30) -----
     The match clock is the host's (G.ball.endAt, kept in step by Ball); every solve and skip is reported with Ball.solved.
     Skipping costs no time: the next task appears only after the level's skip penalty (Core.SKIP_S), and can't be read before.
     Estimation levels: from the fourth wrong try on, each try locks the input for a second (as in buzzer duels).
     A guest's own clock ends its game; the host's game ends when the host's referee blows the whistle (same clock). */
  const ballLocked = () => !!(G && G.ball && G.ball.lockKind && performance.now() < G.ball.lock);
  const inputLocked = () => bzLocked() || ballLocked();
  const ballBlocked = () => !!(G && G.ball && G.ball.lockKind === 'skip');
  function ballSkip() {
    const B = G.ball;
    record(true, G.input === 'voice' ? 'v' : 'k');
    G.skipped++;
    Ball.solved(G);
    B.lock = performance.now() + Core.SKIP_S[G.level] * 1000; B.lockKind = 'skip'; B.left = null;
    G.cur = null;
    taskEl.className = 'task count'; taskEl.textContent = '…';
    ans.value = ''; G.prevVal = ''; G.grew = false; ans.classList.add('spect');
    $('#stuckLine').hidden = true;
    $('#skipBtn').disabled = true;
  }
  function ballUnblock() {
    const B = G.ball;
    B.lockKind = ''; B.left = null;
    bzLine('');
    ans.classList.remove('spect');
    $('#skipBtn').disabled = false;
    taskEl.className = 'task';
    nextQ();
    if (!coarse) ans.focus();
  }
  function ballTry() {   // one try too many on an estimation level
    const B = G.ball, g = G;
    B.lock = performance.now() + GUESS_PEN; B.lockKind = 'try';
    ans.value = ''; G.prevVal = ''; G.grew = false;
    ans.classList.add('spect');
    const el = $('#hudPen');
    el.textContent = t('bzLocked', GUESS_PEN / 1000);
    el.classList.add('on');
    clearTimeout(penTimer);
    penTimer = setTimeout(() => { el.classList.remove('on'); if (G === g && B.lockKind === 'try') { B.lockKind = ''; if (!B.pauseTo) ans.classList.remove('spect'); } }, GUESS_PEN);
  }
  /* After a goal (1.31) the match clock stands still for a 5-second countdown (the host's PAUSE_MS). The task waits hidden and
     its time doesn't run, so task times stay fair; a skip block waits too. Input is closed meanwhile (canAct). */
  const ballPaused = () => !!(G && G.ball && G.ball.pauseTo);
  function ballPause(until) {
    const B = G.ball;
    if (!B.pauseTo) {
      B.pauseAt = performance.now();
      ans.value = ''; G.prevVal = ''; G.grew = false;
      ans.classList.add('spect');
      $('#skipBtn').disabled = true; $('#stuckLine').hidden = true;
      bzLine(''); B.left = null;
    }

    taskEl.className = 'task count';
  }
  function ballResume() {
    const B = G.ball, d = performance.now() - B.pauseAt;
    B.pauseTo = 0; B.cdShown = null;

    if (B.lockKind === 'skip') { B.lock += d; taskEl.textContent = '…'; return; }   // the block goes on; ballTick shows it
    if (B.lockKind === 'try') B.lockKind = '';
    taskEl.className = 'task';
    if (G.cur) taskEl.innerHTML = mk(G.cur.text);
    ans.classList.remove('spect');
    $('#skipBtn').disabled = false;
    if (!coarse) ans.focus();
  }
  function ballTick(now) {
    const B = G.ball, rem = Math.max(0, B.endAt - Math.max(now, B.pauseTo)), secs = Math.ceil(rem / 1000);
    if (B.gn) {   // first to n goals: the running clock counts up (endAt = its zero point) and stands still during countdowns
      const s = fmtClock(Math.floor(Math.max(0, Math.max(now, B.pauseTo) - B.endAt) / 1000) * 1000);
      if (s !== G.lastTime) { hudTime.textContent = s; G.lastTime = s; }
    } else {
      const s = rem < 5000 ? fmtLeft(rem) : B.runMs > 60000 ? fmtClock(secs * 1000) : String(secs);
      if (s !== G.lastTime) { hudTime.textContent = s; G.lastTime = s; }
      hudTime.classList.toggle('low', secs <= 10);
      setMargin(rem / B.runMs, true);
    }
    if (B.pauseTo && now >= B.pauseTo) ballResume();
    if (B.pauseTo) {   // the countdown after a goal, in the task's place and on the pitch
      const c = Math.ceil((B.pauseTo - now) / 1000);
      if (c !== B.cdShown) { B.cdShown = c; taskEl.textContent = String(c); Ball.paintLive(); }
    } else if (B.lockKind === 'skip') {
      if (now < B.lock) {
        const left = Math.ceil((B.lock - now) / 1000);
        if (left !== B.left) { B.left = left; bzLine(t('ballBlocked', left), true); }
      } else ballUnblock();
    } else if (!G.stuckShown && G.cur && now - G.qStart > STUCK_S[G.level] * 1000) {
      G.stuckShown = true;
      const el = $('#stuckLine');
      el.textContent = t('stuckBall', Core.SKIP_S[G.level], coarse);
      el.hidden = false;
    }
    if (!B.gn && rem <= 0 && !B.host) finish({});
  }

  function stopTimers() {
    G.running = false;
    cancelAnimationFrame(G.raf);
    G.timers.forEach(clearTimeout);
    Voice.stop();
    ans.blur();
  }

  function finish(extra = {}) {
    if (!G) return;
    const now = performance.now();
    const wasRunning = G.running;
    stopTimers();
    const dur = G.clock ? Math.round(G.clock.used) : timed(G.mode) ? G.runMs : Math.round((wasRunning ? now - G.t0 : 0) + G.penalty);
    taskEl.classList.remove('spect'); ans.classList.remove('spect'); $('#turnLine').hidden = true;
    const round = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      v: 2, player: '', mode: G.mode, level: G.level, input: G.input, lang,
      seed: G.seed, startedAt: G.startedAt || new Date().toISOString(), durationMs: dur,
      score: G.score, skipped: G.skipped, items: G.items,
    };
    if (G.mode === 'race') round.target = G.target;
    round.ts = Core.TASKSET;
    if (G.mode !== 'train') round.skipPen = Core.SKIP_S[G.level] * 1000;
    if (G.guessPen) round.guessPen = G.guessPen;
    if (wasRunning && G.cur && !(G.mode === 'race' && extra.finished) && !(G.clock && !G.clock.myTurn)) {
      round.open = { q: G.cur.text, a: Core.ansText(G.cur), o: G.cur.op, t: Math.round(now - G.qStart), c: G.curC };
      if (G.curFirst != null) round.open.f = Math.round(G.curFirst - G.qStart);
      if (ans.value.trim()) round.open.last = ans.value.trim().slice(0, 30);
      if (G.curNm.length) round.open.nm = G.curNm.slice();
    }
    if ((round.items.length || round.open) && !G.buzz && !G.ball) Central.queue(round);   // Mathefußball: unrated, nothing sent either   // buzzer: lost tasks have no own time, so nothing goes to the central data
    if (!G.duel) {
      const seen = round.items.map(i => i.q).concat(round.open ? [round.open.q] : []);
      const key = 'kr.recent.' + G.level;
      LS.set(key, LS.get(key, []).filter(q => !seen.includes(q)).concat(seen).slice(-100));
    }
    const cb = G.onFinish;
    G = null;
    if (cb) cb(round, extra); else showResults(round, false);
  }

  function abortGame() {
    if (!G) return;
    stopTimers();
    const cb = G.onAbort;
    G = null;
    if (cb) { cb(); return; }
    show('menu');
    $('#startBtn').focus();
  }

  function stop() {
    if (!G) return;
    if (G.mode === 'train' && G.running && !G.duel) finish(); else abortGame();
  }
  $('#stopBtn').addEventListener('click', stop);
  $('#skipBtn').addEventListener('click', () => { skipQ(); if (!coarse) ans.focus(); });

  function renderHints() {
    const pen = skipPenMs() / 1000;
    const h = coarse ? [] : [t('hintEnter'), G.buzz ? t('hintSkipBz') : G.ball ? t('hintSkipBall', Core.SKIP_S[G.level]) : t('hintSkip', pen),
      G.ball ? t('hintEscBall', G.ball.host) : t('hintEsc', G.mode)];   // phones: no room, the stuck hint names the penalty when needed
    if (G.input === 'voice' && !coarse) h.unshift(t('hintVoice'));
    if (G.mode === 'clock' && !coarse) h.unshift(t('hintClock'));
    if (Core.TOL_LEVELS.includes(G.level)) h.unshift(G.buzz || G.ball ? t('hintTolBz') : t('hintTol'));
    $('#hints').innerHTML = h.map(x => `<p>${esc(x)}</p>`).join('');
  }

  function buildPad() {
    const pad = $('#pad');
    pad.hidden = !coarse;
    if (!coarse) return;
    const d = lang === 'de' ? ',' : '.';
    const keys = [
      ['7'], ['8'], ['9'], ['back', '⌫', 'fn'],
      ['4'], ['5'], ['6'], ['enter', t('clearKey'), 'fn'],
      ['1'], ['2'], ['3'], ['skip', t('skipKey'), 'fn'],
      ['-', '−'], ['0'], [d], ['e', 'e', Core.TOL_LEVELS.includes(G.level) ? '' : 'off'],
    ];
    pad.innerHTML = keys.map(([k, label, cls]) =>
      `<button type="button" data-k="${esc(k)}" class="${cls || ''}">${esc(label || k)}</button>`).join('');
  }
  $('#pad').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || !canAct()) return;
    const k = b.dataset.k;
    if (k === 'enter') return pressEnter();
    if (k === 'skip') return skipQ();
    const v = ans.value;
    if (k === 'back') ans.value = v.slice(0, -1);
    else if (k === '-') {
      if (/e$/i.test(v)) ans.value = v + '-';              // exponent sign: 1,5e-4
      else if (/e-$/i.test(v)) ans.value = v.slice(0, -1); // pressed again: remove it
      else ans.value = v.startsWith('-') ? v.slice(1) : '-' + v;
    } else if (k === 'e') {
      if (/\d$/.test(v) && !/e/i.test(v)) ans.value = v + 'e';
    } else ans.value = v + k;

  });

  ans.addEventListener('keydown', e => {
    if (e.isComposing) return;
    if (e.key === 'Enter') { e.preventDefault(); pressEnter(); }
    else if (e.key === 'Tab') { e.preventDefault(); skipQ(); }
    else if (e.key === 'Escape') { e.preventDefault(); stop(); }
  });
  ans.addEventListener('input', e => { if (!e.isComposing) onType('k'); });
  ans.addEventListener('compositionend', () => onType('k'));
  ans.addEventListener('animationend', () => ans.classList.remove('wrong'));
  document.addEventListener('pointerdown', e => {
    if (coarse || document.body.dataset.screen !== 'game' || e.target === ans || e.target.closest('button, a, input, select')) return;
    e.preventDefault(); ans.focus();
  });

  document.addEventListener('keydown', e => {
    const scr = document.body.dataset.screen;
    const tag = e.target && e.target.tagName;
    if (scr === 'game') {
      if (e.target === ans) return;
      if (e.key === 'Escape') { e.preventDefault(); stop(); return; }
      if (!G || !G.running || coarse || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'Enter') { e.preventDefault(); ans.focus(); pressEnter(); }
      else if (e.key === 'Tab') { e.preventDefault(); ans.focus(); skipQ(); }
      else if (e.key.length === 1 || e.key === 'Backspace') ans.focus();
      return;
    }
    if (scr === 'menu' && tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      if (/^[1-8]$/.test(e.key)) { e.preventDefault(); setLevel(+e.key); }
      else if (e.key === 'Enter' && (e.target === document.body || e.target === document.documentElement)) { e.preventDefault(); startGame(); }
    }
  });
  /* ----- analysis ----- */
  /* Final stretch: performance in the last 20 seconds of a 60-second run (last third in training and races)
     compared with the part before. Every solved task gives y = ln(time / (1.13 * estimated time)); a segment's
     performance is 1000 - (300 / ln 2) * mean(y), the same scale as the rating (1000 = reference pace).

          else { const x = (th - 45) * R, u = tsm(Math.abs(x)) * Math.sign(x);
            s = `tan ${th}° = (1 + tan ${th - 45}°) / (1 − tan ${th - 45}°) ≈ (1${tSg(u)}) / (1${tSg(-u)}) ≈ ${tN((1 + u) / (1 - u))}`.replace('tan -', 'tan \u2212'); }
          return esc(s) + ` <span class="know">(${esc(know)})</span>`;
        }
        const L = [0, 30, 45, 60, 90].reduce((p, c) => (Math.abs(c - th) < Math.abs(p - th) ? c : p), 0), d = (th - L) * R;
        const sL = Math.sin(L * R), cL = Math.cos(L * R);
        if (L === 0) {   // small angle: sin x ≈ x − x³/6, cos x ≈ 1 − x²/2
          const v0 = f === 'sin' ? d - d ** 3 / 6 : 1 - d * d / 2;
          const s0 = f === 'sin' ? `sin ${th}° ≈ x − x³/6 = ${tN(d)} − ${tN(d ** 3 / 6)} ≈ ${tN(v0)}` : `cos ${th}° ≈ 1 − x²/2 = 1 − ${tN(d * d / 2)} ≈ ${tN(v0)}`;
          return `${s0} (x = ${th}° ≈ ${tN(d)}) <span class="know">(${esc(know)})</span>`;
        }
        const v = f === 'sin' ? sL + cL * d - sL * d * d / 2 : cL - sL * d - cL * d * d / 2;
        const ad = tN(Math.abs(d)), step = `${Math.abs(th - L)}° ≈ ${ad}`;
        const lin = L === 0
          ? (f === 'sin' ? `${th}° ≈ ${ad}` : `1 − ${ad}²/2`)
          : (f === 'sin' ? `sin ${L}° ${d >= 0 ? '+' : '−'} cos ${L}° · ${ad}` : `cos ${L}° ${d >= 0 ? '−' : '+'} sin ${L}° · ${ad}`);
        return `${f} ${th}° ≈ ${lin} ≈ ${tN(v)}` + (L === 0 ? '' : ` (${step})`) + ` <span class="know">(${esc(know)})</span>`;
      }
      if (o === 'recip') {
        const x = n[n.length - 1];
        const known = { 3: 0.3333, 6: 0.1667, 7: 0.1429, 9: 0.1111, 11: 0.0909, 12: 0.0833 };
        if (known[x]) return `1/${x} ≈ ${tN(known[x])}`;
        // nearest m = c·10^k whose reciprocal is known (1/1,5 = 0,6667; 1/1,25 = 0,8; 1/7 = 0,1429 …)
        const k10 = 10 ** Math.floor(Math.log10(x));
        const m = [1, 1.2, 1.25, 1.5, 2, 2.5, 3, 4, 5, 6, 7, 8, 9, 10].map(c => +(c * k10).toPrecision(6))
          .reduce((pb, c) => (Math.abs(Math.log(c / x)) < Math.abs(Math.log(pb / x)) ? c : pb));
        if (m === x) return `1/${tN(x)} = 1/${tN(x / k10)} : ${tN(k10)} ≈ ${tN(k10 / x)} : ${tN(k10)} = ${tN(1 / x)}`;
        const e = (x - m) / m;
        return `1/${x} = 1/${m} · 1/(1${tSg(e)}) ≈ ${tN(1 / m)} × (1${tSg(-e)}${tSg(e * e)}) ≈ ${tN((1 - e + e * e) / m)}`;
      }
      if (o === 'sci') {
        const [a, , m, b, , k] = n, p = a * b, ex = m + k;
        const norm = p >= 10 ? ` = ${tN(p / 10)}·10^{${ex + 1}}` : '';
        return mk(`${tN(a)} × ${tN(b)} = ${tN(p)}; ${tW('exp')}: ${m}${tSg(k).replace(' + ', ' + ')} = ${ex} → ${tN(p)}·10^{${ex}}${norm}`.replace(/-(\d)/g, '\u2212$1'));
      }
      if (o === 'powd') {
        const [B, e] = n, p = B - 1, big = p >= 0.1, l = p - p * p / 2 + (big ? p ** 3 / 3 : 0);
        return mk(`(1 + ${tN(p)})^{${e}} ≈ exp(${e} · (${tN(p)} − ${tN(p)}²/2${big ? ` + ${tN(p)}³/3` : ''})) = e^{${tN(e * l)}} ≈ ${tN(Math.exp(e * l))}`) +
          ` <span class="know">(${esc(tW('rule'))}: (1 + p)^n ≈ e^{np})</span>`.replace('^n', '<sup>n</sup>').replace('^{np}', '<sup>np</sup>');
      }
      if (o === 'est') {
        const [a, b] = n, r2 = v => Number(v.toPrecision(2)), A = r2(a);
        let Bv = r2(a * b / A);
        if (Math.abs(A * Bv - a * b) / (a * b) > 0.015) Bv = Number((a * b / A).toPrecision(3));
        return `${tN(a)} × ${tN(b)} ≈ ${tN(A)} × ${tN(Bv)} = ${tN(A * Bv)} (${tW('roundOpp')})`;
      }
    } catch (e) { return ''; }
    return '';
  }
  if (window.__KR_TEST) {   // only for automated tests
    window.__krTip = tipFor; window.__krAns = () => (G && G.cur ? Core.ansText(G.cur) : '');
    window.__krBz = () => (G && G.buzz ? { phase: G.buzz.phase, k: G.buzz.k, me: G.buzz.me, op: G.buzz.op, sum: G.buzz.sum, mine: G.buzz.mine,
      oppSolve: G.buzz.oppSolve, deadline: G.buzz.deadline, cap: G.buzz.cap, log: G.buzz.log, el: G.running ? performance.now() - G.qStart : null,
      task: G.cur ? G.cur.text : '', est: G.cur ? G.cur.est : null, lock: G.buzz.lock - performance.now() } : null);

  /* ----- results ----- */
  let curRound = null, curFromStats = false;

  function renderResults() {
    const r = curRound, A = analyze(r);
    const head = r.mode === 'sprint' ? (r.durationMs && r.durationMs !== 60000 ? t('resMin', r.score, r.durationMs / 60000) : t('resSprint', r.score))
      : r.mode === 'long' ? t('resLong', r.score) : t('resTrain', r.score, fmtClock(r.durationMs));
    const sub = [t('levelN', r.level, t('levels')[r.level - 1])];
    if (r.duel) sub.push(t('duelTag'));
    if (curFromStats) sub.push(r.player, fmtDate(r.startedAt));
    const kv = [];
    if (Core.rated(r)) kv.push([t('perf'), Math.round(Core.roundPerf(r))]);
    kv.push([t('median'), fmtS(A.median)], [t('fastest'), fmtS(A.min)], [t('slowest'), fmtS(A.max)]);
    if (A.hasNew) kv.push([t('think'), fmtS(A.think)], [t('entry'), fmtS(A.entry)], [t('clean'), pct(A.clean)]);
    kv.push([t('spread'), fmtRange(A.q1, A.q3)], [t('fatigue'), endText(A.end)], [t('skipped'), r.skipped]);
    if (r.mode !== 'sprint') kv.push([t('perMin'), dec(A.perMin.toFixed(1))]);

    let html = `<h1 class="res-head">${esc(head)}</h1><p class="res-sub">${sub.map(esc).join(SEP())}</p>` + kvHtml(kv);

    html += '<div class="sheet">';
    if (A.n) {
      html += `<section><h3>${esc(withUnit(t('hist')))}</h3>${histSvg(A.times)}</section>`;
      const pace = paceSvg(r);
      if (pace) html += `<section><h3>${esc(withUnit(t('paceTitle')))}</h3>${pace}<p class="note">${esc(t('paceLegend'))}</p></section>`;
      html += opsTableHtml(r.items);
      if (A.hasNew) {
        const nm = nearList([r]);
        html += `<section><h3>${esc(t('nearTitle'))}</h3>` + (nm.length
          ? `<ul class="nm-list">${nm.map(x => `<li><span>${nearExHtml(x)}</span><span class="kind">${esc(t('nearCat')[x.kind])}</span></li>`).join('')}</ul>`
          : `<p class="note">${esc(t('nearNone'))}</p>`) + '</section>';
      }
      const slow = A.solved.slice().sort((a, b) => b.t - a.t).slice(0, 5);
      html += `<section><h3>${esc(t('slowList'))}</h3><ol class="slow">` +
        slow.map(it => `<li><span>${mk(it.q)} = ${mk(it.a)}</span><span class="tm">${fmtS(it.t)}</span></li>`).join('') + '</ol>' +
        (r.open ? `<p class="note">${t('openTask', mk(r.open.q), mk(r.open.a), esc(fmtS(r.open.t)))}${r.open.last ? esc(t('openLast', r.open.last)) : ''}</p>` : '') + '</section>';
    } else {
      html += `<section><p class="empty">${esc(t('none'))}</p>` +
        (r.open ? `<p class="note">${t('openTask', mk(r.open.q), mk(r.open.a), esc(fmtS(r.open.t)))}${r.open.last ? esc(t('openLast', r.open.last)) : ''}</p>` : '') + '</section>';
    }
    html += allTasksHtml(r);
    html += '</div>';

    const me = curFromStats ? null : acctPlayer(), auto = !!me && !r._saved && !(r.mode === 'train' && !r.items.length);
    if (!curFromStats) {
      const names = LS.get('kr.names', []);
      if (r._saved) {
        html += `<p class="msg ok" id="saveMsg">${esc(r._acct ? t('savedAcct', r.player) : t('saved', r.player))}</p>`;
        if (r._ratingMsg) html += `<p class="rating-msg">${esc(r._ratingMsg)}</p>`;
      } else if (me) {   // signed in: the account played, the round is saved without asking (an empty training round is not)
        html += !auto ? `<p class="msg" id="saveMsg">${esc(t('notSavedEmpty'))}</p>`
          : r._saveErr ? `<p class="msg bad" id="saveMsg" aria-live="polite">${esc(t(r._saveErr))}</p>` +
            `<div class="actions"><button class="btn primary" id="retrySave" type="button">${esc(t('saveRetry'))}</button></div>`
          : `<p class="msg" id="saveMsg" aria-live="polite">${esc(t('saving'))}</p>`;
      } else {
        html += `<form class="save" id="saveForm" novalidate>` +
          `<div class="field"><label for="nameIn">${esc(t('name'))}</label>` +
          `<input id="nameIn" list="nameList" maxlength="30" autocomplete="off" placeholder="${esc(t('namePh'))}" value="${esc(r._draft ?? LS.get('kr.name', ''))}"></div>` +
          `<button class="btn primary" id="saveBtn" type="submit">${esc(t('save'))}</button>` +
          `<datalist id="nameList">${names.map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist></form>` +
          `<p class="msg${r._saveErr ? ' bad' : ''}" id="saveMsg" aria-live="polite">${r._saveErr ? esc(t(r._saveErr)) : ''}</p>`;
      }
      html += `<div class="actions"><button class="btn" id="againBtn" type="button">${esc(t('again'))}</button>` +
        `<button class="btn" id="menuBtn" type="button">${esc(t('menu'))}</button></div>`;
    } else {
      html += `<div class="actions"><button class="btn" id="backStatsBtn" type="button">${esc(t('backStats'))}</button>` +
        `<button class="btn" id="menuBtn" type="button">${esc(t('menu'))}</button>` +
        `<button class="btn danger" id="delBtn" type="button">${esc(t('del'))}</button></div>`;
    }

    $('#results').innerHTML = html;
    const form = $('#saveForm');
    if (form) {
      form.addEventListener('submit', e => { e.preventDefault(); saveCurrent(); });
      $('#nameIn').addEventListener('input', e => { r._draft = e.target.value; });
    }
    const retry = $('#retrySave'); if (retry) retry.addEventListener('click', () => { r._saveErr = null; renderResults(); });
    if (auto && !r._saving && !r._saveErr) saveCurrent(me);
    const again = $('#againBtn'); if (again) again.addEventListener('click', () => startGame());
    $('#menuBtn').addEventListener('click', () => { show('menu'); $('#startBtn').focus(); });
    const bs = $('#backStatsBtn'); if (bs) bs.addEventListener('click', () => { show('stats'); renderStats(); });
    const del = $('#delBtn');
    if (del) {
      let armed = 0;
      del.addEventListener('click', async () => {
        if (!armed) {
          del.textContent = t('confirmDel'); del.classList.add('armed');
          armed = setTimeout(() => { armed = 0; del.textContent = t('del'); del.classList.remove('armed'); }, 4000);
          return;

        clearTimeout(armed); del.disabled = true;
        try {
          await Store.remove(r.id);
          if (statsCache) statsCache = statsCache.filter(x => x.id !== r.id);
          show('stats'); renderStats();
          ioMsg('ok', t('deleted'));
        } catch (e) { del.disabled = false; del.textContent = t('del'); del.classList.remove('armed'); armed = 0; }
      });
    }

  function ratingMsgFor(all, name) {
    const ser = Core.ratingSeries(all.filter(x => x.player === name));
    const last = ser[ser.length - 1], prev = ser.length > 1 ? ser[ser.length - 2] : null;
    if (!last) return '';
    return prev
      ? t('ratingAfter', name, Math.round(last.rating), signed(Math.round(last.rating) - Math.round(prev.rating)))
      : t('ratingFirst', name, Math.round(last.rating));
  }

  function rememberName(name) {
    LS.set('kr.name', name);
    const names = LS.get('kr.names', []);
    if (!names.includes(name)) { names.push(name); LS.set('kr.names', names.slice(-30)); }
  }

  /* Save the shown round: with the typed name, or (auto = the signed-in account's name) right after the round. */
  async function saveCurrent(auto) {
    const r = curRound;
    if (!r || r._saved || r._saving) return;
    const input = $('#nameIn'), msg = $('#saveMsg'), btn = $('#saveBtn');
    const name = auto || acctName(clip(input.value));
    if (!name) { msg.className = 'msg bad'; msg.textContent = t('nameNeeded'); input.focus(); return; }
    r._saving = true; r._saveErr = null;
    if (!auto) { btn.disabled = true; input.disabled = true; msg.className = 'msg'; msg.textContent = t('saving'); }
    const doc = Object.assign({}, r, { player: name });
    for (const k of ['_saved', '_draft', '_ratingMsg', '_saving', '_saveErr', '_acct']) delete doc[k];
    const here = () => curRound === r && document.body.dataset.screen === 'results';
    try {
      await Store.save(doc);
      r.player = name; r._saved = true; r._acct = !!auto;
      rememberName(name);
      try {
        const all = await Store.list();
        statsCache = all;
        if (Core.rated(doc)) r._ratingMsg = ratingMsgFor(all, name);
      } catch (e) { /* the rating line is optional */ }
      r._saving = false;
      if (here()) {
        const ae = document.activeElement, busy = ae && ae !== document.body && !ae.closest('[hidden]');   // auto: don't take the focus from something visible
        renderResults();
        const a = $('#againBtn'); if (a && (!auto || !busy)) a.focus({ preventScroll: true });
      }
    } catch (e) {
      r._saving = false;
      r._saveErr = e && e.code === 'quota_exceeded' ? 'quota' : 'saveFail';
      if (here()) { renderResults(); const b = $('#retrySave') || $('#saveBtn'); if (b) b.focus({ preventScroll: true }); }
    }
  }

  function ratingChart(win, label) {   // points { rating, [perf], r: round } or { rating, [perf], at: ISO date }
    const W = 560, H = 220, L = 46, R = 14, T = 12, Bm = 30;
    const at = p => p.at || p.r.startedAt;
    const ys = win.flatMap(p => (p.perf == null ? [p.rating] : [p.rating, p.perf]));
    let lo = Math.floor(Math.min(...ys) / 100) * 100, hi = Math.ceil(Math.max(...ys) / 100) * 100;
    if (hi - lo < 200) { const m = (hi + lo) / 2; lo = Math.floor((m - 100) / 100) * 100; hi = lo + 200; }
    const step = hi - lo > 1200 ? 400 : hi - lo > 600 ? 200 : 100;
    const X = i => L + (W - L - R) * (win.length === 1 ? 0.5 : i / (win.length - 1));
    const Y = v => T + (H - T - Bm) * (1 - (v - lo) / (hi - lo));
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label || t('ratingTitle'))}">`;
    for (let v = lo; v <= hi; v += step) {
      s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"></line>` +
        `<text x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`;
    }
    s += win.map((p, i) => (p.perf == null ? '' : `<circle class="pdot" cx="${X(i).toFixed(1)}" cy="${Y(p.perf).toFixed(1)}" r="3"></circle>`)).join('');
    s += `<path class="rline" d="${win.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.rating).toFixed(1)).join(' ')}"></path>`;
    const last = win.length - 1;
    s += `<circle class="rdot" cx="${X(last).toFixed(1)}" cy="${Y(win[last].rating).toFixed(1)}" r="4.5"></circle>`;
    s += `<text x="${L}" y="${H - 8}">${esc(fmtDay(at(win[0])))}</text>` +
      `<text x="${W - R}" y="${H - 8}" text-anchor="end">${esc(fmtDay(at(win[last])))}</text>`;
    return s + '</svg>';
  }

  function ratingHtml(all, B, byInput) {
    const [a, b] = B;

    const howTo = `<details class="how"><summary>${esc(t('ratingHow'))}</summary>${t('ratingExplain', refList).map(p => `<p>${esc(p)}</p>`).join('')}</details>`;
    let h = '<div class="sheet"><section>';
    if (F.player !== '*') {
      h += `<h3>${esc(t('ratingTitle'))}</h3>`;
      const series = Core.ratingSeries(all.filter(r => r.player === F.player && byInput(r)));
      const upto = series.filter(p => b == null || ts(p.r) <= b);
      if (!upto.length) {
        h += `<p class="note">${esc(t('ratingNone'))}</p>`;
      } else {
        const cur = upto[upto.length - 1].rating;
        const prior = series.filter(p => a != null && ts(p.r) < a);
        const win = upto.filter(p => a == null || ts(p.r) >= a);
        const ref = prior.length ? prior[prior.length - 1].rating : (win.length ? win[0].rating : cur);
        const peak = Math.max(...upto.map(p => p.rating));
        h += kvHtml([[t('ratingNow'), Math.round(cur)], [t('ratingChange'), signed(Math.round(cur) - Math.round(ref))],
          [t('ratingPeak'), Math.round(peak)], [t('ratingRuns'), upto.length]]);
        if (win.length >= 2) h += ratingChart(win) + `<p class="note">${esc(t('ratingLegend'))}</p>`;
      }
    } else {
      h += `<h3>${esc(t('board'))}</h3>`;
      const players = [...new Set(all.map(r => r.player).filter(Boolean))];
      const rows = players.map(p => {
        const ser = Core.ratingSeries(all.filter(r => r.player === p && byInput(r))).filter(x => b == null || ts(x.r) <= b);
        if (!ser.length) return null;
        return { p, cur: ser[ser.length - 1].rating, n: ser.length, peak: Math.max(...ser.map(x => x.rating)) };
      }).filter(Boolean).sort((x, y) => y.cur - x.cur);
      if (!rows.length) h += `<p class="note">${esc(t('ratingNone'))}</p>`;
      else h += `<div class="scroll"><table><thead><tr><th>${esc(t('rank'))}</th><th>${esc(t('player'))}</th>` +
        `<th class="n">${esc(t('ratingTitle'))}</th><th class="n">${esc(t('ratingPeak'))}</th><th class="n">${esc(t('ratingRuns'))}</th></tr></thead><tbody>` +
        rows.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.p)}</td><td class="n"><b>${Math.round(x.cur)}</b></td>` +
          `<td class="n">${Math.round(x.peak)}</td><td class="n">${x.n}</td></tr>`).join('') + '</tbody></table></div>';
    }
    return h + howTo + '</section></div>';
  }

  const heatHtml = rounds => heatGrid(heatAvg(rounds), t('heatNote'));
  function heatAvg(rounds) {
    const cell = {};
    for (const r of rounds) for (const it of r.items || []) {
      if (it.o !== 'mul' || it.s) continue;
      const m = /^(\d+) × (\d+)$/.exec(it.q);
      if (!m) continue;
      const x = +m[1], y = +m[2];
      if (x < 2 || x > 10 || y < 2 || y > 10) continue;
      const k = x + 'x' + y;   // in the order shown: 6 × 9 and 9 × 6 are different cells (before 1.28 they were one)
      (cell[k] || (cell[k] = [])).push(it.t);
    }
    const avg = {};
    for (const k in cell) avg[k] = cell[k].reduce((p, q) => p + q, 0) / cell[k].length;
    return avg;
  }
  /* Times-table grid: row = first number, column = second number. sym = data from a profile written before 1.28,
     where both orders were one cell (key "small×large"): shown mirrored. */
  function heatGrid(avg, note, sym) {
    const vals = Object.values(avg);
    if (vals.length < 8) return '';
    const sorted = vals.slice().sort(byNum);
    const rankOf = v => (sorted.length > 1 ? sorted.indexOf(v) / (sorted.length - 1) : 0);
    let g = '<div class="heat" role="table"><div class="h">×</div>';
    for (let c = 2; c <= 10; c++) g += `<div class="h">${c}</div>`;
    for (let rr = 2; rr <= 10; rr++) {
      g += `<div class="h">${rr}</div>`;
      for (let c = 2; c <= 10; c++) {
        const k = sym ? Math.min(rr, c) + 'x' + Math.max(rr, c) : rr + 'x' + c;
        if (avg[k] == null) { g += '<div class="e"></div>'; continue; }
        const f = rankOf(avg[k]);
        const bg = f < 0.5
          ? `color-mix(in srgb, var(--good) ${Math.round(8 + (0.5 - f) * 2 * 50)}%, var(--surface))`
          : `color-mix(in srgb, var(--red) ${Math.round(8 + (f - 0.5) * 2 * 55)}%, var(--surface))`;
        g += `<div style="background:${bg}" title="${rr} × ${c}: ${esc(fmtS(avg[k]))}">${esc(dec((avg[k] / 1000).toFixed(1)))}</div>`;
      }
    }
    const axes = t(sym ? 'heatSym' : 'heatAxes') + (lang === 'zh' ? '' : ' ') + note;
    return `<section><h3>${esc(withUnit(t('heat')))}</h3>${g}</div><p class="note">${esc(axes)}</p></section>`;
  }

  function steadyHtml(sel, times) {
    const end = endPhase(sel);
    const q1 = times.length >= 4 ? quant(times, 0.25) : null, q3 = times.length >= 4 ? quant(times, 0.75) : null;
    if (q1 == null && !end) return '';
    return `<section><h3>${esc(t('steadyTitle'))}</h3>` +
      kvHtml([[t('spread'), fmtRange(q1, q3)], [t('fatigue'), endText(end)]]) +
      `<p class="note">${esc(t('spreadNote'))}</p><p class="note">${esc(t('fatNote'))}</p></section>`;
  }

  /* a verified account name links to its public profile (when profiles can be shown here) */
  const pfName = (name, verified) => (verified && Board && Board.usable() ? `<button class="rowbtn" type="button" data-pf="${esc(name)}">${esc(name)}</button>` : esc(name));
  $('#statsBody').addEventListener('click', e => { const b = e.target.closest('[data-pf]'); if (b && Board) Board.openByName(b.dataset.pf, 'stats'); });
  const modeLabel = r => (r.mode === 'sprint' && r.durationMs && r.durationMs !== 60000 ? t('modeMin', r.durationMs / 60000) : (t('modeName')[r.mode] || r.mode));
  const outcomeWord = o => (o === 1 ? t('resWin') : o === 0 ? t('resLoss') : t('resDraw'));
  const duelScoreText = d => {
    if (d.format !== 'race' && d.format !== 'clock') return `${d.me.score} : ${d.opp.score}`;
    const left = d.format === 'clock' && d.clockEnd === 'flag' && d.budget;
    const one = (s, b) => (s.finished ? (left ? fmtLeft(b - s.time) : fmtClock(s.time)) : t(d.format === 'clock' ? 'flagged' : 'notFinished'));
    return `${one(d.me, d.budget)} : ${one(d.opp, d.oppBudget || d.budget)}`;
  };
  const duelFmtLabel = d => (d.format === 'clock' ? t('modeName').clock : d.format === 'race' ? t('fRaceN', d.raceN || 20)
    : d.format === 'buzz' ? `${t('fBuzz')} ${d.buzzEnd === 'time' ? t('modeMin', d.minutes || 1) : t('bzToN', d.buzzN || 10)}` : t('modeMin', d.minutes || 1));

  function duelStatsHtml(B) {
    const all = Duels.list();
    if (!all.length) return '';
    const [a, b] = B;
    const howTo = `<details class="how"><summary>${esc(t('duelHow'))}</summary>${t('duelExplain').map(p => `<p>${esc(p)}</p>`).join('')}</details>`;
    const wdl = list => t('recordVal', list.filter(x => x.d.outcome === 1).length, list.filter(x => x.d.outcome === 0.5).length, list.filter(x => x.d.outcome === 0).length);
    let h = `<div class="sheet"><section><h3>${esc(t('duelsTitle'))}</h3>`;
    if (F.player !== '*') {
      const ser = Core.duelSeries(all, F.player);
      if (!ser.length) return '';
      const upto = ser.filter(x => b == null || tsD(x.d) <= b);
      const win = upto.filter(x => a == null || tsD(x.d) >= a);
      const cur = upto.length ? upto[upto.length - 1].rating : 1000;
      h += kvHtml([[t('duelRating'), Math.round(cur)], [t('record'), wdl(win)], [t('nDuels'), win.length]]);
      if (win.length) {
        h += `<div class="scroll"><table><thead><tr><th>${esc(t('date'))}</th><th>${esc(t('opponent'))}</th><th>${esc(t('format'))}</th>` +
          `<th>${esc(t('result'))}</th><th class="n">${esc(t('standing'))}</th><th class="n">${esc(t('duelRating'))}</th></tr></thead><tbody>` +
          win.slice().reverse().slice(0, 30).map(x => `<tr><td>${esc(fmtDate(x.d.at))}</td><td>${pfName(x.d.opp.name, x.d.opp.v)}${x.d.opp.v ? vfBadge('ok') : ''}</td>` +
            `<td>${esc(duelFmtLabel(x.d))}</td><td>${esc(outcomeWord(x.d.outcome))}</td>` +
            `<td class="n">${esc(duelScoreText(x.d))}</td><td class="n">${Math.round(x.rating)}</td></tr>`).join('') + '</tbody></table></div>';
      }
    } else {
      const names = [...new Set(all.map(d => d.me && d.me.name).filter(Boolean))];
      const rows = names.map(n => {
        const s = Core.duelSeries(all, n).filter(x => b == null || tsD(x.d) <= b);
        return s.length ? { n, r: s[s.length - 1].rating, s } : null;
      }).filter(Boolean).sort((x, y) => y.r - x.r);
      if (!rows.length) return '';
      h += `<div class="scroll"><table><thead><tr><th>${esc(t('rank'))}</th><th>${esc(t('player'))}</th><th class="n">${esc(t('duelRating'))}</th>` +
        `<th>${esc(t('record'))}</th><th class="n">${esc(t('nDuels'))}</th></tr></thead><tbody>` +
        rows.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.n)}</td><td class="n"><b>${Math.round(x.r)}</b></td>` +
          `<td>${esc(wdl(x.s))}</td><td class="n">${x.s.length}</td></tr>`).join('') + '</tbody></table></div>';
    }
    return h + howTo + '</section></div>';
  }

  /* ----- Mathefußball results (1.31): the match statistics, shared by the result screen and the statistics list ----- */
  const bTeam = k => t('teamNames')[k];
  /* pie of the players' shares of the team's steps: the five biggest in shades of the team colour, the rest as one grey slice */
  function ballPie(k, list) {
    const tot = list.reduce((a, p) => a + p.k, 0);
    if (!tot) return `<p class="note">${esc(t('bsNoSteps'))}</p>`;
    const OP = [1, 0.74, 0.54, 0.38, 0.25], col = k ? 'var(--teamB)' : 'var(--teamA)';
    const top = list.filter(p => p.k > 0).sort((a, b) => b.k - a.k);
    const parts = top.slice(0, 5).map((p, i) => ({ label: p.n, v: p.k, me: p.me, st: `fill:${col};fill-opacity:${OP[i]}`, sw: `background:${col};opacity:${OP[i]}` }));
    const rest = top.slice(5);
    if (rest.length) parts.push({ label: t('bsOthers', rest.length), v: rest.reduce((a, p) => a + p.k, 0), st: 'fill:var(--soft);fill-opacity:.45', sw: 'background:var(--soft);opacity:.45' });
    const f = x => x.toFixed(4);
    let a0 = -Math.PI / 2, svg = '';
    for (const p of parts) {
      if (p.v >= tot) { svg += `<circle r="1" style="${p.st}"/>`; break; }
      const a1 = a0 + 2 * Math.PI * p.v / tot;
      svg += `<path style="${p.st}" d="M0 0L${f(Math.cos(a0))} ${f(Math.sin(a0))}A1 1 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${f(Math.cos(a1))} ${f(Math.sin(a1))}Z"/>`;
      a0 = a1;
    }
    return `<div class="bs-pie"><svg viewBox="-1.06 -1.06 2.12 2.12" aria-hidden="true">${svg}</svg><div><p class="bs-ph">${esc(t('bsShare'))}</p><ul class="bs-leg">` +
      parts.map(p => `<li${p.me ? ' class="me"' : ''}><i style="${p.sw}"></i><span class="pn">${esc(p.label)}</span><b>${Math.round(100 * p.v / tot)} %</b></li>`).join('') +
      '</ul></div></div>';
  }
  /* pace as in the solo performance: solves per minute against the level's reference (1000 = reference); null under 15 s of play */
  function ballPace(rec, p) {
    const ms = p.g ? p.o : rec.run;
    if (!(ms >= 15000)) return null;
    const ref = (Core.RATING.refs[rec.ts] || Core.RATING.refs[Core.TASKSET])[p.lv - 1];
    return Math.max(0, Core.RATING.base + Core.RATING.scale * Math.log2(Math.max(p.s * 60000 / ms, 0.5) / ref));
  }
  /* the team comparison rows (solved, clean, skipped, ball in the opponents' half, closest escape); also live on the spectator screen */
  function ballCompare(rec, live) {   // live: the spectator screen's compact cells (label above, value | bar | value)
    const T = [0, 1].map(k => rec.pl.filter(p => p.t === k)), sum = (k, f) => T[k].reduce((a, p) => a + p[f], 0);
    const pctOf = (a, b) => (b > 0 ? Math.round(100 * a / b) : null), pc = x => (x == null ? '–' : `${x} %`);
    const row = (label, a, b, va, vb, bar = true) => {
      const tot = (va || 0) + (vb || 0);
      const barH = bar ? `<i class="bs-bar${tot > 0 ? '' : ' none'}" style="--a:${tot > 0 ? (100 * (va || 0) / tot).toFixed(1) : 50}%"></i>` : '';
      if (live) return `<div class="ws"><span class="ws-l">${esc(label)}</span><b class="t0">${esc(a)}</b>${barH || `<span class="ws-u">${esc(t('bsStepsShort'))}</span>`}<b class="t1">${esc(b)}</b></div>`;
      return `<div class="bs-row"><b class="t0">${esc(a)}</b><span>${esc(label)}</span><b class="t1">${esc(b)}</b>` + barH + '</div>';
    };
    const s = [sum(0, 's'), sum(1, 's')], cl = [pctOf(sum(0, 'cl'), s[0]), pctOf(sum(1, 'cl'), s[1])], x = [sum(0, 'x'), sum(1, 'x')];
    const half = rec.run > 0 ? [pctOf(rec.po[2], rec.run), pctOf(rec.po[0], rec.run)] : [null, null];
    const esc2 = n => (n ? (live ? String(n) : t('bsSteps', n)) : '–');
    return row(t('ballSolved'), s[0], s[1], s[0], s[1]) + row(t('bsClean'), pc(cl[0]), pc(cl[1]), cl[0], cl[1]) +
      row(t('ballSkipped'), x[0], x[1], x[0], x[1]) + row(t('bsHalf'), pc(half[0]), pc(half[1]), half[0], half[1]) +
      row(t('bsEscape'), esc2(rec.es[0]), esc2(rec.es[1]), 0, 0, false);
  }
  function ballMatchHtml(rec) {
    const own = rec.cfg.levels === 'own', T = [0, 1].map(k => rec.pl.filter(p => p.t === k));
    const sum = (k, f) => T[k].reduce((a, p) => a + p[f], 0);
    const pctOf = (a, b) => (b > 0 ? Math.round(100 * a / b) : null);
    const pc = x => (x == null ? '–' : `${x} %`);
    const s = [sum(0, 's'), sum(1, 's')], cl = [pctOf(sum(0, 'cl'), s[0]), pctOf(sum(1, 'cl'), s[1])], x = [sum(0, 'x'), sum(1, 'x')];
    let h = `<div class="bs"><h3 class="bs-h">${esc(t('bsHead'))}</h3><div class="bs-teams"><span class="t0">${esc(bTeam(0))}</span><span class="t1">${esc(bTeam(1))}</span></div>` +
      ballCompare(rec) + '</div>';
    h += '<div class="sheet ball-res">' + [0, 1].map(k => {
      const list = T[k];
      return `<h3 class="th t${k}"><i class="tdot" aria-hidden="true"></i>${esc(bTeam(k))}</h3><div class="scroll"><table><thead><tr><th>${esc(t('player'))}</th>` +
        `<th class="n">${esc(t('ballSolved'))}</th><th class="n">${esc(t('bsClean'))}</th><th class="n">${esc(t('bsMd'))}</th><th class="n">${esc(t('bsSkip'))}</th>` +
        '</tr></thead><tbody>' +
        list.map(p => {
          const pace = own ? ballPace(rec, p) : null;
          return `<tr${p.me ? ' class="me"' : ''}><td>${esc(p.n)}${p.v ? vfBadge('ok') : ''}${p.g ? ` <span class="gone">${esc(t('ballGone'))}</span>` : ''}` +
            (own ? `<span class="sub"><span>${esc(t('ballLv', p.lv) + (pace == null ? '' : SEP().trim()))}</span>${pace == null ? '' : ` <span>${esc(t('bsPace') + ' ' + Math.round(pace))}</span>`}</span>` : '') +
            `</td><td class="n">${p.s}</td><td class="n">${pc(pctOf(p.cl, p.s))}</td><td class="n">${p.s ? fmtS(p.md) : '–'}</td><td class="n">${p.x}</td></tr>`;
        }).join('') +
        `<tr class="tot"><td>${esc(t('ballTotal'))}</td><td class="n">${s[k]}</td><td class="n">${pc(cl[k])}</td><td></td><td class="n">${x[k]}</td></tr></tbody></table></div>` +
        ballPie(k, list);
    }).join('') + `<p class="note">${esc(t('bsEscNote'))}${own ? ' ' + esc(t('bsPaceNote')) : ''}</p></div>`;
    return h;
  }
  const ballOutcome = d => (d.me.team < 0 ? null : d.g[d.me.team] > d.g[1 - d.me.team] ? 1 : d.g[d.me.team] < d.g[1 - d.me.team] ? 0 : 0.5);
  function ballStatsHtml(B) {
    const recs = Balls.list().map(cleanBall).filter(Boolean)
      .filter(d => (F.player === '*' || d.me.name === F.player) && inWin(tsD(d), B)).sort((a, b) => tsD(b) - tsD(a));
    if (!recs.length) return '';
    const mine = recs.filter(d => d.me.team >= 0), o = mine.map(ballOutcome);
    const solved = mine.reduce((a, d) => a + d.pl.filter(p => p.me).reduce((b, p) => b + p.s, 0), 0);
    const names = new Set(recs.map(d => d.me.name));
    let h = `<div class="sheet"><section><h3 class="ball-h">${BALL_ICON}<span>${esc(t('ballTitle'))}</span></h3>` +
      kvHtml([[t('bsRecord'), t('recordVal', o.filter(x => x === 1).length, o.filter(x => x === 0.5).length, o.filter(x => x === 0).length)],
        [t('ballSolved'), solved], [t('bsN'), recs.length]]) + '<div class="bmatches">';
    h += recs.slice(0, 30).map(d => {
      const me = d.pl.find(p => p.me), oc = ballOutcome(d);
      const what = d.me.team < 0 ? t('bsWatched') : `${bTeam(d.me.team)}, ${t('bsSolvedN', me ? me.s : 0)}`;
      const sub = [Ball.cfgText(d.cfg) + (d.cfg.end === 'goals' && d.run ? SEP() + t('ballPlayed', fmtClock(d.run)) : '') + (d.host ? SEP() + t('ballHostedBy', d.host) : '')];
      if (d.why === 'team' && d.wt >= 0) sub.push(t('ballEndTeam', bTeam(d.wt)));
      else if (d.why === 'host') sub.push(t('ballEndHost'));
      return `<details class="bmatch"><summary><span class="bm-d">${esc(fmtDate(d.at))}</span>` +
        `<span class="bm-s"><b class="t0">${d.g[0]}</b>:<b class="t1">${d.g[1]}</b></span>` +
        `<span class="bm-o">${esc(oc == null ? '' : outcomeWord(oc))}</span><span class="bm-m">${esc((names.size > 1 ? d.me.name + SEP() : '') + what)}</span></summary>` +
        sub.map(x => `<p class="note">${esc(x)}</p>`).join('') + `${ballMatchHtml(d)}</details>`;
    }).join('');
    return h + '</div>' + (recs.length > 30 ? `<p class="more">${esc(t('bsMore', 30))}</p>` : '') + '</section></div>';
  }

  function renderStatsBody() {
    const body = $('#statsBody');
    const all = statsCache || [];
    let html = `<p class="note">${esc(Store.kind === 'db' ? t('storeDb') : t('storeLocal'))}</p>`;
    if (!all.length && !Duels.list().length && !Balls.list().length) { body.innerHTML = html + `<p class="empty">${esc(t('empty'))}</p>`; return; }
    const B = bounds();
    const byInput = r => F.input === '*' || (r.input || 'keyboard') === F.input;
    const sel = all.filter(r => (F.player === '*' || r.player === F.player) && byInput(r) && inWin(ts(r), B) &&
      (F.mode === '*' || r.mode === F.mode) && (F.level === '*' || r.level === +F.level));

    html += ratingHtml(all, B, byInput);
    html += duelStatsHtml(B);
    html += ballStatsHtml(B);

    if (!sel.length) { body.innerHTML = html + `<p class="empty">${esc(t('noMatch'))}</p>`; return; }

    const solved = sel.flatMap(r => (r.items || []).filter(i => !i.s));
    const times = solved.map(i => i.t).sort(byNum);
    const thinks = solved.filter(i => Number.isFinite(i.f)).map(i => i.f).sort(byNum);
    const withC = solved.filter(i => Number.isFinite(i.c));
    const skipSum = sel.reduce((p, r) => p + (r.skipped || 0), 0);
    const playMs = sel.reduce((p, r) => p + (r.durationMs || 0), 0);
    html += `<h2>${esc(t('overview'))}</h2>` + kvHtml([
      [t('nRounds'), sel.length], [t('nSolved'), solved.length], [t('playTime'), fmtDur(playMs)],
      [t('medianTask'), fmtS(quant(times, 0.5))], [t('think'), thinks.length ? fmtS(quant(thinks, 0.5)) : '–'],
      [t('clean'), withC.length ? pct(withC.filter(i => i.c === 0).length / withC.length) : '–'], [t('skipped'), skipSum]]);

    html += '<div class="sheet">';
    const sprints = sel.filter(Core.rated);
    if (sprints.length) {
      const lv = {};
      for (const r of sprints) { const k = r.level + (r.mode === 'long' ? 'L' : ''); (lv[k] || (lv[k] = [])).push(r); }
      const mean = v => dec((v.reduce((p, q) => p + q, 0) / v.length).toFixed(1));
      html += `<section><h3>${esc(t('byLevel'))}</h3><div class="scroll"><table><thead><tr><th>${esc(t('level'))}</th>` +
        `<th class="n">${esc(t('runs'))}</th><th class="n">${esc(t('best'))}</th><th class="n">${esc(t('avgScore'))}</th>` +
        `<th class="n">${esc(t('last5'))}</th></tr></thead><tbody>` +
        Object.keys(lv).sort((x, y) => parseInt(x, 10) - parseInt(y, 10) || x.length - y.length).map(k => {
          const sc = lv[k].slice().sort((x, y) => ts(y) - ts(x)).map(r => r.score);
          const lvl = parseInt(k, 10);
          return `<tr><td>${lvl}: ${esc(t('levels')[lvl - 1])}${k.endsWith('L') ? ' (' + esc(t('modeName').long) + ')' : ''}</td><td class="n">${sc.length}</td><td class="n"><b>${Math.max(...sc)}</b></td>` +
            `<td class="n">${mean(sc)}</td><td class="n">${mean(sc.slice(0, 5))}</td></tr>`;
        }).join('') + '</tbody></table></div></section>';
    }
    if (times.length) html += `<section><h3>${esc(withUnit(t('hist')))}</h3>${histSvg(times)}</section>`;
    html += steadyHtml(sel, times);
    html += opsTableHtml(sel.flatMap(r => r.items || []));
    if (withC.length) html += nearTableHtml(sel);
    html += heatHtml(sel);

  }
  /* Race target: with own levels and scaling on, adjusted by the level's reference value (level 3 = the chosen number); otherwise the chosen number. */
  const targetFor = (level, cfg) => (cfg.format !== 'race' ? 0 : cfg.levels === 'own' && cfg.raceScale !== false
    ? Math.max(2, Math.round(pickRaceN(cfg.raceN) * Core.RATING.ref[level - 1] / Core.RATING.ref[2])) : pickRaceN(cfg.raceN));

  function setMsg(kind, text) { if (D) { D.msg = text || ''; D.msgKind = kind || ''; } }
  function relayStatus(up, total) {
    if (!D) return;
    D.relay = [up, total];
    const el = document.getElementById('dRelay');
    if (el) el.textContent = t('relayStatus', up, total);
  }
  const relayHtml = () => (D && D.relay ? `<p class="note" id="dRelay">${esc(t('relayStatus', D.relay[0], D.relay[1]))}</p>` : '');
  function send(m) { if (D && D.link) D.link.send(D.partner && !m.to ? Object.assign({ to: D.partner }, m) : m); }
  const rawSend = m => { if (D && D.link) D.link.send(m, true); };   // hello, busy, version: always under the code key
  function cleanupPeer() {
    if (!D) return;
    D.closing = true;
    D.timers.forEach(clearInterval); D.timers = [];
    if (D.link) D.link.close();
    D.link = null; D.connected = false;
    if (Lobby) Lobby.sync();
  }
  function leaveDuel() {
    if (!D) return;
    if (linked()) send({ t: 'quit' });
    cleanupPeer();
    D = null;
    if (Lobby) Lobby.sync();
  }
  window.addEventListener('pagehide', () => { if (linked()) send({ t: 'quit' }); });

  /* opts.post: set up a challenge for the lobby; opts.lobby: joining a challenge from the lobby.
     Duels that come from the lobby lead back to the main menu (where the lobby is) when they are over. */
  function openDuel(joinCode, opts = {}) {
    if (Ball) Ball.leave(true);
    if (D) leaveDuel();
    D = newD();
    D.mode = opts.post ? 'post' : 'private';
    D.lobby = !!(opts.post || opts.lobby);
    show('duel');
    if (joinCode) joinDuel(joinCode); else renderDuel();
  }

  /* Heartbeat: both sides send a ping every 3 s. The connection counts as lost after 20 s of silence,
     or 10 s after a server announced that the opponent dropped out, if nothing has arrived since.
     One server losing the opponent briefly is not enough, because the other servers or a reconnect keep it alive. */
  function startHeartbeat() {
    const d = D;
    d.lastHeard = Date.now(); d.goneAt = 0;
    d.timers.push(setInterval(() => {
      if (D !== d || !linked()) return;
      send({ t: 'ping' });
      const now = Date.now();
      if (now - d.lastHeard > 20000 || (d.goneAt && now - d.goneAt > 10000 && d.lastHeard < d.goneAt)) onLost();
    }, 3000));
  }

  function receive(m) {
    if (!D) return;
    if (D.partner && m.from !== D.partner) {
      if (D.role === 'host' && m.t === 'hello') rawSend({ t: 'busy', to: m.from });
      return;
    }
    if (m.t === 'gone') { if (D.partner && !D.goneAt) D.goneAt = Date.now(); return; }
    // once both devices have the duel's own key, only messages sealed with it count: anyone who knows the code could fake the others
    if (D.sk && m._k !== 'duel' && m.t !== 'hello' && m.t !== 'cfg') return;
    D.lastHeard = Date.now(); D.goneAt = 0;
    if (m.t === 'ping') return;
    onMsg(m);
  }

  async function hostDuel(post) {
    const name = acctPlayer() || acctName(clip(D.nameDraft ?? LS.get('kr.name', '')));
    if (!name) { setMsg('bad', t('needName')); renderDuel(); return; }
    if (D.st !== 'menu' || await nameRefused(D, name)) return;
    rememberName(name);
    D.role = 'host';
    D.cfg = normCfg(DF);
    D.me = { name, level: D.cfg.level, cm: D.cfg.clockMin };
    setMsg('', t('connecting')); renderDuel();
    const d = D, code = randCode();
    try {
      const ek = await newEk();
      const link = await openLink(code, m => { if (D === d) receive(m); }, (u, n) => { if (D === d) relayStatus(u, n); });
      if (D !== d) { link.close(); return; }
      D.link = link; D.code = code; D.ek = ek.pair; D.ekPub = ek.pub; D.st = 'hosting'; setMsg();
      if (post) {   // a lobby challenge: wait in the main menu, the lobby shows it to everyone
        const ser = Core.duelSeries(Duels.list(), name);
        D.lobbyR = ser.length ? Math.round(ser[ser.length - 1].rating) : 1000; D.lobbyN = ser.length;
        D.lobbyClaim = await Lobby.claim(D);   // signed-in players sign the entry, so it shows a ✓
        if (D !== d) return;
        D.posted = true;
        show('menu');
        if (Lobby) Lobby.sync();
        const b = $('#lbCancel'); if (b) b.focus({ preventScroll: true });
        return;
      }
      renderDuel();
    } catch (err) {
      if (D === d) { setMsg('bad', err && err.message === 'nolib' ? t('noLib') : t('netFail')); renderDuel(); }
    }
  }

  async function joinDuel(code) {
    D.role = 'guest'; D.code = code; D.st = 'joining'; setMsg('', t('connecting')); renderDuel();
    const d = D;
    try {
      const ek = await newEk();
      const link = await openLink(code, m => { if (D === d) receive(m); }, (u, n) => { if (D === d) relayStatus(u, n); });
      if (D !== d) { link.close(); return; }
      D.link = link; D.ek = ek.pair; D.ekPub = ek.pub;
    } catch (err) {
      if (D === d) { cleanupPeer(); D.closing = false; D.st = D.lobby ? 'ended' : 'menu'; setMsg('bad', err && err.message === 'nolib' ? t('noLib') : t('netFail')); renderDuel(); }
      return;
    }
    // say hello until the host answers; no answer within 15 s means there is no open duel with this code
    const hello = () => rawSend({ t: 'hello', v: 2, ts: Core.TASKSET, pv: DUEL_PV, ek: d.ekPub });
    const started = Date.now();
    const iv = setInterval(() => {
      if (D !== d || D.partner || !D.link) { clearInterval(iv); return; }
      if (Date.now() - started > 15000) {
        clearInterval(iv);
        cleanupPeer(); D.closing = false; D.st = D.lobby ? 'ended' : 'menu'; setMsg('bad', D.lobby ? t('lobbyGone') : t('notFound')); renderDuel();
        return;
      }
      hello();
    }, 2000);
    hello();
  }

  function onLost() {
    if (!D || D.closing) return;
    const wasPlaying = G && G.duel;
    if (wasPlaying) { stopTimers(); G = null; }
    if (D.st === 'result' || D.st === 'ended') { D.again = { me: false, opp: false }; D.connected = false; renderDuel(); return; }
    if (D.role === 'host' && D.st === 'hosting' && !wasPlaying) {
      D.timers.forEach(clearInterval); D.timers = [];
      D.partner = null; D.connected = false; D.opp = null;
      D.sk = null; D.peerEk = ''; D.cfgMsg = null; if (D.link) D.link.setKey(null);   // the next joiner agrees on a new key
      renderDuel(); return;
    }
    cleanupPeer();
    D.st = 'ended'; setMsg('bad', t('lost', oppName()));
    show('duel'); renderDuel();
  }

  function onMsg(m) {
    switch (m.t) {
      case 'hello':
        if (D.role !== 'host') return;
        if (num(m.ts) !== Core.TASKSET || num(m.pv) !== DUEL_PV) { rawSend({ t: 'version', to: m.from }); setMsg('bad', t('versionMismatch')); renderDuel(); return; }
        if (typeof m.ek !== 'string' || !EK_RE.test(m.ek)) return;
        if (!D.partner) {
          D.partner = m.from; D.peerEk = m.ek; D.connected = true; startHeartbeat(); if (D.posted && Lobby) Lobby.joined();
          hostGreet(D);
        } else if (D.cfgMsg) D.link.send(D.cfgMsg, true);   // still saying hello: the settings got lost, send them again
        renderDuel();
        break;
      case 'cfg':
        if (D.role !== 'guest' || !m.cfg || D.partner) return;
        if (num(m.ts) !== Core.TASKSET || num(m.pv) !== DUEL_PV) { rawSend({ t: 'version', to: m.from }); cleanupPeer(); D.st = 'menu'; setMsg('bad', t('versionMismatch')); renderDuel(); return; }
        if (typeof m.ek !== 'string' || !EK_RE.test(m.ek)) return;
        D.partner = m.from; D.peerEk = m.ek; D.connected = true; startHeartbeat();
        D.cfg = normCfg(m.cfg);
        D.opp = { name: clip(m.name) || '?', level: validLevel(m.level), cm: D.cfg.clockMin, vf: 'wait' };
        D.myLevel = D.cfg.levels === 'same' ? D.cfg.level : S.level;
        D.st = 'joining'; setMsg();
        D.skP = guestKey(D, m);
        renderDuel();
        break;
      case 'cshow': case 'ctype': case 'cskip': case 'cdone': case 'cflag':
        if (num(m.n) === D.n) clockOpp(m);
        break;
      case 'bz':   // buzzer: the opponent's report for one task
        if (G && G.buzz && G.duel && num(m.n) === D.n) bzHear(m);
        else if (num(m.n) > D.n && D.bzEarly.length < 50) D.bzEarly.push(m);   // came before the start of its round: kept for it
        break;
      case 'version':
        cleanupPeer(); D.st = 'ended'; setMsg('bad', t('versionMismatch')); renderDuel();
        break;
      case 'busy':   // from the lobby: someone else was faster; the result screen's "Menu" leads back to the lobby
        cleanupPeer(); D.st = D.lobby ? 'ended' : 'menu'; setMsg('bad', D.lobby ? t('lobbyTaken') : t('busy')); renderDuel();
        break;
      case 'ready':
        if (D.role !== 'host' || m._k !== 'duel') return;
        D.opp = { name: clip(m.name) || '?', level: D.cfg.levels === 'same' ? D.cfg.level : validLevel(m.level), cm: pickClockMin(m.cm), vf: 'wait' };
        checkOpp(D, m.idc, 'guest');
        renderDuel();
        break;
      case 'start':
        if (D.role !== 'guest') return;
        D.n = num(m.n, 1);
        playRound(num(m.seed) >>> 0);
        break;
      case 'prog':
        if (num(m.n) !== D.n) return;
        D.oppScore = num(m.score);
        Duel.hud();
        break;
      case 'final':
        if (num(m.n) !== D.n) return;
        D.oppFinal = { score: num(m.score), time: num(m.time), finished: !!m.finished, perf: m.perf == null ? null : num(m.perf),
          level: validLevel(m.level), rating: num(m.rating, 1000) };
        D.oppDone = true;
        if (G && G.duel && G.running) {
          if (D.cfg.format === 'race') finish({ finished: false });
          else if (D.cfg.format === 'clock') finish({ finished: true });   // the opponent ran out of time or both are done
          else Duel.hud();
        }
        tryConclude();
        break;
      case 'again':
        D.again.opp = true;
        if (D.role === 'host' && D.again.me) startRound(); else renderDuel();
        break;
      case 'quit': {
        if (D.st === 'result') {
          D.connected = false; D.again = { me: false, opp: false };
          setMsg('', t('oppLeft', oppName())); renderDuel();
          break;
        }
        const wasPlaying = G && G.duel;
        if (wasPlaying) { stopTimers(); G = null; }
        cleanupPeer();
        D.st = 'ended'; setMsg('bad', t('oppQuit', oppName()));
        show('duel'); renderDuel();
        break;
      }
      default:
    }
  }

  /* Host, after the first hello: compute the duel's own key, then send the settings with the host's half
     (still under the code key, the guest can't open anything else yet) and switch to the duel's key. */
  async function hostGreet(d) {
    const partner = d.partner;
    try {
      const sk = await sessKey(d.ek.privateKey, d.peerEk, d.code, d.ekPub, d.peerEk);
      const idc = Acct ? await Acct.claim('duel', d.me.name, idParts(d, 'host', d.me.name)) : null;
      if (D !== d || d.partner !== partner) return;
      d.cfgMsg = Object.assign({ t: 'cfg', v: 1, ts: Core.TASKSET, pv: DUEL_PV, cfg: d.cfg, name: d.me.name, level: d.me.level, ek: d.ekPub, to: partner }, idc ? { idc } : {});
      d.link.send(d.cfgMsg, true);
      d.link.setKey(sk); d.sk = sk;
    } catch (e) {   // the joiner's half is unusable: wait for someone else
      if (D === d && d.partner === partner) { d.timers.forEach(clearInterval); d.timers = []; d.partner = null; d.connected = false; d.peerEk = ''; renderDuel(); }
    }
  }
  /* Guest, after the settings: compute the same key and switch to it; then check the host's name. */
  async function guestKey(d, m) {
    try {
      const sk = await sessKey(d.ek.privateKey, d.peerEk, d.code, d.peerEk, d.ekPub);
      if (D !== d) return false;
      d.link.setKey(sk); d.sk = sk;
    } catch (e) {
      if (D === d) { cleanupPeer(); d.closing = false; d.st = d.lobby ? 'ended' : 'menu'; setMsg('bad', t('netFail')); renderDuel(); }
      return false;
    }
    checkOpp(d, m.idc, 'host');
    return true;
  }
  /* Is the opponent's name proven? 'ok' = signed by a device registered for exactly this name, otherwise 'no' (guest). */
  async function checkOpp(d, idc, role, retry = 2) {
    const name = d.opp && d.opp.name;
    let ok = false, unknown = false;
    try { ok = !!(idc && Acct && await Acct.check(idc, 'duel', name, idParts(d, role, name))); } catch (e) { unknown = true; }
    if (D !== d || !d.opp || d.opp.name !== name) return;
    d.opp.vf = ok ? 'ok' : 'no';
    paintOppVf();
    if (unknown && retry) setTimeout(() => checkOpp(d, idc, role, retry - 1), 4000);   // registry not reachable: try again
  }

  async function guestReady() {
    const d = D;
    if (!d || d.st !== 'joining') return;
    const name = acctPlayer() || acctName(clip(d.nameDraft ?? LS.get('kr.name', '')));
    if (!name) { setMsg('bad', t('needName')); renderDuel(); return; }
    if (await nameRefused(d, name) || d.st !== 'joining') return;
    rememberName(name);
    d.me = { name, level: d.cfg.levels === 'same' ? d.cfg.level : d.myLevel, cm: d.myClockMin };
    d.st = 'waitStart'; setMsg();
    renderDuel();
    if (!(await d.skP) || D !== d) return;   // without the duel's key the duel was given up (guestKey says why)
    const idc = Acct ? await Acct.claim('duel', name, idParts(d, 'guest', name)) : null;
    if (D !== d) return;
    send(Object.assign({ t: 'ready', name, level: d.me.level, cm: d.me.cm }, idc ? { idc } : {}));
  }

  function startRound() {
    if (D.role !== 'host' || !D.opp) return;
    D.n++;
    const seed = (Math.random() * 4294967296) >>> 0;
    send({ t: 'start', n: D.n, seed });
    playRound(seed);
  }

  function playRound(seed) {
    D.myFinal = null; D.oppFinal = null; D.oppScore = 0; D.oppDone = false;
    D.again = { me: false, opp: false }; D.last = null; D.myRound = null; setMsg();
    D.myRating = Duels.rating(D.me.name);
    D.st = 'play'; D.bzLog = null;
    if (D.cfg.format === 'buzz') {
      startGame({
        mode: 'buzz', level: D.me.level, seed, duel: true, onFinish: onLocalFinish, onAbort: quitDuel,
        buzz: { limit: D.cfg.buzzEnd === 'time' ? pickMin(D.cfg.minutes) * 60000 : 0, n: pickBuzzN(D.cfg.buzzN), oppName: D.opp.name },
      });
      const early = D.bzEarly.filter(m => num(m.n) === D.n);
      D.bzEarly = [];
      early.forEach(m => { if (G && G.buzz) bzHear(m); });
      return;
    }
    if (D.cfg.format === 'clock') {
      startGame({
        mode: 'clock', level: D.me.level, seed, duel: true, onFinish: onLocalFinish, onAbort: quitDuel,
        budget: sideBudget(D.me), oppBudget: sideBudget(D.opp), twins: D.me.level === D.opp.level, myIdx: D.role === 'host' ? 0 : 1,
        iStart: (D.n % 2 === 1) === (D.role === 'host'), oppName: D.opp.name,   // the starter alternates with every rematch
      });
      return;
    }
    startGame({
      mode: D.cfg.format === 'race' ? 'race' : 'sprint', level: D.me.level, seed, runMs: D.cfg.format === 'race' ? 0 : pickMin(D.cfg.minutes) * 60000,
      target: targetFor(D.me.level, D.cfg), duel: true, onFinish: onLocalFinish, onAbort: quitDuel,
    });
  }

  function quitDuel() {
    send({ t: 'quit' });
    cleanupPeer();
    D.st = 'ended'; setMsg('bad', t('youQuit'));
    show('duel'); renderDuel();
  }

  async function onLocalFinish(round, extra) {
    if (round.mode === 'buzz') {   // buzzer: only the duel record counts, the round is not saved (no solo rating)
      const B = extra.bz;
      D.bzLog = B ? B.log : []; D.bzLang = lang;
      D.myFinal = { score: B ? B.me : 0, time: B ? Math.round(B.sum) : 0, finished: true, perf: null, level: round.level, rating: D.myRating };
      send(Object.assign({ t: 'final', n: D.n }, D.myFinal));
      D.myRound = null;
      if (!D.oppFinal) { D.st = 'waitFinal'; show('duel'); renderDuel(); }
      tryConclude();
      return;
    }
    const finished = round.mode === 'sprint' ? true : !!extra.finished;
    D.myFinal = { score: round.score, time: round.durationMs, finished, perf: round.mode === 'sprint' ? Core.roundPerf(round) : null,
      level: round.level, rating: D.myRating };
    send(Object.assign({ t: 'final', n: D.n }, D.myFinal));
    round.player = D.me.name;
    round.duel = `${D.code}-${D.n}-${D.role}`;
    D.myRound = round;
    try { await Store.save(round); } catch (e) { /* the duel still counts */ }
    if (!D) return;
    if (!D.oppFinal) { D.st = 'waitFinal'; show('duel'); renderDuel(); }
    tryConclude();
  }

  function tryConclude() {
    if (!D || !D.myFinal || !D.oppFinal || D.st === 'result') return;
    const outcome = Core.duelOutcome(D.cfg, D.myFinal, D.oppFinal);
    const before = D.myRating;
    const rec = {
      id: `${D.code}-${D.n}-${D.role}`, at: new Date().toISOString(), format: D.cfg.format, levels: D.cfg.levels,
      minutes: pickMin(D.cfg.minutes), raceN: pickRaceN(D.cfg.raceN), raceScale: D.cfg.raceScale, clockEnd: 'flag', clockTime: D.cfg.clockTime,
      budget: sideBudget(D.me), oppBudget: sideBudget(D.opp),
      me: { name: D.me.name, level: D.myFinal.level, score: D.myFinal.score, time: D.myFinal.time, perf: D.myFinal.perf, finished: D.myFinal.finished },
      opp: { name: D.opp.name, level: D.oppFinal.level, score: D.oppFinal.score, time: D.oppFinal.time, perf: D.oppFinal.perf,
        finished: D.oppFinal.finished, rating: D.oppFinal.rating },
      outcome,
    };
    if (D.cfg.format === 'buzz') Object.assign(rec, { buzzEnd: D.cfg.buzzEnd, buzzN: pickBuzzN(D.cfg.buzzN) });
    if (D.opp.vf === 'ok') rec.opp.v = true;   // the opponent's name was verified (✓)
    Duels.add(rec);
    D.last = { rec, before, after: Duels.rating(D.me.name) };
    statsCache = null;
    D.st = 'result';
    show('duel'); renderDuel();
  }

  let typeTimer = 0, typeLast = 0;
  const Duel = {
    progress(score) { if (D) send({ t: 'prog', n: D.n, score }); },
    buzz(k, r, ms) { if (D) send({ t: 'bz', n: D.n, k, r, ms }); },
    clockShow(turn, text) { if (D) send({ t: 'cshow', n: D.n, turn, text }); },
    clockType(v) {   // what you type, at most about eight times per second
      if (!D || !G || !G.clock) return;
      const turn = G.clock.mySolved + 1, now = Date.now();
      clearTimeout(typeTimer);
      if (now - typeLast >= 120) { typeLast = now; send({ t: 'ctype', n: D.n, turn, v }); }
      else typeTimer = setTimeout(() => { typeLast = Date.now(); if (D) send({ t: 'ctype', n: D.n, turn, v }); }, 120);
    },
    clockSkip(turn, text, pen) { if (D) send({ t: 'cskip', n: D.n, turn, text, pen }); },
    clockDone(turn, total, q, a, dt, sk) { clearTimeout(typeTimer); if (D) send({ t: 'cdone', n: D.n, turn, total, q, a, dt, sk }); },
    clockFlag(turn) { if (D) send({ t: 'cflag', n: D.n, turn }); },
    clockHud(text, active) {
      if (!D || !D.opp) return;
      const el = $('#hudOpp'), html = `${esc(D.opp.name)} <b>${text}</b>`;
      if (el.innerHTML !== html) el.innerHTML = html;
      el.classList.toggle('clock-on', active);
    },
    hud() {   // progress bars: race = way to the target; timed run = relative to the leader (scaled by level when levels differ)
      if (!D || !D.opp || !G || !G.duel || G.clock) return;
      const race = D.cfg.format === 'race', ref = l => Core.RATING.ref[l - 1];
      let fm, fo, sm, so;
      if (G.buzz) {   // buzzer: points, as the way to the target or relative to the leader
        const B = G.buzz, mx = Math.max(B.me, B.op);
        if (B.limit) { fm = mx ? B.me / mx : 0; fo = mx ? B.op / mx : 0; sm = String(B.me); so = String(B.op); }
        else { fm = B.me / B.n; fo = B.op / B.n; sm = `${B.me}/${B.n}`; so = `${B.op}/${B.n}`; }
      } else if (race) {
        const tMe = G.target, tOpp = targetFor(D.opp.level, D.cfg);
        fm = G.score / tMe; fo = D.oppScore / tOpp; sm = `${G.score}/${tMe}`; so = `${D.oppScore}/${tOpp}`;
      } else {
        const vm = G.score / ref(G.level), vo = D.oppScore / ref(D.opp.level), mx = Math.max(vm, vo);
        fm = mx ? vm / mx : 0; fo = mx ? vo / mx : 0; sm = String(G.score); so = String(D.oppScore);
      }
      const clamp = f => Math.max(0, Math.min(1, f || 0));
      $('#dbnMe').textContent = t('you'); $('#dbnOpp').textContent = D.opp.name;
      $('#dbiMe').style.transform = `scaleX(${clamp(fm)})`; $('#dbiOpp').style.transform = `scaleX(${clamp(fo)})`;
      $('#dbsMe').textContent = sm;
      $('#dbsOpp').textContent = so + (D.oppDone && !G.buzz ? ' ✓' : '');
    },
  };

  /* ----- duel screen ----- */
  function chips(id, cur) {
    return `<div class="lvls" id="${id}" role="radiogroup">` + Array.from({ length: Core.NLEVELS }, (_, k) => k + 1).map(i =>
      `<button type="button" role="radio" aria-checked="${i === cur}" data-l="${i}"><b>${i}</b>${esc(t('levels')[i - 1])}</button>`).join('') + '</div>';
  }
  function bindChips(id, onPick) {
    const el = $('#' + id);
    if (!el) return;
    el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      el.querySelectorAll('button').forEach(x => x.setAttribute('aria-checked', String(x === b)));
      onPick(+b.dataset.l);
    }));
  }
  const nameField = () => (acctPlayer()

  const takenText = (typed, reg) => (typed.toLowerCase() === reg.toLowerCase() ? t('vfTaken', reg) : t('vfTakenLike', typed, reg));
  let vfTimer = 0;
